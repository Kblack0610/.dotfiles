# One bar widget that draws any waybar custom/* chip from config.base, so the Noctalia bar
# shows the same chips as waybar without a second copy of any. `desk chip` reads and runs
# the chip; chip.luau only draws what it prints. Usage: docs/desk.md, "Noctalia".
id = "dotfiles/chips"
name = "Dotfiles chips"
version = "1.0.0"
# 43: the newest API Noctalia 5.4.1 accepts, so no member below is gated off.
plugin_api = 43
author = "dotfiles"
license = "MIT"
dependencies = []
tags = ["bar"]
icon = "puzzle"
description = "Draws a waybar custom/* chip from config.base in the bar, and its tooltip in colour on click."

[[widget]]
id = "chip"
entry = "chip.luau"

  # middle: the chip's on-click-middle (timebox done), not Noctalia's default settings-open-widget.
  [widget.actions]
  middle = "none"

  [[widget.setting]]
  key = "module"
  type = "string"
  label_key = "settings.module.label"
  description_key = "settings.module.description"
  default = "custom/ci"

  [[widget.setting]]
  key = "dropdown"
  type = "bool"
  label_key = "settings.dropdown.label"
  description_key = "settings.dropdown.description"
  default = true

  [[widget.setting]]
  key = "divider"
  type = "string"
  label_key = "settings.divider.label"
  description_key = "settings.divider.description"
  default = ""

# A chip's dropdown in colour, opened by clicking the chip (Noctalia's own tooltip is plain
# text capped at 280 px and three lines). Height fits the content up to max_height, then scrolls.
# Floating, not attached: an attached panel takes the bar's background_opacity, which is 0 here
# (the bar is clear, the chips sit in pods), so attached it would be see-through.
[[panel]]
id = "detail"
entry = "detail.luau"
width = 820
height = "content"
max_height = 900
placement = "floating"
position = "auto"
open_near_click = true
