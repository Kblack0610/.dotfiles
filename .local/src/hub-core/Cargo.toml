[package]
name = "hub-core"
version = "0.1.0"
edition = "2021"
description = "What the hub boards read and the session actions they offer, for agent-web and the hub TUI"

[lib]
path = "src/lib.rs"

[dependencies]
agent-panel = { path = "../agent-panel" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
