#!/usr/bin/env bash
# Package Configuration File — single source of truth for installer packages.
#
# STRUCTURE:
#   PACKAGES_<CATEGORY>           — BASE: installed on every supported OS
#   PACKAGES_<CATEGORY>_<OS>      — EXTRA: additive on top of BASE for that OS
#   PACKAGE_NAME_<OS>             — naming overrides (e.g. fd → fd-find on Debian)
#
# OS suffixes: _DEBIAN, _ARCH, _MAC, _ANDROID, _WINDOWS
#
# macOS: Brewfile (~/.dotfiles/.config/brewfile/Brewfile) is the primary install
# path. The MAC entries below cover the BASE so a fresh machine without Brewfile
# still gets a usable CLI floor.
#
# Windows: see windows/install_windows.ps1. The _WINDOWS entries are winget
# package IDs (e.g. Git.Git) installed on top of WSL Debian.

# ============================================================================
# BASIC REQUIREMENTS — bare survival kit, every OS
# ============================================================================
PACKAGES_BASIC="vim wget curl git tmux stow openssh"
PACKAGES_BASIC_DEBIAN="build-essential libfuse2 software-properties-common apt-transport-https ca-certificates gnupg lsb-release"
PACKAGES_BASIC_ARCH="base-devel git-lfs fuse2 unzip sops"  # sops: decrypt home-config secrets when recovering a machine
PACKAGES_BASIC_MAC=""
PACKAGES_BASIC_ANDROID="termux-api termux-tools"
PACKAGES_BASIC_WINDOWS="Git.Git"

# ============================================================================
# DEVELOPMENT TOOLS — modern CLI floor (rust-replacement coreutils + editors)
# ============================================================================
PACKAGES_DEV="neovim lazygit ripgrep fzf jq fd bat eza zoxide tree fastfetch htop poppler"
# bubblewrap + socat: the OS sandbox an unattended agent lane runs in (agent-run docs/contract.md "Lane sandbox").
# github-cli (gh): setup_dotfiles_private clones the private overlay with it.
PACKAGES_DEV_DEBIAN="docker.io inotify-tools mosquitto-clients bubblewrap socat"
PACKAGES_DEV_ARCH="github-cli opencode tree-sitter-cli grimblast dbeaver wl-clipboard wtype ydotool xsel glances btop dua-cli inotify-tools mosquitto rbw shellcheck shfmt aws-cli-v2 bubblewrap socat"
PACKAGES_DEV_MAC="gh mosquitto rbw awscli"
PACKAGES_DEV_ANDROID="inotify-tools mosquitto"
PACKAGES_DEV_WINDOWS="Neovim.Neovim BurntSushi.ripgrep.MSVC sharkdp.fd junegunn.fzf JesseDuffield.lazygit Eclipse.Mosquitto oschwartz10612.Poppler"

# ============================================================================
# FLEET NODE - what an agent session runs (fleet-node install, module fleet)
# ============================================================================
# jq and python-yaml: fleet-hosts.sh reads the roster with them. gh: every PR and
# the private overlay. openssh-server: fleet-dispatch reaches the node over ssh.
# The Debian build deps are for the patched tmux (build_tmux_patched_source).
# claude, agy, and codex and opencode where no package carries them: install_agent_harnesses.
PACKAGES_FLEET="jq"
PACKAGES_FLEET_DEBIAN="gh python3-yaml openssh-server nodejs npm"
# Debian builds the patched tmux from source (build_tmux_patched_source), in dev and in fleet alike.
PACKAGES_TMUX_BUILD_DEBIAN="patch libevent-dev libncurses-dev bison pkg-config make gcc"
PACKAGES_FLEET_ARCH="github-cli python-yaml openai-codex opencode"

# ============================================================================
# TERMINAL ENHANCEMENTS — shell + novelty
# ============================================================================
PACKAGES_TERMINAL="zsh"
PACKAGES_TERMINAL_DEBIAN="fortune cowsay"
PACKAGES_TERMINAL_ARCH="fortune-mod cowsay zsh-autosuggestions zsh-syntax-highlighting zellij alacritty chafa imagemagick"
PACKAGES_TERMINAL_MAC="cowsay fortune"
PACKAGES_TERMINAL_ANDROID="cowsay fortune"
PACKAGES_TERMINAL_WINDOWS="Starship.Starship gerardog.gsudo"

# ============================================================================
# GUI APPLICATIONS — Hyprland/Wayland on Linux; mac uses Brewfile casks
# ============================================================================
PACKAGES_GUI=""
# thunar: the fileManager in .config/hypr/conf/programs.lua and the org.freedesktop.FileManager1
# provider pinned in .local/share/dbus-1/services (tests/unit/file_manager_dbus.bats).
# bluetui: the Bluetooth TUI the waybar bluetooth chip opens (.config/waybar/config.base).
# swaync: the notifier with a control panel, desk's second notify part (docs/desk.md).
# noctalia: the shell desk offers as a third bar part (docs/desk.md); in Arch extra.
# libva-utils: provides `vainfo` for verifying Firefox VA-API hardware video
# decode (configured in .config/firefox/user.js). The VA-API driver itself is
# bundled in `mesa` on Arch; on Debian it ships as `mesa-va-drivers`.
PACKAGES_GUI_DEBIAN="hyprland hyprpaper waybar wofi thunar firefox chromium kitty libva-utils mesa-va-drivers"
PACKAGES_GUI_ARCH="hyprland hyprpaper hypridle waybar wofi thunar dunst swaync noctalia swww grim slurp xdg-desktop-portal-hyprland brightnessctl noto-fonts noto-fonts-emoji firefox chromium kitty libva-utils bluez bluez-utils bluetui"
PACKAGES_GUI_MAC=""
PACKAGES_GUI_ANDROID=""
PACKAGES_GUI_WINDOWS="Microsoft.WindowsTerminal glzr-io.glazewm"

# ============================================================================
# LANGUAGE/RUNTIME — package-managed runtimes only.
# Node on Debian comes from NodeSource (apt's is stale) so it's handled
# directly in install_debian.sh::install_runtime, not via the catalog.
# Rust comes from rustup on every Linux/Mac OS, also out-of-band.
# ============================================================================
# python-yaml / python3-yaml: PyYAML is a hard dependency of .local/bin/sentinel-manifest
# (it parses watch manifests with a real YAML parser). It was previously undeclared and
# only present because it had been installed by hand on the Arch box.
PACKAGES_RUNTIME=""
PACKAGES_RUNTIME_DEBIAN="python3 python3-pip python3-venv python3-yaml pipx"
PACKAGES_RUNTIME_ARCH="nodejs npm python python-pip python-yaml"
PACKAGES_RUNTIME_MAC=""
PACKAGES_RUNTIME_ANDROID="nodejs python python-pip"
PACKAGES_RUNTIME_WINDOWS=""

# ============================================================================
# AUR (Arch) - installed through paru by install_aur_packages (desktop module)
# ============================================================================
PACKAGES_AUR_ARCH="spotify discord hunk zulu-17-bin aws-session-manager-plugin rustdesk-bin"

# ============================================================================
# MUSIC PRODUCTION - opt-in `music` module (install.sh --with music).
# REAPER + amp sims + synths. Rig config, wiring and guide live in the private
# audio repo (cloned to ~/dev/home/audio; run its
# install.sh after this module). One plugin format each; REAPER loads CLAP, VST3
# and LV2 (neural-amp-modeler-lv2) directly.
# ============================================================================
PACKAGES_MUSIC=""
PACKAGES_MUSIC_ARCH="reaper qpwgraph wiremix carla swh-plugins sox aida-x-clap guitarix lsp-plugins-clap dragonfly-reverb-clap surge-xt-clap dexed-clap sfizz-vst3 furnace neural-amp-modeler-lv2 avldrums.lv2"

# ============================================================================
# OPT-IN MODULES - skipped unless named with --with or --only. Every other
# module an OS installer defines runs by default. `install.sh --list` shows them.
# ============================================================================
INSTALL_OPTIONAL_MODULES="music streaming avd fingerprint llm fleet"

# ============================================================================
# WSL (Arch on WSL) — single flat list. Intentionally minimal: CLI floor + the
# dev tools the user actually runs in WSL (node, python, docker, postgres).
# No GUI/desktop/streaming/printing — those live on the Windows host. Consumed
# by linux/install_wsl.sh; the regular Arch/Debian installers refuse to run
# under WSL and point at it.
# ============================================================================
PACKAGES_WSL="
  base-devel git git-lfs openssh wget curl vim tmux stow unzip
  neovim ripgrep fd fzf bat eza zoxide jq tree fastfetch htop lazygit tree-sitter
  zsh zsh-completions
  nodejs npm python python-pip
  docker docker-compose
  postgresql postgresql-libs
  inotify-tools mosquitto
  poppler
"

# ============================================================================
# NAMING OVERRIDES — only when the same logical tool has a different package
# name on a particular OS. Default behavior is pass-through.
# ============================================================================
# `declare -gA` is required because packages.conf is sourced inside the
# load_config() function — without -g, the arrays would be function-local.
declare -gA PACKAGE_NAME_DEBIAN=( [fd]=fd-find [poppler]=poppler-utils )
declare -gA PACKAGE_NAME_MAC=( [nodejs]=node )

# ============================================================================
# NPM GLOBAL PACKAGES (consumed by base_functions.sh::install_npm_packages)
# ============================================================================
# @anthropic-ai/sandbox-runtime (srt): the lane sandbox for a harness with none of its own (the opencode harnesses;
# agent-run docs/contract.md "Lane sandbox"). Pinned: it is a security boundary, so a new release is a
# reviewed bump. A missing srt refuses those starts.
NPM_PACKAGES="@google/gemini-cli @marp-team/marp-cli @mermaid-js/mermaid-cli @anthropic-ai/sandbox-runtime@0.0.82"

# ============================================================================
# NERD FONTS
# ============================================================================
# Release asset names (<name>.zip at ryanoasis/nerd-fonts v3.4.0), each installed by install_fonts
# in base_functions.sh; the waybar themes ask for JetBrainsMono.
NERD_FONTS="Hack 3270 0xProto NerdFontsSymbolsOnly JetBrainsMono"

# ============================================================================
# OH-MY-ZSH PLUGINS
# ============================================================================
OH_MY_ZSH_PLUGINS="zsh-autosuggestions zsh-syntax-highlighting"

# ============================================================================
# FLATPAK APPLICATIONS (Linux only)
# ============================================================================
FLATPAK_APPS="one.ablaze.floorp"
