#!/usr/bin/env bash
# Package Configuration File — single source of truth for installer packages.
#
# STRUCTURE:
#   PACKAGES_<CATEGORY>           — BASE: installed on every supported OS
#   PACKAGES_<CATEGORY>_<OS>      — EXTRA: additive on top of BASE for that OS
#   PACKAGE_NAME_<OS>             — naming overrides (e.g. fd → fd-find on Debian)
#
# OS suffixes: _DEBIAN, _ARCH, _MAC, _ANDROID, _WINDOWS
#
# macOS: Brewfile (~/.dotfiles/.config/brewfile/Brewfile) is the primary install
# path. The MAC entries below cover the BASE so a fresh machine without Brewfile
# still gets a usable CLI floor.
#
# Windows: see windows/install_windows.ps1. The _WINDOWS entries are winget
# package IDs (e.g. Git.Git) installed on top of WSL Debian.

# ============================================================================
# BASIC REQUIREMENTS — bare survival kit, every OS
# ============================================================================
PACKAGES_BASIC="vim wget curl git tmux stow openssh"
PACKAGES_BASIC_DEBIAN="build-essential libfuse2 software-properties-common apt-transport-https ca-certificates gnupg lsb-release"
PACKAGES_BASIC_ARCH="base-devel git-lfs fuse2"
PACKAGES_BASIC_MAC=""
PACKAGES_BASIC_ANDROID="termux-api termux-tools"
PACKAGES_BASIC_WINDOWS="Git.Git"

# ============================================================================
# DEVELOPMENT TOOLS — modern CLI floor (rust-replacement coreutils + editors)
# ============================================================================
# gh is BASE, not per-OS: the gh-workflows skill and the kb-* pipeline shell out
# to it on every PR/CI operation, so a machine without it is broken for daily work.
# Arch names it github-cli (see PACKAGE_NAME_ARCH below); Debian ships `gh` only
# on trixie+/Ubuntu 23.10+, where older releases warn and continue.
PACKAGES_DEV="neovim lazygit gh ripgrep fzf jq fd bat eza zoxide tree fastfetch htop poppler"
PACKAGES_DEV_DEBIAN="docker.io inotify-tools mosquitto-clients"
# CLI floor, second wave — tools already in daily use on the main desktop that
# no other machine was getting. Grouped by role for readability:
#   mail/tui   : aerc yazi w3m chafa rainfrog
#   secrets/iac: sops age terraform
#   net/disk   : arp-scan nethogs wakeonlan smartmontools exfatprogs gptfdisk
#                squashfs-tools sg3_utils
#   android    : scrcpy android-udev
#   ai clis    : opencode openai-codex gemini-cli  (pacman, NOT npm — see
#                NPM_PACKAGES below for why these moved)
PACKAGES_DEV_ARCH="tree-sitter-cli grimblast dbeaver wl-clipboard xsel glances inotify-tools mosquitto rbw shellcheck shfmt \
aerc yazi w3m chafa rainfrog dos2unix \
sops age terraform \
arp-scan nethogs wakeonlan smartmontools exfatprogs gptfdisk squashfs-tools sg3_utils \
scrcpy android-udev \
opencode openai-codex gemini-cli"
PACKAGES_DEV_MAC="mosquitto rbw"
PACKAGES_DEV_ANDROID="inotify-tools mosquitto"
PACKAGES_DEV_WINDOWS="Neovim.Neovim BurntSushi.ripgrep.MSVC sharkdp.fd junegunn.fzf JesseDuffield.lazygit Eclipse.Mosquitto oschwartz10612.Poppler"

# ============================================================================
# TERMINAL ENHANCEMENTS — shell + novelty
# ============================================================================
PACKAGES_TERMINAL="zsh"
PACKAGES_TERMINAL_DEBIAN="fortune cowsay"
PACKAGES_TERMINAL_ARCH="fortune-mod cowsay"
PACKAGES_TERMINAL_MAC="cowsay fortune"
PACKAGES_TERMINAL_ANDROID="cowsay fortune"
PACKAGES_TERMINAL_WINDOWS="Starship.Starship gerardog.gsudo"

# ============================================================================
# GUI APPLICATIONS — Hyprland/Wayland on Linux; mac uses Brewfile casks
# ============================================================================
PACKAGES_GUI=""
# libva-utils: provides `vainfo` for verifying Firefox VA-API hardware video
# decode (configured in .config/firefox/user.js). The VA-API driver itself is
# bundled in `mesa` on Arch; on Debian it ships as `mesa-va-drivers`.
PACKAGES_GUI_DEBIAN="hyprland hyprpaper waybar wofi firefox chromium kitty libva-utils mesa-va-drivers"
# xdg-desktop-portal-hyprland: required for RustDesk (and any PipeWire screen
# capture) to see the screen under Wayland. Without it RustDesk connects but
# streams black. rustdesk itself is AUR-only — installed via install_aur_packages.
# Wayland/desktop utilities: input synthesis (wtype/ydotool), media keys
# (playerctl), X11 app compat (xorg-xwayland), auth prompts (polkit-kde-agent),
# image viewing (oculante), wallpaper daemon (awww), and remote-desktop clients
# (freerdp/tigervnc) used to reach the Windows VDI.
PACKAGES_GUI_ARCH="hyprland hyprpaper waybar wofi firefox chromium kitty libva-utils xdg-desktop-portal-hyprland \
wtype ydotool playerctl xorg-xwayland polkit-kde-agent oculante awww freerdp tigervnc"
PACKAGES_GUI_MAC=""
PACKAGES_GUI_ANDROID=""
PACKAGES_GUI_WINDOWS="Microsoft.WindowsTerminal glzr-io.glazewm"

# ============================================================================
# LANGUAGE/RUNTIME — package-managed runtimes only.
# Node on Debian comes from NodeSource (apt's is stale) so it's handled
# directly in install_debian.sh::install_runtime, not via the catalog.
# Rust comes from rustup on every Linux/Mac OS, also out-of-band.
# ============================================================================
PACKAGES_RUNTIME=""
PACKAGES_RUNTIME_DEBIAN="python3 python3-pip python3-venv pipx"
PACKAGES_RUNTIME_ARCH="nodejs npm python python-pip"
PACKAGES_RUNTIME_MAC=""
PACKAGES_RUNTIME_ANDROID="nodejs python python-pip"
PACKAGES_RUNTIME_WINDOWS=""

# ============================================================================
# WSL (Arch on WSL) — single flat list. Intentionally minimal: CLI floor + the
# dev tools the user actually runs in WSL (node, python, docker, postgres).
# No GUI/desktop/streaming/printing — those live on the Windows host. Consumed
# by linux/install_wsl.sh; the regular Arch/Debian installers refuse to run
# under WSL and point at it.
# ============================================================================
PACKAGES_WSL="
  base-devel git git-lfs openssh wget curl vim tmux stow unzip
  neovim ripgrep fd fzf bat eza zoxide jq tree fastfetch htop lazygit tree-sitter
  zsh zsh-completions
  nodejs npm python python-pip
  docker docker-compose
  postgresql postgresql-libs
  inotify-tools mosquitto
  poppler
"

# ============================================================================
# NAMING OVERRIDES — only when the same logical tool has a different package
# name on a particular OS. Default behavior is pass-through.
# ============================================================================
# `declare -gA` is required because packages.conf is sourced inside the
# load_config() function — without -g, the arrays would be function-local.
declare -gA PACKAGE_NAME_DEBIAN=( [fd]=fd-find [poppler]=poppler-utils )
declare -gA PACKAGE_NAME_ARCH=( [gh]=github-cli )
declare -gA PACKAGE_NAME_MAC=( [nodejs]=node )

# ============================================================================
# NPM GLOBAL PACKAGES (consumed by base_functions.sh::install_npm_packages)
# ============================================================================
# opencode-ai and @google/gemini-cli were REMOVED from this list: the main
# desktop installs them from pacman (opencode, gemini-cli — now in
# PACKAGES_DEV_ARCH), and running both paths gave two competing copies. pacman
# wins because npm's prefix here is /usr, which pacman owns — `npm -g` writes
# into /usr/lib/node_modules where a nodejs upgrade can clobber it untracked.
# marp/mermaid stay on npm: no Arch package, and they're needed cross-OS.
NPM_PACKAGES="@marp-team/marp-cli @mermaid-js/mermaid-cli"

# ============================================================================
# NERD FONTS
# ============================================================================
NERD_FONTS="Hack 3270 0xProto SymbolsOnly"

# ============================================================================
# OH-MY-ZSH PLUGINS
# ============================================================================
OH_MY_ZSH_PLUGINS="zsh-autosuggestions zsh-syntax-highlighting"

# ============================================================================
# FLATPAK APPLICATIONS (Linux only)
# ============================================================================
FLATPAK_APPS="one.ablaze.floorp"
