  <rect class="keep" x="600" y="384" width="250" height="46" rx="20"/>
  <text class="label sm" x="725" y="399">KEEP: chat; past it, the rest of the</text>
  <text class="label sm" x="725" y="415">chain reads it like any session</text>
  <path class="edge" d="M345,430 V453"/>
  <text class="elabel" x="353" y="446">no</text>
  <text class="step" x="36" y="469">plan-mode</text>
  <rect class="decision" x="130" y="454" width="430" height="30" rx="6"/>
  <text class="label sm" x="345" y="469">in plan mode, its approval dialog open or not</text>
  <path class="edge" d="M560,469 H598"/>
  <text class="elabel" x="569" y="463">yes</text>
  <rect class="keep" x="600" y="454" width="250" height="30" rx="15"/>
  <text class="label sm" x="725" y="469">KEEP: the human approves or ends it</text>
  <path class="edge" d="M345,484 V507"/>
  <text class="elabel" x="353" y="500">no</text>
  <text class="step" x="36" y="523">dialog</text>
  <rect class="decision" x="130" y="508" width="430" height="30" rx="6"/>
