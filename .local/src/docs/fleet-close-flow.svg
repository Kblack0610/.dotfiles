  <path class="edge" d="M560,837 H598"/>
  <text class="elabel" x="569" y="831">yes</text>
  <rect class="after" x="600" y="766" width="250" height="142" rx="20"/>
  <text class="label sm" x="725" y="781">AFTER: close its item; never now, since</text>
  <text class="label sm" x="725" y="797">the reap would requeue a partial item.</text>
  <text class="label sm" x="725" y="813">Quiet FLEET_IDLE_CLOSE_MIN with no wake,</text>
  <text class="label sm" x="725" y="829">the shepherd moves it done itself, so</text>
  <text class="label sm" x="725" y="845">the verdict then reads now and the</text>
  <text class="label sm" x="725" y="861">window closes in the same pass; an item</text>
  <text class="label sm" x="725" y="877">it refuses is logged once and stays the</text>
  <text class="label sm" x="725" y="893">nudge's</text>
