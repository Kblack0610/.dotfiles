  <text class="elabel" x="353" y="774">no</text>
  <text class="step" x="36" y="853">only-item</text>
  <rect class="decision" x="130" y="782" width="430" height="142" rx="6"/>
  <text class="label sm" x="345" y="845">its only blockers are its own queue items still open with every plan</text>
  <text class="label sm" x="345" y="861">phase ticked or held by another item</text>
  <path class="edge" d="M560,853 H598"/>
  <text class="elabel" x="569" y="847">yes</text>
  <rect class="after" x="600" y="782" width="250" height="142" rx="20"/>
  <text class="label sm" x="725" y="797">AFTER: close its item; never now, since</text>
  <text class="label sm" x="725" y="813">the reap would requeue a partial item.</text>
  <text class="label sm" x="725" y="829">Quiet FLEET_IDLE_CLOSE_MIN with no wake,</text>
  <text class="label sm" x="725" y="845">the shepherd moves it done itself, so</text>
  <text class="label sm" x="725" y="861">the verdict then reads now and the</text>
  <text class="label sm" x="725" y="877">window closes in the same pass; an item</text>
  <text class="label sm" x="725" y="893">it refuses is logged once and stays the</text>
  <text class="label sm" x="725" y="909">nudge's</text>
