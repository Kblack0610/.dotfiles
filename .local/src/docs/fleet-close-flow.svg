  <text class="label sm" x="345" y="353">label manual, quiet under FLEET_CHAT_CLOSE_H</text>
  <path class="edge" d="M560,353 H598"/>
  <text class="elabel" x="569" y="347">yes</text>
  <rect class="keep" x="600" y="330" width="250" height="46" rx="20"/>
  <text class="label sm" x="725" y="345">KEEP: manual; past it, the rest of the</text>
