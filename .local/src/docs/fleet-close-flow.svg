<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1428" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- GENERATED by .local/bin/close-flow-svg from the Close verdict table (Step, Group, Facts, Verdict)
