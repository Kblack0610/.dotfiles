  <text class="step" x="36" y="1199">quiet</text>
  <rect class="decision" x="130" y="1184" width="430" height="30" rx="6"/>
  <text class="label sm" x="345" y="1199">quiet under FLEET_IDLE_CLOSE_MIN; not asked by --self</text>
