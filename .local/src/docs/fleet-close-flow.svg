  <text class="elabel" x="353" y="1230">no</text>
  <text class="step" x="36" y="1293">now</text>
  <rect class="node" x="130" y="1238" width="430" height="110" rx="20"/>
  <text class="label sm" x="345" y="1285">anything else: DONE, CHAT, STALLED with nothing to land, an open ask</text>
  <text class="label sm" x="345" y="1301">of its own</text>
  <path class="edge" d="M560,1293 H598"/>
  <rect class="now" x="600" y="1238" width="250" height="110" rx="20"/>
  <text class="label sm" x="725" y="1253">NOW; the teardown sets each own pending</text>
  <text class="label sm" x="725" y="1269">ask to reopen it, so the answer carries</text>
  <text class="label sm" x="725" y="1285">on without the window; a session that</text>
  <text class="label sm" x="725" y="1301">turns its close down has its window</text>
  <text class="label sm" x="725" y="1317">closed by fleet-shepherd check an hour</text>
  <text class="label sm" x="725" y="1333">later, its asks set the same way first</text>
  <rect class="lane" x="20" y="1372" width="840" height="44" rx="10"/>
  <rect class="keep" x="40" y="1382" width="160" height="24" rx="12"/>
  <text class="label sm" x="120" y="1394">KEEP: stays open</text>
  <rect class="after" x="220" y="1382" width="262" height="24" rx="12"/>
  <text class="label sm" x="351" y="1394">AFTER: one named step, then close</text>
  <rect class="now" x="502" y="1382" width="226" height="24" rx="12"/>
  <text class="label sm" x="615" y="1394">NOW: the shepherd closes it</text>
