  <path class="edge" d="M560,1097 H598"/>
  <text class="elabel" x="569" y="1091">yes</text>
  <rect class="keep" x="600" y="1066" width="250" height="62" rx="20"/>
  <text class="label sm" x="725" y="1081">KEEP: it wakes itself; CronDelete,</text>
  <text class="label sm" x="725" y="1097">TaskStop or a stop ScheduleWakeup ends</text>
  <text class="label sm" x="725" y="1113">it once the work is done</text>
  <rect class="lane" x="20" y="1164" width="840" height="214" rx="10"/>
  <text class="lane-title" x="40" y="1186">F. The timer</text>
  <path class="edge" d="M345,1128 V1199"/>
  <text class="elabel" x="353" y="1192">no</text>
  <text class="step" x="36" y="1215">quiet</text>
  <rect class="decision" x="130" y="1200" width="430" height="30" rx="6"/>
  <text class="label sm" x="345" y="1215">quiet under FLEET_IDLE_CLOSE_MIN; not asked by --self</text>
  <path class="edge" d="M560,1215 H598"/>
  <text class="elabel" x="569" y="1209">yes</text>
  <rect class="after" x="600" y="1200" width="250" height="30" rx="15"/>
  <text class="label sm" x="725" y="1215">AFTER: quiet Nm of 60m</text>
  <path class="edge" d="M345,1230 V1253"/>
  <text class="elabel" x="353" y="1246">no</text>
  <text class="step" x="36" y="1309">now</text>
  <rect class="node" x="130" y="1254" width="430" height="110" rx="20"/>
  <text class="label sm" x="345" y="1301">anything else: DONE, CHAT, STALLED with nothing to land, an open ask</text>
  <text class="label sm" x="345" y="1317">of its own</text>
  <path class="edge" d="M560,1309 H598"/>
  <rect class="now" x="600" y="1254" width="250" height="110" rx="20"/>
  <text class="label sm" x="725" y="1269">NOW; the teardown sets each own pending</text>
  <text class="label sm" x="725" y="1285">ask to reopen it, so the answer carries</text>
  <text class="label sm" x="725" y="1301">on without the window; a session that</text>
  <text class="label sm" x="725" y="1317">turns its close down has its window</text>
  <text class="label sm" x="725" y="1333">closed by fleet-shepherd check an hour</text>
  <text class="label sm" x="725" y="1349">later, its asks set the same way first</text>
  <rect class="lane" x="20" y="1388" width="840" height="44" rx="10"/>
  <rect class="keep" x="40" y="1398" width="160" height="24" rx="12"/>
  <text class="label sm" x="120" y="1410">KEEP: stays open</text>
  <rect class="after" x="220" y="1398" width="262" height="24" rx="12"/>
  <text class="label sm" x="351" y="1410">AFTER: one named step, then close</text>
  <rect class="now" x="502" y="1398" width="226" height="24" rx="12"/>
  <text class="label sm" x="615" y="1410">NOW: the shepherd closes it</text>
