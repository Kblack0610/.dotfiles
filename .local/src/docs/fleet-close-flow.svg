<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1508" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- GENERATED by .local/bin/close-flow-svg from the Close verdict table (Step, Group, Facts, Verdict)
       in .local/src/docs/fleet-states.md. Do not edit: change the table row and its tagged CLOSE_JQ branch
       in .local/bin/fleet-sessions, then rerun close-flow-svg. tests/unit/fleet_states_doc.bats checks both. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker>
    <style>
      .lane { fill:#eef2f8; stroke:#2f4d7a; stroke-width:2; }
      .lane-title { font-size:14px; font-weight:600; fill:#2f4d7a; text-anchor:start; }
      .node { fill:#e8f0fe; stroke:#4a72b8; stroke-width:1.5; }
      .decision { fill:#eaf0fb; stroke:#4a72b8; stroke-width:1.5; }
      .keep { fill:#e8f0fe; stroke:#4a72b8; stroke-width:1.5; }
      .after { fill:#eef7ee; stroke:#2f7a3a; stroke-width:1.5; stroke-dasharray:5 4; }
      .now { fill:#fffaf0; stroke:#b9791f; stroke-width:2; }
      .label { font-size:14px; fill:#1a2233; text-anchor:middle; dominant-baseline:middle; }
      .label.sm { font-size:12px; }
      .step { font-size:11.5px; fill:#33415c; dominant-baseline:middle; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .edge { fill:none; stroke:#667085; stroke-width:1.6; marker-end:url(#arrow); }
      .elabel { font-size:11.5px; fill:#33415c; text-anchor:start; }
    </style>
  </defs>
  <rect class="node" x="130" y="12" width="430" height="40" rx="20"/>
  <text class="label sm" x="345" y="32">each session row: the first step that matches decides</text>
  <rect class="lane" x="20" y="74" width="840" height="198" rx="10"/>
  <text class="lane-title" x="40" y="96">A. Not ours to judge</text>
  <path class="edge" d="M345,52 V109"/>
  <text class="step" x="36" y="149">parked</text>
  <rect class="decision" x="130" y="110" width="430" height="78" rx="6"/>
  <text class="label sm" x="345" y="149">PARKED with unlanded work, an item running here or an open ask</text>
  <path class="edge" d="M560,149 H598"/>
  <text class="elabel" x="569" y="143">yes</text>
  <rect class="keep" x="600" y="110" width="250" height="78" rx="20"/>
  <text class="label sm" x="725" y="125">KEEP: its claude is gone; anything else</text>
  <text class="label sm" x="725" y="141">falls through the chain as a live row</text>
  <text class="label sm" x="725" y="157">does, and the label manual still keeps</text>
  <text class="label sm" x="725" y="173">it until quiet FLEET_CHAT_CLOSE_H</text>
  <path class="edge" d="M345,188 V211"/>
  <text class="elabel" x="353" y="204">no</text>
  <text class="step" x="36" y="235">headless</text>
  <rect class="decision" x="130" y="212" width="430" height="46" rx="6"/>
  <text class="label sm" x="345" y="227">a headless run's replay; it has no Claude to type a close or a nudge</text>
  <text class="label sm" x="345" y="243">into</text>
  <path class="edge" d="M560,235 H598"/>
  <text class="elabel" x="569" y="229">yes</text>
  <rect class="keep" x="600" y="212" width="250" height="46" rx="20"/>
  <text class="label sm" x="725" y="227">KEEP: fleet-dispatch reap closes it once</text>
  <text class="label sm" x="725" y="243">its item leaves review</text>
  <rect class="lane" x="20" y="294" width="840" height="338" rx="10"/>
  <text class="lane-title" x="40" y="316">B. The human holds it</text>
  <path class="edge" d="M345,258 V329"/>
  <text class="elabel" x="353" y="322">no</text>
  <text class="step" x="36" y="385">manual</text>
  <rect class="decision" x="130" y="330" width="430" height="110" rx="6"/>
  <text class="label sm" x="345" y="385">label manual, quiet under FLEET_CHAT_CLOSE_H</text>
  <path class="edge" d="M560,385 H598"/>
  <text class="elabel" x="569" y="379">yes</text>
  <rect class="keep" x="600" y="330" width="250" height="110" rx="20"/>
  <text class="label sm" x="725" y="345">KEEP: manual; past it, the rest of the</text>
  <text class="label sm" x="725" y="361">chain reads it like any session; --self</text>
  <text class="label sm" x="725" y="377">reads quiet 0 mid-turn, so a session's</text>
  <text class="label sm" x="725" y="393">own close check keeps and the shepherd's</text>
  <text class="label sm" x="725" y="409">typed close, declined, ends in its</text>
  <text class="label sm" x="725" y="425">window being closed</text>
  <path class="edge" d="M345,440 V463"/>
  <text class="elabel" x="353" y="456">no</text>
  <text class="step" x="36" y="487">chat</text>
  <rect class="decision" x="130" y="464" width="430" height="46" rx="6"/>
  <text class="label sm" x="345" y="487">label chat, quiet under FLEET_CHAT_CLOSE_H; not asked by --self</text>
  <path class="edge" d="M560,487 H598"/>
  <text class="elabel" x="569" y="481">yes</text>
  <rect class="keep" x="600" y="464" width="250" height="46" rx="20"/>
  <text class="label sm" x="725" y="479">KEEP: chat; past it, the rest of the</text>
  <text class="label sm" x="725" y="495">chain reads it like any session</text>
  <path class="edge" d="M345,510 V533"/>
  <text class="elabel" x="353" y="526">no</text>
  <text class="step" x="36" y="549">plan-mode</text>
  <rect class="decision" x="130" y="534" width="430" height="30" rx="6"/>
  <text class="label sm" x="345" y="549">in plan mode, its approval dialog open or not</text>
  <path class="edge" d="M560,549 H598"/>
  <text class="elabel" x="569" y="543">yes</text>
  <rect class="keep" x="600" y="534" width="250" height="30" rx="15"/>
  <text class="label sm" x="725" y="549">KEEP: the human approves or ends it</text>
  <path class="edge" d="M345,564 V587"/>
  <text class="elabel" x="353" y="580">no</text>
  <text class="step" x="36" y="603">dialog</text>
  <rect class="decision" x="130" y="588" width="430" height="30" rx="6"/>
  <text class="label sm" x="345" y="603">NEEDS on a dialog in its pane</text>
  <path class="edge" d="M560,603 H598"/>
  <text class="elabel" x="569" y="597">yes</text>
  <rect class="keep" x="600" y="588" width="250" height="30" rx="15"/>
  <text class="label sm" x="725" y="603">KEEP</text>
  <rect class="lane" x="20" y="654" width="840" height="80" rx="10"/>
  <text class="lane-title" x="40" y="676">C. It is working</text>
  <path class="edge" d="M345,618 V689"/>
  <text class="elabel" x="353" y="682">no</text>
  <text class="step" x="36" y="705">working</text>
  <rect class="decision" x="130" y="690" width="430" height="30" rx="6"/>
  <text class="label sm" x="345" y="705">WORKING, or NEEDS carrying on past its own ask; not asked by --self</text>
  <path class="edge" d="M560,705 H598"/>
  <text class="elabel" x="569" y="699">yes</text>
  <rect class="keep" x="600" y="690" width="250" height="30" rx="15"/>
  <text class="label sm" x="725" y="705">KEEP</text>
  <rect class="lane" x="20" y="756" width="840" height="316" rx="10"/>
  <text class="lane-title" x="40" y="778">D. Work left here</text>
  <path class="edge" d="M345,720 V791"/>
  <text class="elabel" x="353" y="784">no</text>
  <text class="step" x="36" y="807">unlanded</text>
  <rect class="decision" x="130" y="792" width="430" height="30" rx="6"/>
  <text class="label sm" x="345" y="807">a blocker names unlanded work</text>
  <path class="edge" d="M560,807 H598"/>
  <text class="elabel" x="569" y="801">yes</text>
  <rect class="keep" x="600" y="792" width="250" height="30" rx="15"/>
  <text class="label sm" x="725" y="807">KEEP: land it</text>
  <path class="edge" d="M345,822 V845"/>
  <text class="elabel" x="353" y="838">no</text>
  <text class="step" x="36" y="917">only-item</text>
  <rect class="decision" x="130" y="846" width="430" height="142" rx="6"/>
  <text class="label sm" x="345" y="909">its only blockers are its own queue items still open with every plan</text>
  <text class="label sm" x="345" y="925">phase ticked or held by another item</text>
  <path class="edge" d="M560,917 H598"/>
  <text class="elabel" x="569" y="911">yes</text>
  <rect class="after" x="600" y="846" width="250" height="142" rx="20"/>
  <text class="label sm" x="725" y="861">AFTER: close its item; never now, since</text>
  <text class="label sm" x="725" y="877">the reap would requeue a partial item.</text>
  <text class="label sm" x="725" y="893">Quiet FLEET_IDLE_CLOSE_MIN with no wake,</text>
  <text class="label sm" x="725" y="909">the shepherd moves it done itself, so</text>
  <text class="label sm" x="725" y="925">the verdict then reads now and the</text>
  <text class="label sm" x="725" y="941">window closes in the same pass; an item</text>
  <text class="label sm" x="725" y="957">it refuses is logged once and stays the</text>
  <text class="label sm" x="725" y="973">nudge's</text>
  <path class="edge" d="M345,988 V1011"/>
  <text class="elabel" x="353" y="1004">no</text>
  <text class="step" x="36" y="1035">held</text>
  <rect class="decision" x="130" y="1012" width="430" height="46" rx="6"/>
  <text class="label sm" x="345" y="1027">its own queue item still running here, or a nightly red after its</text>
  <text class="label sm" x="345" y="1043">merged PR</text>
  <path class="edge" d="M560,1035 H598"/>
  <text class="elabel" x="569" y="1029">yes</text>
  <rect class="keep" x="600" y="1012" width="250" height="46" rx="20"/>
  <text class="label sm" x="725" y="1035">KEEP: work left here</text>
  <rect class="lane" x="20" y="1094" width="840" height="112" rx="10"/>
  <text class="lane-title" x="40" y="1116">E. It wakes itself</text>
  <path class="edge" d="M345,1058 V1129"/>
  <text class="elabel" x="353" y="1122">no</text>
  <text class="step" x="36" y="1161">scheduled</text>
  <rect class="decision" x="130" y="1130" width="430" height="62" rx="6"/>
  <text class="label sm" x="345" y="1153">wake: a CronCreate job, a ScheduleWakeup or an armed Monitor this</text>
  <text class="label sm" x="345" y="1169">claude set is still pending; closing the window would kill it</text>
  <path class="edge" d="M560,1161 H598"/>
  <text class="elabel" x="569" y="1155">yes</text>
  <rect class="keep" x="600" y="1130" width="250" height="62" rx="20"/>
  <text class="label sm" x="725" y="1145">KEEP: it wakes itself; CronDelete,</text>
  <text class="label sm" x="725" y="1161">TaskStop or a stop ScheduleWakeup ends</text>
  <text class="label sm" x="725" y="1177">it once the work is done</text>
  <rect class="lane" x="20" y="1228" width="840" height="214" rx="10"/>
  <text class="lane-title" x="40" y="1250">F. The timer</text>
  <path class="edge" d="M345,1192 V1263"/>
  <text class="elabel" x="353" y="1256">no</text>
  <text class="step" x="36" y="1279">quiet</text>
  <rect class="decision" x="130" y="1264" width="430" height="30" rx="6"/>
  <text class="label sm" x="345" y="1279">quiet under FLEET_IDLE_CLOSE_MIN; not asked by --self</text>
  <path class="edge" d="M560,1279 H598"/>
  <text class="elabel" x="569" y="1273">yes</text>
  <rect class="after" x="600" y="1264" width="250" height="30" rx="15"/>
  <text class="label sm" x="725" y="1279">AFTER: quiet Nm of 60m</text>
  <path class="edge" d="M345,1294 V1317"/>
  <text class="elabel" x="353" y="1310">no</text>
  <text class="step" x="36" y="1373">now</text>
  <rect class="node" x="130" y="1318" width="430" height="110" rx="20"/>
  <text class="label sm" x="345" y="1365">anything else: DONE, CHAT, STALLED with nothing to land, an open ask</text>
  <text class="label sm" x="345" y="1381">of its own</text>
  <path class="edge" d="M560,1373 H598"/>
  <rect class="now" x="600" y="1318" width="250" height="110" rx="20"/>
  <text class="label sm" x="725" y="1333">NOW; the teardown sets each own pending</text>
  <text class="label sm" x="725" y="1349">ask to reopen it, so the answer carries</text>
  <text class="label sm" x="725" y="1365">on without the window; a session that</text>
  <text class="label sm" x="725" y="1381">turns its close down has its window</text>
  <text class="label sm" x="725" y="1397">closed by fleet-shepherd check an hour</text>
  <text class="label sm" x="725" y="1413">later, its asks set the same way first</text>
  <rect class="lane" x="20" y="1452" width="840" height="44" rx="10"/>
  <rect class="keep" x="40" y="1462" width="160" height="24" rx="12"/>
  <text class="label sm" x="120" y="1474">KEEP: stays open</text>
  <rect class="after" x="220" y="1462" width="262" height="24" rx="12"/>
  <text class="label sm" x="351" y="1474">AFTER: one named step, then close</text>
  <rect class="now" x="502" y="1462" width="226" height="24" rx="12"/>
  <text class="label sm" x="615" y="1474">NOW: the shepherd closes it</text>
</svg>
