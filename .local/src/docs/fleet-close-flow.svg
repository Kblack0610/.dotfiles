<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1690" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- GENERATED by .local/bin/close-flow-svg from the Close verdict table (Step, Group, Facts, Verdict)
       in .local/src/docs/fleet-states.md. Do not edit: change the table row and its tagged CLOSE_JQ branch
       in .local/bin/fleet-sessions, then rerun close-flow-svg. tests/unit/fleet_states_doc.bats checks both. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker>
    <style>
      .lane { fill:#eef2f8; stroke:#2f4d7a; stroke-width:2; }
      .lane-title { font-size:14px; font-weight:600; fill:#2f4d7a; text-anchor:start; }
      .node { fill:#e8f0fe; stroke:#4a72b8; stroke-width:1.5; }
      .decision { fill:#eaf0fb; stroke:#4a72b8; stroke-width:1.5; }
      .keep { fill:#e8f0fe; stroke:#4a72b8; stroke-width:1.5; }
      .after { fill:#eef7ee; stroke:#2f7a3a; stroke-width:1.5; stroke-dasharray:5 4; }
      .now { fill:#fffaf0; stroke:#b9791f; stroke-width:2; }
      .label { font-size:14px; fill:#1a2233; text-anchor:middle; dominant-baseline:middle; }
      .label.sm { font-size:12px; }
      .step { font-size:11.5px; fill:#33415c; dominant-baseline:middle; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .edge { fill:none; stroke:#667085; stroke-width:1.6; marker-end:url(#arrow); }
      .elabel { font-size:11.5px; fill:#33415c; text-anchor:start; }
    </style>
  </defs>
  <rect class="node" x="130" y="12" width="430" height="40" rx="20"/>
  <text class="label sm" x="345" y="32">each session row: the first step that matches decides</text>
  <rect class="lane" x="20" y="74" width="840" height="198" rx="10"/>
  <text class="lane-title" x="40" y="96">A. Not ours to judge</text>
  <path class="edge" d="M345,52 V109"/>
  <text class="step" x="36" y="149">parked</text>
  <rect class="decision" x="130" y="110" width="430" height="78" rx="6"/>
  <text class="label sm" x="345" y="149">PARKED with unlanded work, an item running here or an open ask</text>
  <path class="edge" d="M560,149 H598"/>
  <text class="elabel" x="569" y="143">yes</text>
  <rect class="keep" x="600" y="110" width="250" height="78" rx="20"/>
  <text class="label sm" x="725" y="125">KEEP: its claude is gone; anything else</text>
  <text class="label sm" x="725" y="141">falls through the chain as a live row</text>
  <text class="label sm" x="725" y="157">does, and the label manual still keeps</text>
  <text class="label sm" x="725" y="173">it, stay until quiet FLEET_CHAT_CLOSE_H</text>
  <path class="edge" d="M345,188 V211"/>
  <text class="elabel" x="353" y="204">no</text>
  <text class="step" x="36" y="235">headless</text>
  <rect class="decision" x="130" y="212" width="430" height="46" rx="6"/>
  <text class="label sm" x="345" y="227">a headless run's replay; it has no Claude to type a close or a nudge</text>
  <text class="label sm" x="345" y="243">into</text>
  <path class="edge" d="M560,235 H598"/>
  <text class="elabel" x="569" y="229">yes</text>
  <rect class="keep" x="600" y="212" width="250" height="46" rx="20"/>
  <text class="label sm" x="725" y="227">KEEP: fleet-dispatch reap closes it once</text>
  <text class="label sm" x="725" y="243">its item leaves review</text>
  <rect class="lane" x="20" y="294" width="840" height="456" rx="10"/>
  <text class="lane-title" x="40" y="316">B. The human holds it</text>
  <path class="edge" d="M345,258 V329"/>
  <text class="elabel" x="353" y="322">no</text>
  <text class="step" x="36" y="369">manual</text>
  <rect class="decision" x="130" y="330" width="430" height="78" rx="6"/>
  <text class="label sm" x="345" y="369">label manual, set by the human; label self refuses it</text>
  <path class="edge" d="M560,369 H598"/>
  <text class="elabel" x="569" y="363">yes</text>
  <rect class="keep" x="600" y="330" width="250" height="78" rx="20"/>
  <text class="label sm" x="725" y="345">KEEP: manual, however long it is quiet</text>
  <text class="label sm" x="725" y="361">and --self too, so the shepherd never</text>
  <text class="label sm" x="725" y="377">types a close into it nor closes its</text>
  <text class="label sm" x="725" y="393">window; only the human removes the label</text>
  <path class="edge" d="M345,408 V431"/>
  <text class="elabel" x="353" y="424">no</text>
  <text class="step" x="36" y="495">stay</text>
  <rect class="decision" x="130" y="432" width="430" height="126" rx="6"/>
  <text class="label sm" x="345" y="447">label stay, set by the session itself on the human's order to stay</text>
  <text class="label sm" x="345" y="463">open: wind-down step 0, or, on an order to see work through, the</text>
  <text class="label sm" x="345" y="479">coordinate skill until the human answers its validation ask, its</text>
  <text class="label sm" x="345" y="495">background coord-watch --until armed by stop-post.d/89-coord-watch.sh</text>
  <text class="label sm" x="345" y="511">while a ledger line is open, so it wakes only on an event; the</text>
  <text class="label sm" x="345" y="527">validation wait arms nothing, and the ask's reopen-on-answer carries</text>
  <text class="label sm" x="345" y="543">the answer; quiet under FLEET_CHAT_CLOSE_H</text>
  <path class="edge" d="M560,495 H598"/>
  <text class="elabel" x="569" y="489">yes</text>
  <rect class="keep" x="600" y="432" width="250" height="126" rx="20"/>
  <text class="label sm" x="725" y="455">KEEP: stay; past it, the rest of the</text>
  <text class="label sm" x="725" y="471">chain reads it like any session; --self</text>
  <text class="label sm" x="725" y="487">reads quiet 0 mid-turn, so a session's</text>
  <text class="label sm" x="725" y="503">own close check keeps and the shepherd's</text>
  <text class="label sm" x="725" y="519">typed close, declined, ends in its</text>
  <text class="label sm" x="725" y="535">window being closed</text>
  <path class="edge" d="M345,558 V581"/>
  <text class="elabel" x="353" y="574">no</text>
  <text class="step" x="36" y="605">chat</text>
  <rect class="decision" x="130" y="582" width="430" height="46" rx="6"/>
  <text class="label sm" x="345" y="605">label chat, quiet under FLEET_CHAT_CLOSE_H; not asked by --self</text>
  <path class="edge" d="M560,605 H598"/>
  <text class="elabel" x="569" y="599">yes</text>
  <rect class="keep" x="600" y="582" width="250" height="46" rx="20"/>
  <text class="label sm" x="725" y="597">KEEP: chat; past it, the rest of the</text>
  <text class="label sm" x="725" y="613">chain reads it like any session</text>
  <path class="edge" d="M345,628 V651"/>
  <text class="elabel" x="353" y="644">no</text>
  <text class="step" x="36" y="667">plan-mode</text>
  <rect class="decision" x="130" y="652" width="430" height="30" rx="6"/>
  <text class="label sm" x="345" y="667">in plan mode, its approval dialog open or not</text>
  <path class="edge" d="M560,667 H598"/>
  <text class="elabel" x="569" y="661">yes</text>
  <rect class="keep" x="600" y="652" width="250" height="30" rx="15"/>
  <text class="label sm" x="725" y="667">KEEP: the human approves or ends it</text>
  <path class="edge" d="M345,682 V705"/>
  <text class="elabel" x="353" y="698">no</text>
  <text class="step" x="36" y="721">dialog</text>
  <rect class="decision" x="130" y="706" width="430" height="30" rx="6"/>
  <text class="label sm" x="345" y="721">NEEDS on a dialog in its pane</text>
  <path class="edge" d="M560,721 H598"/>
  <text class="elabel" x="569" y="715">yes</text>
  <rect class="keep" x="600" y="706" width="250" height="30" rx="15"/>
  <text class="label sm" x="725" y="721">KEEP</text>
  <rect class="lane" x="20" y="772" width="840" height="80" rx="10"/>
  <text class="lane-title" x="40" y="794">C. It is working</text>
  <path class="edge" d="M345,736 V807"/>
  <text class="elabel" x="353" y="800">no</text>
  <text class="step" x="36" y="823">working</text>
  <rect class="decision" x="130" y="808" width="430" height="30" rx="6"/>
  <text class="label sm" x="345" y="823">WORKING, or NEEDS carrying on past its own ask; not asked by --self</text>
  <path class="edge" d="M560,823 H598"/>
  <text class="elabel" x="569" y="817">yes</text>
  <rect class="keep" x="600" y="808" width="250" height="30" rx="15"/>
  <text class="label sm" x="725" y="823">KEEP</text>
  <rect class="lane" x="20" y="874" width="840" height="380" rx="10"/>
  <text class="lane-title" x="40" y="896">D. Work left here</text>
  <path class="edge" d="M345,838 V909"/>
  <text class="elabel" x="353" y="902">no</text>
  <text class="step" x="36" y="957">unlanded</text>
  <rect class="decision" x="130" y="910" width="430" height="94" rx="6"/>
  <text class="label sm" x="345" y="925">a blocker names unlanded work; a clean head that is the salvage: of</text>
  <text class="label sm" x="345" y="941">the item that moved on from it is not, since the item's next start</text>
  <text class="label sm" x="345" y="957">begins from it, nor is a clean branch whose every file ahead was</text>
  <text class="label sm" x="345" y="973">changed by the merged commits of that item, done ok after another</text>
  <text class="label sm" x="345" y="989">session landed it</text>
  <path class="edge" d="M560,957 H598"/>
  <text class="elabel" x="569" y="951">yes</text>
  <rect class="keep" x="600" y="910" width="250" height="94" rx="20"/>
  <text class="label sm" x="725" y="957">KEEP: land it</text>
  <path class="edge" d="M345,1004 V1027"/>
  <text class="elabel" x="353" y="1020">no</text>
  <text class="step" x="36" y="1099">only-item</text>
  <rect class="decision" x="130" y="1028" width="430" height="142" rx="6"/>
  <text class="label sm" x="345" y="1091">its only blockers are its own queue items still open with every plan</text>
  <text class="label sm" x="345" y="1107">phase ticked or held by another item</text>
  <path class="edge" d="M560,1099 H598"/>
  <text class="elabel" x="569" y="1093">yes</text>
  <rect class="after" x="600" y="1028" width="250" height="142" rx="20"/>
  <text class="label sm" x="725" y="1043">AFTER: close its item; never now, since</text>
  <text class="label sm" x="725" y="1059">the reap would requeue a partial item.</text>
  <text class="label sm" x="725" y="1075">Quiet FLEET_IDLE_CLOSE_MIN with no wake,</text>
  <text class="label sm" x="725" y="1091">the shepherd moves it done itself, so</text>
  <text class="label sm" x="725" y="1107">the verdict then reads now and the</text>
  <text class="label sm" x="725" y="1123">window closes in the same pass; an item</text>
  <text class="label sm" x="725" y="1139">it refuses is logged once and stays the</text>
  <text class="label sm" x="725" y="1155">nudge's</text>
  <path class="edge" d="M345,1170 V1193"/>
  <text class="elabel" x="353" y="1186">no</text>
  <text class="step" x="36" y="1217">held</text>
  <rect class="decision" x="130" y="1194" width="430" height="46" rx="6"/>
  <text class="label sm" x="345" y="1209">its own queue item still running here, or a nightly red after its</text>
  <text class="label sm" x="345" y="1225">merged PR</text>
  <path class="edge" d="M560,1217 H598"/>
  <text class="elabel" x="569" y="1211">yes</text>
  <rect class="keep" x="600" y="1194" width="250" height="46" rx="20"/>
  <text class="label sm" x="725" y="1217">KEEP: work left here</text>
  <rect class="lane" x="20" y="1276" width="840" height="112" rx="10"/>
  <text class="lane-title" x="40" y="1298">E. It wakes itself</text>
  <path class="edge" d="M345,1240 V1311"/>
  <text class="elabel" x="353" y="1304">no</text>
  <text class="step" x="36" y="1343">scheduled</text>
  <rect class="decision" x="130" y="1312" width="430" height="62" rx="6"/>
  <text class="label sm" x="345" y="1335">wake: a CronCreate job, a ScheduleWakeup or an armed Monitor this</text>
  <text class="label sm" x="345" y="1351">claude set is still pending; closing the window would kill it</text>
  <path class="edge" d="M560,1343 H598"/>
  <text class="elabel" x="569" y="1337">yes</text>
  <rect class="keep" x="600" y="1312" width="250" height="62" rx="20"/>
  <text class="label sm" x="725" y="1327">KEEP: it wakes itself; CronDelete,</text>
  <text class="label sm" x="725" y="1343">TaskStop or a stop ScheduleWakeup ends</text>
  <text class="label sm" x="725" y="1359">it once the work is done</text>
  <rect class="lane" x="20" y="1410" width="840" height="214" rx="10"/>
  <text class="lane-title" x="40" y="1432">F. The timer</text>
  <path class="edge" d="M345,1374 V1445"/>
  <text class="elabel" x="353" y="1438">no</text>
  <text class="step" x="36" y="1461">quiet</text>
  <rect class="decision" x="130" y="1446" width="430" height="30" rx="6"/>
  <text class="label sm" x="345" y="1461">quiet under FLEET_IDLE_CLOSE_MIN; not asked by --self</text>
  <path class="edge" d="M560,1461 H598"/>
  <text class="elabel" x="569" y="1455">yes</text>
  <rect class="after" x="600" y="1446" width="250" height="30" rx="15"/>
  <text class="label sm" x="725" y="1461">AFTER: quiet Nm of 60m</text>
  <path class="edge" d="M345,1476 V1499"/>
  <text class="elabel" x="353" y="1492">no</text>
  <text class="step" x="36" y="1555">now</text>
  <rect class="node" x="130" y="1500" width="430" height="110" rx="20"/>
  <text class="label sm" x="345" y="1547">anything else: DONE, CHAT, STALLED with nothing to land, an open ask</text>
  <text class="label sm" x="345" y="1563">of its own</text>
  <path class="edge" d="M560,1555 H598"/>
  <rect class="now" x="600" y="1500" width="250" height="110" rx="20"/>
  <text class="label sm" x="725" y="1515">NOW; the teardown sets each own pending</text>
  <text class="label sm" x="725" y="1531">ask to reopen it, so the answer carries</text>
  <text class="label sm" x="725" y="1547">on without the window; a session that</text>
  <text class="label sm" x="725" y="1563">turns its close down has its window</text>
  <text class="label sm" x="725" y="1579">closed by fleet-shepherd check an hour</text>
  <text class="label sm" x="725" y="1595">later, its asks set the same way first</text>
  <rect class="lane" x="20" y="1634" width="840" height="44" rx="10"/>
  <rect class="keep" x="40" y="1644" width="160" height="24" rx="12"/>
  <text class="label sm" x="120" y="1656">KEEP: stays open</text>
  <rect class="after" x="220" y="1644" width="262" height="24" rx="12"/>
  <text class="label sm" x="351" y="1656">AFTER: one named step, then close</text>
  <rect class="now" x="502" y="1644" width="226" height="24" rx="12"/>
  <text class="label sm" x="615" y="1656">NOW: the shepherd closes it</text>
</svg>
