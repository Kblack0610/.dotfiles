  <text class="elabel" x="353" y="940">no</text>
  <text class="step" x="36" y="971">held</text>
  <rect class="decision" x="130" y="948" width="430" height="46" rx="6"/>
  <text class="label sm" x="345" y="963">its own queue item still running here, or a nightly red after its</text>
  <text class="label sm" x="345" y="979">merged PR</text>
  <path class="edge" d="M560,971 H598"/>
  <text class="elabel" x="569" y="965">yes</text>
  <rect class="keep" x="600" y="948" width="250" height="46" rx="20"/>
  <text class="label sm" x="725" y="971">KEEP: work left here</text>
  <rect class="lane" x="20" y="1030" width="840" height="112" rx="10"/>
  <text class="lane-title" x="40" y="1052">E. It wakes itself</text>
  <path class="edge" d="M345,994 V1065"/>
  <text class="elabel" x="353" y="1058">no</text>
  <text class="step" x="36" y="1097">scheduled</text>
  <rect class="decision" x="130" y="1066" width="430" height="62" rx="6"/>
  <text class="label sm" x="345" y="1089">wake: a CronCreate job, a ScheduleWakeup or an armed Monitor this</text>
