  <path class="edge" d="M560,1081 H598"/>
  <text class="elabel" x="569" y="1075">yes</text>
  <rect class="keep" x="600" y="1050" width="250" height="62" rx="20"/>
  <text class="label sm" x="725" y="1065">KEEP: it wakes itself; CronDelete,</text>
  <text class="label sm" x="725" y="1081">TaskStop or a stop ScheduleWakeup ends</text>
  <text class="label sm" x="725" y="1097">it once the work is done</text>
  <rect class="lane" x="20" y="1148" width="840" height="214" rx="10"/>
