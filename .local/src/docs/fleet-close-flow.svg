  <text class="elabel" x="353" y="1042">no</text>
  <text class="step" x="36" y="1081">scheduled</text>
  <rect class="decision" x="130" y="1050" width="430" height="62" rx="6"/>
  <text class="label sm" x="345" y="1073">wake: a CronCreate job, a ScheduleWakeup or an armed Monitor this</text>
