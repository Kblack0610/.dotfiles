<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 956" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- The fleet-sessions close flow (CLOSE_JQ), one chain and one quiet timer for every session, first match wins.
       Source of truth: .local/src/docs/fleet-states.md, Close verdict. Keep the two in step. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9791f"/></marker>
    <style>
      .lane { fill:#eef2f8; stroke:#2f4d7a; stroke-width:2; }
      .lane-title { font-size:14px; font-weight:600; fill:#2f4d7a; text-anchor:middle; }
      .node { fill:#e8f0fe; stroke:#4a72b8; stroke-width:1.5; }
      .decision { fill:#eaf0fb; stroke:#4a72b8; stroke-width:1.5; }
      .label { font-size:14px; fill:#1a2233; text-anchor:middle; dominant-baseline:middle; }
      .label.sm { font-size:12.5px; }
      .edge { fill:none; stroke:#667085; stroke-width:1.6; marker-end:url(#arrow); }
      .elabel { font-size:11.5px; fill:#33415c; text-anchor:middle; }
    </style>
  </defs>
  <rect class="node" x="85" y="12" width="400" height="44" rx="22"/>
  <text class="label sm" x="285" y="34">each shepherd check (15-min runner, each pass) reads each row</text>
  <rect class="lane" x="20" y="76" width="840" height="160" rx="10"/>
  <text class="lane-title" x="40" y="98" style="text-anchor:start">A. Not ours to judge</text>
  <rect class="lane" x="20" y="242" width="840" height="104" rx="10"/>
  <text class="lane-title" x="40" y="264" style="text-anchor:start">B. The human holds it</text>
  <rect class="lane" x="20" y="352" width="840" height="104" rx="10"/>
  <text class="lane-title" x="40" y="374" style="text-anchor:start">C. It is working</text>
  <rect class="lane" x="20" y="462" width="840" height="216" rx="10"/>
  <text class="lane-title" x="40" y="484" style="text-anchor:start">D. Work left here</text>
  <rect class="lane" x="20" y="684" width="840" height="160" rx="10"/>
  <text class="lane-title" x="40" y="706" style="text-anchor:start">E. The timer</text>
  <path class="edge" d="M285,56 V109"/>
  <rect class="decision" x="50" y="110" width="470" height="40" rx="6"/>
  <text class="label sm" x="285" y="130">parked: its claude is gone?</text>
  <path class="edge" d="M520,130 H588"/>
  <text class="elabel" x="554" y="124">yes</text>
  <rect class="node" x="590" y="110" width="230" height="40" rx="20"/>
  <text class="label sm" x="705" y="130">KEEP</text>
  <path class="edge" d="M285,150 V165"/>
  <text class="elabel" x="300" y="160" style="text-anchor:start">no</text>
  <rect class="decision" x="50" y="166" width="470" height="40" rx="6"/>
  <text class="label sm" x="285" y="186">runs on a fleet worker?</text>
  <path class="edge" d="M520,186 H588"/>
  <text class="elabel" x="554" y="180">yes</text>
  <rect class="node" x="590" y="166" width="230" height="40" rx="20"/>
  <text class="label sm" x="705" y="186">KEEP</text>
  <path class="edge" d="M285,206 V275"/>
  <text class="elabel" x="300" y="270" style="text-anchor:start">no</text>
  <rect class="decision" x="50" y="276" width="470" height="40" rx="6"/>
  <text class="label sm" x="285" y="296">manual label, plan mode, or a dialog in its pane?</text>
  <path class="edge" d="M520,296 H588"/>
  <text class="elabel" x="554" y="290">yes</text>
  <rect class="node" x="590" y="276" width="230" height="40" rx="20"/>
  <text class="label sm" x="705" y="296">KEEP</text>
  <path class="edge" d="M285,316 V385"/>
  <text class="elabel" x="300" y="380" style="text-anchor:start">no</text>
  <rect class="decision" x="50" y="386" width="470" height="40" rx="6"/>
  <text class="label sm" x="285" y="406">working (busy, or past its ask)? not asked by --self</text>
  <path class="edge" d="M520,406 H588"/>
  <text class="elabel" x="554" y="400">yes</text>
  <rect class="node" x="590" y="386" width="230" height="40" rx="20"/>
  <text class="label sm" x="705" y="406">KEEP</text>
  <path class="edge" d="M285,426 V495"/>
  <text class="elabel" x="300" y="490" style="text-anchor:start">no</text>
  <rect class="decision" x="50" y="496" width="470" height="40" rx="6"/>
  <text class="label sm" x="285" y="516">work not landed: dirty files, an unmerged branch, an open PR?</text>
  <path class="edge" d="M520,516 H588"/>
  <text class="elabel" x="554" y="510">yes</text>
  <rect class="node" x="590" y="496" width="230" height="40" rx="20"/>
  <text class="label sm" x="705" y="516">KEEP: land it</text>
  <path class="edge" d="M285,536 V551"/>
  <text class="elabel" x="300" y="546" style="text-anchor:start">no</text>
  <rect class="decision" x="50" y="552" width="470" height="40" rx="6"/>
  <text class="label sm" x="285" y="572">LANDED, with plan phases nobody queued?</text>
  <path class="edge" d="M520,572 H588"/>
  <text class="elabel" x="554" y="566">yes</text>
  <rect class="node" x="590" y="552" width="230" height="40" rx="20" style="stroke-dasharray:5 4"/>
  <text class="label sm" x="705" y="572">AFTER: queue them</text>
  <path class="edge" d="M285,592 V607"/>
  <text class="elabel" x="300" y="602" style="text-anchor:start">no</text>
  <rect class="decision" x="50" y="608" width="470" height="40" rx="6"/>
  <text class="label sm" x="285" y="628">only its own open queue item, every phase done or queued?</text>
  <path class="edge" d="M520,628 H588"/>
  <text class="elabel" x="554" y="622">yes</text>
  <rect class="node" x="590" y="608" width="230" height="40" rx="20" style="stroke-dasharray:5 4"/>
  <text class="label sm" x="705" y="628">AFTER: close the item</text>
  <path class="edge" d="M285,648 V717"/>
  <text class="elabel" x="300" y="712" style="text-anchor:start">no</text>
  <rect class="decision" x="50" y="718" width="470" height="40" rx="6"/>
  <text class="label sm" x="285" y="738">quiet under 60 min (FLEET_IDLE_CLOSE_MIN)? not asked by --self</text>
  <path class="edge" d="M520,738 H588"/>
  <text class="elabel" x="554" y="732">yes</text>
  <rect class="node" x="590" y="718" width="230" height="40" rx="20" style="stroke-dasharray:5 4"/>
  <text class="label sm" x="705" y="738">AFTER: wait it out</text>
  <path class="edge" d="M285,758 V773"/>
  <text class="elabel" x="300" y="768" style="text-anchor:start">no</text>
  <rect class="node" x="50" y="774" width="470" height="40" rx="20"/>
  <text class="label sm" x="285" y="794">anything else: done, a chat, stalled with nothing to land, its own ask</text>
  <path class="edge" d="M520,794 H588"/>
  <rect class="node" x="590" y="774" width="230" height="40" rx="20" style="fill:#fffaf0;stroke:#b9791f;stroke-width:2"/>
  <text class="label sm" x="705" y="794" style="fill:#b9791f;font-weight:600">CLOSE NOW</text>
  <path class="edge" d="M820,794 H840 V876" style="stroke:#b9791f;marker-end:url(#arrow-amber)"/>
  <rect class="node" x="270" y="878" width="590" height="58" rx="8" style="fill:#fffaf0;stroke:#b9791f;stroke-width:2"/>
  <text class="label sm" x="565" y="897">CLOSE NOW: the shepherd types /wind-down auto (CHAT: /wind-down) when idle, once per fact;</text>
  <text class="label sm" x="565" y="917">the session re-runs close --self, sets its asks to reopen it, writes its note, closes</text>
</svg>
