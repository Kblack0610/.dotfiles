  <path class="edge" d="M345,376 V399"/>
  <text class="elabel" x="353" y="392">no</text>
  <text class="step" x="36" y="423">chat</text>
  <rect class="decision" x="130" y="400" width="430" height="46" rx="6"/>
  <text class="label sm" x="345" y="423">label chat, quiet under FLEET_CHAT_CLOSE_H; not asked by --self</text>
  <path class="edge" d="M560,423 H598"/>
  <text class="elabel" x="569" y="417">yes</text>
  <rect class="keep" x="600" y="400" width="250" height="46" rx="20"/>
  <text class="label sm" x="725" y="415">KEEP: chat; past it, the rest of the</text>
  <text class="label sm" x="725" y="431">chain reads it like any session</text>
  <path class="edge" d="M345,446 V469"/>
  <text class="elabel" x="353" y="462">no</text>
  <text class="step" x="36" y="485">plan-mode</text>
  <rect class="decision" x="130" y="470" width="430" height="30" rx="6"/>
  <text class="label sm" x="345" y="485">in plan mode, its approval dialog open or not</text>
  <path class="edge" d="M560,485 H598"/>
  <text class="elabel" x="569" y="479">yes</text>
  <rect class="keep" x="600" y="470" width="250" height="30" rx="15"/>
  <text class="label sm" x="725" y="485">KEEP: the human approves or ends it</text>
  <path class="edge" d="M345,500 V523"/>
  <text class="elabel" x="353" y="516">no</text>
  <text class="step" x="36" y="539">dialog</text>
  <rect class="decision" x="130" y="524" width="430" height="30" rx="6"/>
  <text class="label sm" x="345" y="539">NEEDS on a dialog in its pane</text>
  <path class="edge" d="M560,539 H598"/>
  <text class="elabel" x="569" y="533">yes</text>
  <rect class="keep" x="600" y="524" width="250" height="30" rx="15"/>
  <text class="label sm" x="725" y="539">KEEP</text>
  <rect class="lane" x="20" y="590" width="840" height="80" rx="10"/>
  <text class="lane-title" x="40" y="612">C. It is working</text>
  <path class="edge" d="M345,554 V625"/>
  <text class="elabel" x="353" y="618">no</text>
  <text class="step" x="36" y="641">working</text>
  <rect class="decision" x="130" y="626" width="430" height="30" rx="6"/>
  <text class="label sm" x="345" y="641">WORKING, or NEEDS carrying on past its own ask; not asked by --self</text>
  <path class="edge" d="M560,641 H598"/>
  <text class="elabel" x="569" y="635">yes</text>
  <rect class="keep" x="600" y="626" width="250" height="30" rx="15"/>
  <text class="label sm" x="725" y="641">KEEP</text>
  <rect class="lane" x="20" y="692" width="840" height="316" rx="10"/>
  <text class="lane-title" x="40" y="714">D. Work left here</text>
  <path class="edge" d="M345,656 V727"/>
  <text class="elabel" x="353" y="720">no</text>
  <text class="step" x="36" y="743">unlanded</text>
  <rect class="decision" x="130" y="728" width="430" height="30" rx="6"/>
  <text class="label sm" x="345" y="743">a blocker names unlanded work</text>
  <path class="edge" d="M560,743 H598"/>
  <text class="elabel" x="569" y="737">yes</text>
  <rect class="keep" x="600" y="728" width="250" height="30" rx="15"/>
  <text class="label sm" x="725" y="743">KEEP: land it</text>
