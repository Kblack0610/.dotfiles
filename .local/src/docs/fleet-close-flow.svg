  <text class="elabel" x="569" y="949">yes</text>
  <rect class="keep" x="600" y="932" width="250" height="46" rx="20"/>
  <text class="label sm" x="725" y="955">KEEP: work left here</text>
  <rect class="lane" x="20" y="1014" width="840" height="112" rx="10"/>
