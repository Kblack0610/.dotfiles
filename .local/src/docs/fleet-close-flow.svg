  <path class="edge" d="M560,523 H598"/>
  <text class="elabel" x="569" y="517">yes</text>
  <rect class="keep" x="600" y="508" width="250" height="30" rx="15"/>
  <text class="label sm" x="725" y="523">KEEP</text>
