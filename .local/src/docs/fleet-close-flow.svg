  <path class="edge" d="M345,538 V609"/>
  <text class="elabel" x="353" y="602">no</text>
  <text class="step" x="36" y="625">working</text>
  <rect class="decision" x="130" y="610" width="430" height="30" rx="6"/>
  <text class="label sm" x="345" y="625">WORKING, or NEEDS carrying on past its own ask; not asked by --self</text>
  <path class="edge" d="M560,625 H598"/>
  <text class="elabel" x="569" y="619">yes</text>
  <rect class="keep" x="600" y="610" width="250" height="30" rx="15"/>
  <text class="label sm" x="725" y="625">KEEP</text>
