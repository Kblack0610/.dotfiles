  <text class="step" x="36" y="407">chat</text>
  <rect class="decision" x="130" y="384" width="430" height="46" rx="6"/>
  <text class="label sm" x="345" y="407">label chat, quiet under FLEET_CHAT_CLOSE_H; not asked by --self</text>
