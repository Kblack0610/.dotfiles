<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agents</title>
<link rel="preload" href="/static/inter.woff2?v={{v}}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css?v={{v}}">
</head>
<body>
<header id="top">
  <button class="menu" id="menu" aria-label="Menu" aria-expanded="false" aria-controls="tabs"><span class="bars"></span><span id="menu-badge"></span></button>
  <span class="conn" id="conn" title="live updates"></span>
  <h1>Agents</h1>
  <span class="cur" id="cur-tab"></span>
  <span class="live-off" id="live-off" hidden>live updates off, reload to refresh</span>
  <nav class="tabs" id="tabs">
    <button id="tab-home" class="on">Home<span id="ask-badge"></span></button>
    <button id="tab-daily">Daily</button>
    <button id="tab-queue">Queue<span id="queue-badge"></span></button>
    <button id="tab-projects">Projects</button>
    <button id="tab-sessions">Sessions<span id="wait-badge"></span></button>
    <button id="tab-infra">Infra</button>
    <button id="tab-log">Log</button>
    <button id="tab-fleet">Fleet</button>
    <form method="post" action="/logout"><button class="signout" title="Sign out">Sign out</button></form>
  </nav>
</header>
<main id="main">
  <nav id="list"></nav>
  <section id="detail">
    <div class="bar">
      <button class="btn" id="back">Back</button>
      <span class="dot" id="d-dot"></span>
      <span class="name" id="d-name">Pick an agent</span>
      <div class="seg" id="v-seg">
        <button id="v-transcript" class="on">Transcript</button>
        <button id="v-screen">Screen</button>
      </div>
    </div>
    <div class="acts" id="acts" hidden></div>
    <div id="facts" hidden></div>
    <div id="scroll"><div class="empty">Loading the overview.</div></div>
    <div class="compose" id="compose" hidden>
      <div class="keys" id="keys"></div>
      <div class="send">
        <textarea id="text" placeholder="Message this agent (Ctrl+Enter to send)"></textarea>
        <button class="btn primary" id="send">Send</button>
      </div>
      <div class="err" id="err"></div>
    </div>
  </section>
  <section id="home" class="board"></section>
  <section id="daily" class="board" hidden><div id="d-note"></div><div id="outbox" hidden></div></section>
  <section id="queue" class="board" hidden></section>
  <section id="projects" class="board" hidden><div id="p-cards"></div><div id="p-rows" hidden><div id="p-head"></div><div id="board"></div></div></section>
  <section id="log" class="board" hidden><div id="log-day"></div>
    <details class="sec-d" id="sec-actions"><summary><h2 class="sec">Actions</h2></summary><div id="actions"></div></details>
    <details class="sec-d" id="sec-changes"><summary><h2 class="sec">Changes</h2></summary><div id="log-changes"></div></details>
    <details class="sec-d" id="sec-rundowns"><summary><h2 class="sec">Rundowns</h2></summary><div id="log-rundowns"></div></details>
    <details class="sec-d" id="sec-verdicts"><summary><h2 class="sec">Judges' verdicts</h2></summary><div id="log-verdicts"></div></details>
    <details class="sec-d" id="sec-ranked"><summary><h2 class="sec">Ranked sessions</h2></summary><div id="log-ranked"></div></details>
  </section>
  <section id="infra" class="board" hidden><div id="infra-main"></div><div id="jobs"></div><div id="infra-tail"></div></section>
  <section id="fleet" class="board" hidden></section>
</main>
<script src="/static/ui.js?v={{v}}"></script>
<script src="/static/md.js?v={{v}}"></script>
<script src="/static/charts.js?v={{v}}"></script>
<script src="/static/app.js?v={{v}}"></script>
<script src="/static/waiting.js?v={{v}}"></script>
<script src="/static/home.js?v={{v}}"></script>
<script src="/static/outbox.js?v={{v}}"></script>
<script src="/static/watch.js?v={{v}}"></script>
<script src="/static/log.js?v={{v}}"></script>
<script src="/static/infra.js?v={{v}}"></script>
<script src="/static/table.js?v={{v}}"></script>
<script src="/static/jobs.js?v={{v}}"></script>
<script src="/static/queue.js?v={{v}}"></script>
<script src="/static/board.js?v={{v}}"></script>
<script src="/static/projects.js?v={{v}}"></script>
<script src="/static/shepherd.js?v={{v}}"></script>
<script src="/static/actions.js?v={{v}}"></script>
<script src="/static/fleet.js?v={{v}}"></script>
<script src="/static/focus.js?v={{v}}"></script>
</body>
</html>
