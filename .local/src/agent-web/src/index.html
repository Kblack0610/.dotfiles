<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agents</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
  --accent: #2f6fde; --wait: #d4483b; --busy: #c98a12; --idle: #3f9a5a;
  --user: #eaf0fb; --tool: #f1efe9; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* fleet-sessions buckets */
  --b-needs: #d4483b; --b-stalled: #dd7a1f; --b-landed: #8457d0; --b-unclear: #8f8d86; --b-working: #2f6fde; --b-done: #3f9a5a;
  /* categorical series, fixed order (dataviz palette) */
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #8f5bd0; --c6: #d6498f; --c-other: #a3a19a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141413; --panel: #1d1d1b; --ink: #ecebe6; --muted: #9a998f; --line: #2e2d2a;
    --accent: #6f9ef0; --user: #1f2a3d; --tool: #24231f; color-scheme: dark;
    --b-needs: #e8665a; --b-stalled: #f0953f; --b-landed: #a585e6; --b-unclear: #77756e; --b-working: #6f9ef0; --b-done: #5cb877;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #9a6bdc; --c6: #d85a99; --c-other: #66645e;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; }
.tabs { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: none; }
.tabs button, .seg button { border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 5px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
.tabs button.on, .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--wait); color: #fff; font-size: 11px; text-align: center; margin-left: 4px; }
.signout { white-space: nowrap; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; padding: 5px 4px; }
.conn { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.conn.live { background: var(--idle); }
.conn.live.off { background: var(--wait); }
.live-off { font-size: 12px; color: var(--wait); white-space: nowrap; }
main { display: grid; grid-template-columns: 320px 1fr; height: calc(100% - 49px - env(safe-area-inset-top, 0px)); }
#list { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); }
.group { padding: 10px 16px 4px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 16px; cursor: pointer; border-left: 3px solid transparent; }
.row:hover { background: var(--bg); }
.row.sel { background: var(--bg); border-left-color: var(--accent); }
.dot { flex: none; width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; background: var(--idle); }
.dot.waiting { background: var(--wait); box-shadow: 0 0 0 3px color-mix(in srgb, var(--wait) 25%, transparent); }
.dot.busy, .dot.shell { background: var(--busy); }
.row .t { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.row .s { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.dot.parked { background: var(--muted); }
.pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.pill { font: 11px var(--mono); padding: 0 6px; border-radius: 9px; background: var(--tool); color: var(--muted); white-space: nowrap; }
.pill.here { background: var(--accent); color: #fff; }
.pill.parked { background: var(--busy); color: #fff; }
.pill.ask { background: var(--wait); color: #fff; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.acts .btn.danger { border-color: var(--wait); color: var(--wait); }
.acts .btn.danger.primary { background: var(--wait); color: #fff; }
.acts select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
.acts .q { font-size: 13px; }
.acts .msg { font: 12px var(--mono); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; width: 100%; }
.acts .msg.err { color: var(--wait); }
/* An element's own display rule would otherwise beat the hidden attribute (#detail is flex). */
[hidden] { display: none !important; }
#detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.bar .name { font-family: var(--mono); font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .seg { margin-left: auto; display: flex; gap: 4px; }
#back { display: none; }
#scroll { flex: 1; overflow-y: auto; padding: 12px 16px; }
.ev { margin: 0 0 10px; white-space: pre-wrap; word-break: break-word; }
.ev.user { background: var(--user); padding: 8px 10px; border-radius: 8px; }
.ev.tool { font-family: var(--mono); font-size: 12px; background: var(--tool); padding: 6px 8px; border-radius: 6px; }
.ev.tool b { color: var(--accent); }
.ev details summary { cursor: pointer; color: var(--muted); font-family: var(--mono); font-size: 12px; }
.ev details pre { margin: 4px 0 0; font-size: 12px; max-height: 320px; overflow: auto; background: var(--tool); padding: 6px 8px; border-radius: 6px; }
.ts { color: var(--muted); font-size: 11px; }
#screen { margin: 0; font: 12px/1.35 var(--mono); white-space: pre; overflow-x: auto; }
.older { display: block; margin: 0 auto 12px; }
.compose { border-top: 1px solid var(--line); background: var(--panel); padding: 8px 16px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
.keys { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.keys button, .btn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 5px 10px; font: 12px var(--mono); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-family: inherit; font-size: 14px; }
.send { display: flex; gap: 8px; }
textarea { flex: 1; min-height: 40px; max-height: 160px; resize: vertical; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.empty { color: var(--muted); padding: 24px 16px; }
.err { color: var(--wait); font-size: 12px; min-height: 1em; }
#asks { grid-column: 1 / -1; overflow-y: auto; padding: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 0 auto 12px; max-width: 760px; }
.card .meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-family: var(--mono); }
.card .q { white-space: pre-wrap; margin-bottom: 10px; }
.card .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.card .opts .rec { border-color: var(--accent); }
.card .open { float: right; color: var(--accent); cursor: pointer; }
h2.sec { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 4px auto 8px; max-width: 760px; }
.card input { flex: 1; min-width: 140px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
/* Board tabs */
#queue > *, #queue h2.sec { max-width: 760px; }
#q-list .card { max-width: none; }
.qitem .q { margin-bottom: 6px; max-height: 12em; overflow-y: auto; }
.qtag { display: inline-block; padding: 0 6px; margin-left: 4px; border-radius: 9px; background: var(--tool); }
.qprio { font-weight: 600; } .qprio.urgent { color: var(--b-needs); } .qprio.high { color: var(--b-stalled); } .qprio.low { color: var(--muted); }
.qbad { color: var(--b-needs); font-weight: 600; }
.qhold { font-size: 12px; color: var(--b-stalled); margin-bottom: 6px; }
.qadd textarea { width: 100%; box-sizing: border-box; min-height: 90px; margin-bottom: 8px; }
.qadd select, .qitem select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
.qhint { font-size: 12px; margin-top: 4px; }
.board { grid-column: 1 / -1; overflow-y: auto; padding: 16px; }
/* Shepherd tab: kept rundowns beside the chat; stacked on a phone */
.shep { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.shep-chat { position: sticky; top: 0; }
#sh-chat { max-height: 60vh; overflow-y: auto; }
#sh-text { width: 100%; box-sizing: border-box; min-height: 70px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.row-end { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 6px; }
.row-end .err { flex: 1; }
.rd summary { cursor: pointer; }
.rd-body { white-space: pre-wrap; word-break: break-word; margin-top: 8px; }
@media (max-width: 900px) { .shep { grid-template-columns: 1fr; } .shep-chat { position: static; } }
.board > * { max-width: 1200px; margin-left: auto; margin-right: auto; }
.board h2.sec { max-width: 1200px; display: flex; gap: 10px; align-items: baseline; margin-top: 18px; }
.muted { color: var(--muted); font-weight: normal; }
.bhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 12px; font-family: var(--mono); margin-bottom: 10px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.tile { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 10px 15px; font: inherit; overflow: hidden; }
.tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
button.tile { cursor: pointer; }
button.tile:hover, .tile.on { border-color: var(--c); box-shadow: 0 0 0 1px var(--c) inset; }
.tile.wide { grid-column: span 2; }
.tl { font-size: 11px; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.tv { font-size: 26px; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
.ts1 { font-size: 13px; font-family: var(--mono); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.tog { margin-left: auto; font-size: 12px; text-transform: none; letter-spacing: 0; font-weight: normal; display: flex; gap: 6px; align-items: center; cursor: pointer; }
.lanes { display: flex; flex-direction: column; gap: 3px; }
.lane { display: grid; grid-template-columns: minmax(120px, 230px) minmax(0, 1fr); gap: 10px; align-items: center; }
.lane .ll { font: 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lane .ll i { color: var(--muted); font-style: normal; }
.lane svg { width: 100%; height: 14px; display: block; border-radius: 3px; background: var(--bg); }
.lane.dim { opacity: .5; }
.lane.axis .ticks { position: relative; height: 16px; font: 10px var(--mono); color: var(--muted); }
.lane.axis .ticks span { position: absolute; transform: translateX(-50%); top: 2px; }
.legend { text-transform: none; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; font-weight: normal; letter-spacing: 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.meter { display: inline-block; width: 56px; height: 6px; border-radius: 3px; background: var(--line); vertical-align: middle; overflow: hidden; }
.meter > span { display: block; height: 100%; border-radius: 3px; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 9px; font: 600 11px var(--mono); color: #fff; background: var(--c); }
.chip.sm { padding: 0 6px; font-size: 10px; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); gap: 10px; }
.wcard { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.wh { display: flex; gap: 8px; align-items: center; }
.wt { font: 600 13px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.wcard .open { color: var(--accent); cursor: pointer; font-size: 12px; }
.wm { font: 12px var(--mono); color: var(--muted); margin: 4px 0; overflow-wrap: anywhere; }
.wf { margin-bottom: 6px; }
.wk { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 12px var(--mono); color: var(--muted); }
.kv { white-space: nowrap; }
.wn { font-size: 12px; color: var(--muted); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wtask { font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
.tbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line); margin-bottom: 2px; }
.tbar span { display: block; }
.wcard details { margin-top: 6px; font-size: 12px; }
.wcard summary { cursor: pointer; color: var(--muted); }
.wcard ul { margin: 4px 0 0; padding-left: 18px; }
.ci { font-weight: 600; }
.ci.pass { color: var(--b-done); } .ci.fail { color: var(--b-needs); } .ci.pending { color: var(--b-stalled); }
.feed { max-height: 420px; overflow-y: auto; padding: 6px 10px; }
.fr { display: grid; grid-template-columns: 44px minmax(100px, 220px) minmax(0, 1fr); gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.fr:last-child { border-bottom: 0; }
/* Log tab */
.tiles.roomy { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.daynav b { margin: 0 6px; font-family: var(--mono); }
.daynav .btn:disabled { opacity: .4; cursor: default; }
.headline { font-size: 12px; margin: 10px auto 0; }
.g2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 12px; margin-top: 12px; }
.g2 > .panel { min-width: 0; }
.panel h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.cols { padding-left: 34px; }
.cplot { position: relative; height: var(--h); border-bottom: 1px solid var(--line); }
.cg { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
.cg span { position: absolute; right: calc(100% + 6px); top: -7px; font: 10px var(--mono); color: var(--muted); white-space: nowrap; }
.cbars { position: absolute; inset: 0; display: flex; gap: 2px; align-items: stretch; }
.cc { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; justify-content: flex-end; cursor: default; border-radius: 4px 4px 0 0; }
.cc[data-key^="2"], .cc[data-key^="t"] { cursor: pointer; }
.cc:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.cc.sel { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.cs { display: flex; flex-direction: column-reverse; height: 100%; justify-content: flex-start; gap: 0; }
.cs i { display: block; width: 100%; min-height: 0; border-top: 2px solid var(--panel); }
.cs i:last-child { border-radius: 4px 4px 0 0; }
.cs i:first-child { border-top: 0; }
.cs i:only-child { border-radius: 4px 4px 0 0; }
.cx { position: absolute; top: calc(100% + 3px); left: 50%; transform: translateX(-50%); font: 10px var(--mono); color: var(--muted); white-space: nowrap; }
.cols { padding-bottom: 16px; }
.tip { position: fixed; z-index: 50; pointer-events: none; white-space: pre; background: var(--ink); color: var(--panel); font: 12px/1.4 var(--mono); padding: 6px 8px; border-radius: 6px; max-width: min(420px, 90vw); overflow: hidden; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th { text-align: left; font-weight: 600; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl .n { text-align: right; font-family: var(--mono); }
.tbl .m { width: 30%; }
.tbl .m .meter { width: 100%; }
.cores { display: flex; gap: 1px; width: 100%; height: 16px; }
.cores i { display: flex; align-items: flex-end; flex: 1 1 0; min-width: 2px; max-width: 12px; height: 100%; background: var(--line); border-radius: 1px; overflow: hidden; }
.cores b { display: block; width: 100%; }
.tbl tr.tot td { font-weight: 600; border-bottom: 0; }
.tbl tr.hgrp td { padding-top: 10px; font-weight: 600; }
.scroll { overflow-x: auto; }
details.area { margin-bottom: 8px; }
details.area summary { cursor: pointer; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.grp { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 10px 0 2px; }
.pr { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 13px; min-width: 0; }
.pr:last-child { border-bottom: 0; }
.pr .ft { flex: none; width: 40px; font: 12px var(--mono); color: var(--muted); }
.pr a { flex: none; color: var(--accent); text-decoration: none; font-family: var(--mono); font-size: 12px; }
.pr .pt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr .by { flex: none; font: 12px var(--mono); color: var(--muted); }
.pr a.by { color: var(--accent); }
details.sec-d summary { list-style: none; cursor: pointer; }
details.sec-d summary::-webkit-details-marker { display: none; }
/* Infra tab */
.tv.sm { font-size: 18px; }
.sp { height: 8px; }
.glink { color: var(--accent); text-decoration: none; margin-left: 10px; font-family: system-ui, sans-serif; }
.tbl td.warn, .tbl td.bad { font-weight: 600; }
.tbl td.warn { color: var(--b-stalled); } .tbl td.bad { color: var(--b-needs); }
.tbl td.wrap { white-space: normal; min-width: 160px; }
.panel.down { border-left: 4px solid var(--b-needs); }
.stack { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; min-width: 80px; }
.stack i { display: block; }
.fold { font-size: 12px; margin-top: 6px; }
.tl1 { font: 12px var(--mono); padding: 2px 0; border-bottom: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
.ft { font-family: var(--mono); color: var(--muted); }
.fg { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fw { overflow-wrap: anywhere; }
/* Jobs tab */
.btn.sm, .btn.sm.primary { padding: 2px 8px; font: 12px var(--mono); margin: 0 2px 4px 0; }
.tbl tr.jr { cursor: pointer; }
.tbl tr.jr:hover td { background: var(--bg); }
.tbl tr.jr.sel td { background: color-mix(in srgb, var(--accent) 14%, transparent); }
pre.joblog { font: 12px/1.4 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 70vh; overflow-y: auto; margin: 0; }
@media (max-width: 760px) {
  .board { padding: 12px; }
  .lane { grid-template-columns: 122px minmax(0, 1fr); gap: 6px; }
  .lane .ll { font-size: 11px; }
  .ticks span:nth-child(even) { display: none; }
  .fr { grid-template-columns: 40px minmax(0, 1fr); }
  .fr .fw { grid-column: 1 / -1; }

  main { grid-template-columns: 1fr; }
  #list { border-right: 0; }
  main.open #list { display: none; }
  main:not(.open) #detail { display: none; }
  #back { display: inline-block; }
}
</style>
</head>
<body>
<header>
  <span class="conn" id="conn" title="live updates"></span>
  <h1>Agents</h1>
  <span class="live-off" id="live-off" hidden>live updates off, reload to refresh</span>
  <div class="tabs">
    <button id="tab-queue" class="on">Queue<span id="queue-badge"></span></button>
    <button id="tab-sessions">Sessions<span id="wait-badge"></span></button>
    <button id="tab-asks">Waiting<span id="ask-badge"></span></button>
    <button id="tab-shepherd">Shepherd</button>
    <button id="tab-watch">Watch</button>
    <button id="tab-log">Log</button>
    <button id="tab-infra">Infra</button>
    <button id="tab-jobs">Jobs</button>
  </div>
  <form method="post" action="/logout"><button class="signout" title="Sign out">Sign out</button></form>
</header>
<main id="main">
  <nav id="list"></nav>
  <section id="detail">
    <div class="bar">
      <button class="btn" id="back">&larr;</button>
      <span class="dot" id="d-dot"></span>
      <span class="name" id="d-name">Pick an agent</span>
      <div class="seg">
        <button id="v-transcript" class="on">Transcript</button>
        <button id="v-screen">Screen</button>
      </div>
    </div>
    <div class="acts" id="acts" hidden></div>
    <div id="scroll"><div class="empty">Select an agent on the left.</div></div>
    <div class="compose" id="compose" hidden>
      <div class="keys" id="keys"></div>
      <div class="send">
        <textarea id="text" placeholder="Message this agent (Ctrl+Enter to send)"></textarea>
        <button class="btn primary" id="send">Send</button>
      </div>
      <div class="err" id="err"></div>
    </div>
  </section>
  <section id="queue" class="board"></section>
  <section id="asks" hidden></section>
  <section id="shepherd" class="board" hidden></section>
  <section id="watch" class="board" hidden></section>
  <section id="log" class="board" hidden></section>
  <section id="infra" class="board" hidden></section>
  <section id="jobs" class="board" hidden></section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEYS = [["1","1"],["2","2"],["3","3"],["Enter","Enter"],["Esc","Escape"],["Up","Up"],["Down","Down"],["Tab","Tab"],["S-Tab","BTab"]];

const st = { agents: [], sel: null, view: "transcript", start: null, end: null, tab: "queue", asks: [] };
// The board tabs (static/*.js) register here: { show(), onEvent(ev) }.
const TABS = {};

async function api(path, opts) {
  const r = await fetch(path, Object.assign({ credentials: "same-origin" }, opts));
  if (r.status === 401) { location.reload(); throw new Error("unauthorized"); }
  if (!r.ok) throw new Error((await r.text()) || r.statusText);
  return r.status === 204 ? null : (r.headers.get("content-type") || "").includes("json") ? r.json() : r.text();
}
const post = (path, body) => api(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });

// Run fn, and if it is asked for again while running, run it once more after.
// An event storm becomes at most one trailing refetch, with no timer involved.
function coalesce(fn) {
  let running = false, again = false;
  return async function run() {
    if (running) { again = true; return; }
    running = true;
    try { await fn(); } catch (e) { console.warn(e); }
    running = false;
    if (again) { again = false; run(); }
  };
}

const refreshAgents = coalesce(async () => {
  st.agents = await api("/api/agents");
  renderList();
  renderBadge();
  if (st.tab === "asks") renderAsks();
  // A session coming or going changes which queue rows have an Open button.
  if (st.tab === "queue") renderQueueList();
  if (st.sel) {
    const a = st.agents.find((x) => x.target === st.sel.target);
    if (a) { st.sel = a; renderHead(); } else { $("d-dot").className = "dot"; $("d-name").textContent = st.sel.target + " (gone)"; }
  }
});

function renderList() {
  const waiting = st.agents.filter((a) => a.status === "waiting").length;
  $("wait-badge").innerHTML = waiting ? `<span class="badge">${waiting}</span>` : "";
  if (!st.agents.length) { $("list").innerHTML = '<div class="empty">No agents running.</div>'; return; }
  const groups = new Map();
  for (const a of st.agents) { if (!groups.has(a.project)) groups.set(a.project, []); groups.get(a.project).push(a); }
  let html = "";
  for (const [proj, list] of groups) {
    html += `<div class="group">${esc(proj)}</div>`;
    for (const a of list) {
      const sel = st.sel && st.sel.target === a.target ? " sel" : "";
      html += `<div class="row${sel}" data-t="${esc(a.target)}"><span class="dot ${esc(a.status)}"></span><div style="min-width:0"><div class="t">${esc(a.target)}</div><div class="s">${esc(a.summary || "")}</div>${pills(a)}</div></div>`;
    }
  }
  $("list").innerHTML = html;
}

// What the row is beyond its status: the human's own session, parked, its account, plan, ask.
function pills(a) {
  const p = [];
  if (a.attached) p.push('<span class="pill here">you are here</span>');
  if (a.parked) p.push('<span class="pill parked">parked</span>');
  if (a.account) p.push(`<span class="pill" title="account">${esc(a.account)}</span>`);
  if (a.plan) p.push(`<span class="pill" title="plan">${esc(a.plan)}</span>`);
  if (a.ask) p.push(`<span class="pill ask" title="pending ask">ask ${esc(a.ask)}</span>`);
  return p.length ? `<div class="pills">${p.join("")}</div>` : "";
}

// Session actions (hub-core session_actions on the server). A button only arms a confirm
// here in the page; the confirm's own button sends it. Parked rows offer only unpark.
const DANGER = ["stop", "cancel"];
st.act = { confirm: null, busy: false, msg: "", err: false };
st.opts = { describe: {}, accounts: [] };
api("/api/session-options").then((o) => { st.opts = o; if (st.sel) renderActs(); }).catch((e) => console.warn(e));

function renderActs() {
  const a = st.sel, box = $("acts");
  if (!a) { box.hidden = true; return; }
  box.hidden = false;
  const c = st.act.confirm && st.act.confirm.target === a.target ? st.act.confirm : null;
  let html = "";
  if (c) {
    const others = st.opts.accounts.filter((n) => n !== a.account);
    const pick = c.action === "move"
      ? `<select id="act-acct">${others.map((n) => `<option>${esc(n)}</option>`).join("")}</select>` : "";
    const danger = DANGER.includes(c.action) ? " danger" : "";
    html += `<span class="q">${esc(c.action)} ${esc(a.target)}${a.attached ? " (you are attached to it)" : ""}: ${esc(st.opts.describe[c.action] || "")}</span>${pick}`
      + `<button class="btn primary${danger}" data-go ${st.act.busy || (c.action === "move" && !others.length) ? "disabled" : ""}>Yes, ${esc(c.action)}</button>`
      + `<button class="btn" data-no ${st.act.busy ? "disabled" : ""}>Cancel</button>`;
  } else {
    html += (a.actions || []).map((n) => `<button class="btn${DANGER.includes(n) ? " danger" : ""}" data-act="${esc(n)}" ${st.act.busy ? "disabled" : ""}>${esc(n)}</button>`).join("");
  }
  if (st.act.msg) html += `<div class="msg${st.act.err ? " err" : ""}">${esc(st.act.msg)}</div>`;
  box.innerHTML = html;
}

$("acts").addEventListener("click", async (e) => {
  const a = st.sel;
  if (!a || st.act.busy) return;
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.act) { st.act.confirm = { action: b.dataset.act, target: a.target }; st.act.msg = ""; renderActs(); return; }
  if (b.dataset.no !== undefined) { st.act.confirm = null; renderActs(); return; }
  if (b.dataset.go === undefined || !st.act.confirm) return;
  const { action, target } = st.act.confirm;
  const account = action === "move" && $("act-acct") ? $("act-acct").value : "";
  st.act = { confirm: null, busy: true, msg: `${action} ${target}: running`, err: false };
  renderActs();
  try {
    const r = await post(`/api/session/${encodeURIComponent(target)}/${encodeURIComponent(action)}`, { account });
    st.act.msg = `${action} ${target}: done${r && r.output ? "\n" + r.output : ""}`;
  } catch (err) {
    st.act.msg = `${action} ${target}: ${err.message}`; st.act.err = true;
  }
  st.act.busy = false;
  refreshAgents();
  renderActs();
});

$("list").addEventListener("click", (e) => {
  const row = e.target.closest(".row");
  if (!row) return;
  const a = st.agents.find((x) => x.target === row.dataset.t);
  if (a) select(a);
});

function renderHead() {
  $("d-dot").className = "dot " + st.sel.status;
  $("d-name").textContent = `${st.sel.target}  ${st.sel.summary || ""}`;
  // A parked session has no claude to type into or screen to show: only its transcript.
  $("compose").hidden = !!st.sel.parked;
  $("v-screen").disabled = !!st.sel.parked;
  renderActs();
}

function select(a) {
  if (!st.sel || st.sel.target !== a.target) st.act = { confirm: null, busy: st.act.busy, msg: "", err: false };
  st.sel = a; st.start = null; st.end = null;
  if (a.parked && st.view === "screen") {
    st.view = "transcript";
    $("v-transcript").classList.add("on");
    $("v-screen").classList.remove("on");
  }
  $("main").classList.add("open");
  $("err").textContent = "";
  renderHead(); renderList();
  $("scroll").innerHTML = "";
  load();
}

$("back").onclick = () => { $("main").classList.remove("open"); };

function evHtml(e) {
  const ts = e.ts ? `<div class="ts">${esc(e.ts.replace("T", " ").slice(0, 19))}</div>` : "";
  if (e.kind === "tool_use") return `<div class="ev tool"><b>${esc(e.name || "tool")}</b> ${esc(e.text)}</div>`;
  if (e.kind === "tool_result") {
    const first = e.text.split("\n")[0].slice(0, 120);
    return `<div class="ev"><details><summary>result: ${esc(first)}</summary><pre>${esc(e.text)}</pre></details></div>`;
  }
  return `<div class="ev ${e.role === "user" ? "user" : ""}">${ts}${esc(e.text)}</div>`;
}

const atBottom = () => { const s = $("scroll"); return s.scrollHeight - s.scrollTop - s.clientHeight < 40; };
const toBottom = () => { const s = $("scroll"); s.scrollTop = s.scrollHeight; };

async function load() {
  if (st.view === "screen") return loadScreen();
  const a = st.sel;
  let page;
  try { page = await api(`/api/transcript?t=${encodeURIComponent(a.target)}`); }
  catch (e) { $("scroll").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (st.sel !== a) return;
  st.start = page.start; st.end = page.end;
  $("scroll").innerHTML = olderBtn() + page.events.map(evHtml).join("");
  toBottom();
}

const olderBtn = () => st.start > 0 ? '<button class="btn older" id="older">Load older</button>' : "";

$("scroll").addEventListener("click", async (e) => {
  if (e.target.id !== "older") return;
  const a = st.sel, s = $("scroll");
  const page = await api(`/api/transcript?t=${encodeURIComponent(a.target)}&before=${st.start}`);
  if (st.sel !== a) return;
  const prevH = s.scrollHeight;
  e.target.remove();
  st.start = page.start;
  s.insertAdjacentHTML("afterbegin", olderBtn() + page.events.map(evHtml).join(""));
  s.scrollTop += s.scrollHeight - prevH; // keep the reader where they were
});

const loadNewer = coalesce(async () => {
  const a = st.sel;
  if (!a || st.view !== "transcript" || st.end === null) return;
  const stick = atBottom();
  const page = await api(`/api/transcript?t=${encodeURIComponent(a.target)}&after=${st.end}`);
  if (st.sel !== a) return;
  if (page.start !== st.end) { load(); return; } // fell too far behind: server sent the newest page
  st.end = page.end;
  if (page.events.length) {
    $("scroll").insertAdjacentHTML("beforeend", page.events.map(evHtml).join(""));
    if (stick) toBottom();
  }
});

const loadScreen = coalesce(async () => {
  const a = st.sel;
  if (!a || st.view !== "screen") return;
  const text = await api(`/api/screen?t=${encodeURIComponent(a.target)}`);
  if (st.sel !== a) return;
  $("scroll").innerHTML = `<pre id="screen">${esc(String(text).replace(/\s+$/, ""))}</pre>`;
  toBottom();
});

function setView(v) {
  st.view = v;
  $("v-transcript").classList.toggle("on", v === "transcript");
  $("v-screen").classList.toggle("on", v === "screen");
  if (st.sel) load();
}
$("v-transcript").onclick = () => setView("transcript");
$("v-screen").onclick = () => setView("screen");

$("keys").innerHTML = KEYS.map(([label, key]) => `<button data-k="${key}">${label}</button>`).join("");
$("keys").addEventListener("click", async (e) => {
  const k = e.target.dataset && e.target.dataset.k;
  if (!k || !st.sel) return;
  try { await post("/api/send", { t: st.sel.target, key: k }); $("err").textContent = ""; if (st.view === "screen") loadScreen(); }
  catch (err) { $("err").textContent = err.message; }
});

async function sendText() {
  const text = $("text").value;
  if (!text.trim() || !st.sel) return;
  $("send").disabled = true;
  try { await post("/api/send", { t: st.sel.target, text }); $("text").value = ""; $("err").textContent = ""; }
  catch (err) { $("err").textContent = err.message; }
  $("send").disabled = false;
}
$("send").onclick = sendText;
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendText(); } });

const refreshAsks = coalesce(async () => {
  st.asks = await api("/api/asks");
  renderBadge();
  if (st.tab === "asks") renderAsks();
});

// The Waiting tab: every live session with a dialog or permission prompt open (read from its
// transcript by the server), then every pending ask, the one record of a question to the human.
// An ask from a live session names that session; answering it types the answer into its pane.
const asking = () => st.agents.filter((a) => a.question);
function renderBadge() {
  const n = asking().length + st.asks.length;
  $("ask-badge").innerHTML = n ? `<span class="badge">${n}</span>` : "";
}

function sessionCard(a) {
  const q = a.question;
  let opts = "";
  if (q.kind === "choice") opts = q.options.map((o, i) => `<button class="btn" data-k="${i + 1}">${i + 1}. ${esc(o)}</button>`).join("");
  if (q.kind === "tool") opts = ["1", "2", "3"].map((k) => `<button class="btn" data-k="${k}">${k}</button>`).join("");
  return `
    <div class="card" data-t="${esc(a.target)}" data-kind="${esc(q.kind)}">
      <span class="open" data-open>open</span>
      <div class="meta">${esc(a.project)} &middot; ${esc(a.target)} &middot; ${q.kind === "choice" ? "asking" : q.kind === "tool" ? "permission" : "your turn"}</div>
      <div class="q">${esc(q.text)}</div>
      <div class="opts">
        ${opts}
        <input placeholder="reply in this session" data-free><button class="btn" data-reply>Send</button>
      </div>
      <div class="err"></div>
    </div>`;
}

function renderAsks() {
  // Session events re-render this often; keep a reply that is being typed.
  const f = document.activeElement, card = f && f.closest && f.closest("#asks .card");
  const keep = card && f.matches("[data-free]") ? { k: card.dataset.t || card.dataset.id, v: f.value } : null;
  drawAsks();
  if (!keep) return;
  const again = [...$("asks").querySelectorAll(".card")].find((c) => (c.dataset.t || c.dataset.id) === keep.k);
  const input = again && again.querySelector("[data-free]");
  if (input) { input.value = keep.v; input.focus(); }
}

// The answer judge runs in shadow: it only says what it would do, next to the human's buttons.
function judgeLine(a) {
  if (!a.judge) return "";
  const call = a.judge === "human" ? "leave it to you"
    : a.judge === "take-recommend" ? `take the recommendation (${a.recommend})`
    : `answer "${a.judge.replace(/^answer:/, "")}"`;
  return `<div class="meta">judge would ${esc(call)}</div>`;
}

function drawAsks() {
  const live = asking();
  if (!live.length && !st.asks.length) { $("asks").innerHTML = '<div class="empty">Nothing is waiting on you.</div>'; return; }
  let html = "";
  if (live.length) html += '<h2 class="sec">Sessions</h2>' + live.map(sessionCard).join("");
  const owner = (a) => st.agents.find((x) => a.session && x.session === a.session);
  if (st.asks.length) html += '<h2 class="sec">Asks</h2>' + st.asks.map((a) => `
    <div class="card" data-id="${esc(a.id)}">
      <div class="meta">${esc(a.project)} &middot; ${owner(a) ? esc(owner(a).target) : "headless"} &middot; ${esc(a.kind)} &middot; ${esc(a.id)}</div>
      <div class="q">${esc(a.question)}</div>
      ${judgeLine(a)}
      <div class="opts">
        ${a.options.map((o) => `<button class="btn${o === a.recommend ? " rec" : ""}" data-a="${esc(o)}">${esc(o)}${o === a.recommend ? " (rec)" : ""}</button>`).join("")}
        <input placeholder="or type an answer" data-free><button class="btn" data-send>Answer</button>
      </div>
      <div class="err"></div>
    </div>`).join("");
  $("asks").innerHTML = html;
}

// A session card answers through the session's own pane, so the answer lands in that
// conversation. A typed reply to a dialog first closes it with Escape; the text then
// arrives as the human's next message.
async function answerSession(card, e) {
  const t = card.dataset.t;
  if (e.target.dataset.open !== undefined) {
    const a = st.agents.find((x) => x.target === t);
    if (a) { setTab("sessions"); select(a); }
    return;
  }
  const key = e.target.dataset.k;
  const text = e.target.dataset.reply !== undefined ? card.querySelector("[data-free]").value : "";
  if (!key && !text.trim()) return;
  if (key) await post("/api/send", { t, key });
  else {
    if (card.dataset.kind !== "text") await post("/api/send", { t, key: "Escape" });
    await post("/api/send", { t, text });
  }
  card.querySelector("[data-free]").value = "";
}

$("asks").addEventListener("click", async (e) => {
  const card = e.target.closest(".card");
  if (!card) return;
  if (card.dataset.t) {
    try { await answerSession(card, e); card.querySelector(".err").textContent = ""; }
    catch (err) { card.querySelector(".err").textContent = err.message; }
    return;
  }
  let answer = e.target.dataset.a;
  if (e.target.dataset.send !== undefined) answer = card.querySelector("[data-free]").value;
  if (!answer || !answer.trim()) return;
  try { await post("/api/asks/answer", { id: card.dataset.id, answer }); refreshAsks(); }
  catch (err) { card.querySelector(".err").textContent = err.message; }
});

$("asks").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !e.target.matches("[data-free]")) return;
  e.preventDefault();
  const btn = e.target.parentElement.querySelector("[data-reply], [data-send]");
  if (btn) btn.click();
});

const TAB_NAMES = ["queue", "sessions", "asks", "shepherd", "watch", "log", "infra", "jobs"];
function setTab(t) {
  st.tab = t;
  for (const n of TAB_NAMES) {
    $("tab-" + n).classList.toggle("on", t === n);
    if (n !== "sessions") $(n).hidden = t !== n;
  }
  $("list").hidden = t !== "sessions";
  $("detail").hidden = t !== "sessions";
  if (t === "asks") renderAsks();
  if (TABS[t]) TABS[t].show();
  try { history.replaceState(null, "", t === "queue" ? location.pathname : "#" + t); } catch (e) { /* not fatal */ }
}
for (const n of TAB_NAMES) $("tab-" + n).onclick = () => setTab(n);

function connect() {
  const es = new EventSource("/api/events");
  es.onopen = () => { $("conn").classList.add("live"); refreshAgents(); refreshAsks(); if (st.sel) load(); };
  es.onerror = () => { $("conn").classList.remove("live"); }; // EventSource reconnects by itself
  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.kind === "live") {
      // The server could not watch some paths (the user's inotify limit, usually); it retries.
      const off = ev.off || [];
      $("conn").classList.toggle("off", off.length > 0);
      $("conn").title = off.length ? "live updates off for " + off.join(", ") : "live updates";
      $("live-off").hidden = off.length === 0;
      $("live-off").title = off.join("\n");
    }
    if (ev.kind === "sessions" || ev.kind === "resync") { refreshAgents(); if (st.view === "screen") loadScreen(); }
    if (ev.kind === "asks" || ev.kind === "resync") refreshAsks();
    if ((ev.kind === "transcript" && st.sel && ev.session === st.sel.session) || ev.kind === "resync") {
      if (st.view === "screen") loadScreen(); else loadNewer();
    }
    for (const t of Object.values(TABS)) t.onEvent(ev);
  };
}
</script>
<script src="/static/charts.js"></script>
<script src="/static/watch.js"></script>
<script src="/static/log.js"></script>
<script src="/static/infra.js"></script>
<script src="/static/jobs.js"></script>
<script src="/static/queue.js"></script>
<script src="/static/shepherd.js"></script>
<script>
"use strict";
setTab(TAB_NAMES.includes(location.hash.slice(1)) ? location.hash.slice(1) : "queue");
connect();
</script>
</body>
</html>
