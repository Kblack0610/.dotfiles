<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agents</title>
<link rel="preload" href="/static/inter.woff2?v={{v}}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/tokens.css?v={{v}}">
<link rel="stylesheet" href="/static/shell.css?v={{v}}">
<link rel="stylesheet" href="/static/app.css?v={{v}}">
<script type="module" src="/static/kb-shell.js?v={{v}}"></script>
</head>
<body>
<kb-shell id="top">
  <span class="kb-menu-badge" id="menu-badge"></span>
  <span class="conn" id="conn" title="live updates"></span>
  <h1 class="kb-brand">Agents</h1>
  <span class="live-off" id="live-off" hidden>live updates off, reload to refresh</span>
  <nav class="kb-nav" id="tabs" aria-label="Tabs">
{{nav}}    <form class="kb-foot" method="post" action="/logout"><button class="signout" title="Sign out">Sign out</button></form>
  </nav>
</kb-shell>
<main id="main" class="kb-main">
  <aside id="side" aria-label="Sessions"></aside>
  <section id="detail">
    <div class="bar">
      <button class="btn" id="back">Back</button>
      <span class="dot" id="d-dot"></span>
      <span class="name" id="d-name">Pick an agent</span>
      <div class="seg" id="v-seg">
        <button id="v-transcript" class="on">Conversation</button>
        <button id="v-page">Details</button>
        <button id="v-screen">Screen</button>
      </div>
    </div>
    <div class="acts" id="acts" hidden></div>
    <div id="facts" hidden></div>
    <div id="scroll"><div class="empty">Loading the overview.</div></div>
    <button class="btn jump" id="jump" hidden>Jump to latest</button>
    <div id="ask-pin" hidden></div>
    <div class="compose" id="compose" hidden>
      <div class="keys" id="keys"></div>
      <div class="send">
        <textarea id="text" placeholder="Message this agent (Ctrl+Enter to send)"></textarea>
        <button class="btn primary" id="send">Send</button>
      </div>
      <div class="err" id="err"></div>
    </div>
  </section>
  <section id="home" class="board"></section>
  <section id="daily" class="board" hidden><nav id="d-nav" aria-label="Daily"></nav><div id="d-main"><div id="d-note"></div><div id="outbox" hidden></div></div></section>
  <section id="queue" class="board" hidden></section>
  <section id="projects" class="board" hidden><div id="p-strip"></div><div id="p-cards"></div><div id="p-all" hidden><h2 class="sec" id="sec-board">All rows <span class="muted">every project's; select one for its actions</span></h2></div><div id="p-dtop" hidden><div id="p-deliv"></div></div><div id="p-rows" hidden><div id="p-head"></div><div id="p-pane"></div><div id="p-board" data-pin="rows" hidden><div id="b-root"></div></div><div id="p-build" data-pin="build" hidden></div><div id="p-pane2"></div></div></section>
  <section id="log" class="board" hidden><div id="log-strip"></div><div id="sec-work"><div id="log-work" data-tbl="w"></div></div>
    <details class="sec-d" id="sec-day" open><summary><h2 class="sec">Day detail</h2></summary><div id="log-day"></div></details>
    <details class="sec-d" id="sec-actions" open><summary><h2 class="sec">Actions</h2></summary><div id="actions"></div></details>
    <details class="sec-d" id="sec-changes" open><summary><h2 class="sec">Changes</h2></summary><div id="log-changes"></div></details>
    <details class="sec-d" id="sec-rundowns" open><summary><h2 class="sec">Rundowns</h2></summary><div id="log-rundowns"></div></details>
    <details class="sec-d" id="sec-verdicts" open><summary><h2 class="sec">Judges' verdicts</h2></summary><div id="log-verdicts"></div></details>
    <details class="sec-d" id="sec-ranked" open><summary><h2 class="sec">Ranked sessions</h2></summary><div id="log-ranked"></div></details>
  </section>
  <section id="alerts" class="board" hidden></section>
  <section id="infra" class="board" hidden><div id="infra-main"></div><div id="ci-runs"></div><div id="ci-pipelines"></div><div id="ci-tests"></div><div id="jobs"></div></section>
  <section id="schedules" class="board" hidden></section>
  <section id="costs" class="board" hidden></section>
  <section id="releases" class="board" hidden></section>
</main>
<script src="/static/ui.js?v={{v}}"></script>
<script src="/static/md.js?v={{v}}"></script>
<script src="/static/charts.js?v={{v}}"></script>
<script src="/static/convo.js?v={{v}}"></script>
<script src="/static/app.js?v={{v}}"></script>
<script src="/static/table.js?v={{v}}"></script>
<script src="/static/flow.js?v={{v}}"></script>
<script src="/static/waiting.js?v={{v}}"></script>
<script src="/static/home.js?v={{v}}"></script>
<script src="/static/outbox.js?v={{v}}"></script>
<script src="/static/watch.js?v={{v}}"></script>
<script src="/static/log.js?v={{v}}"></script>
<script src="/static/alerts.js?v={{v}}"></script>
<script src="/static/infra.js?v={{v}}"></script>
<script src="/static/jobs.js?v={{v}}"></script>
<script src="/static/ci.js?v={{v}}"></script>
<script src="/static/schedules.js?v={{v}}"></script>
<script src="/static/queue.js?v={{v}}"></script>
<script src="/static/board.js?v={{v}}"></script>
<script src="/static/projects.js?v={{v}}"></script>
<script src="/static/shepherd.js?v={{v}}"></script>
<script src="/static/sessions.js?v={{v}}"></script>
<script src="/static/work.js?v={{v}}"></script>
<script src="/static/actions.js?v={{v}}"></script>
<script src="/static/fleet.js?v={{v}}"></script>
<script src="/static/costs.js?v={{v}}"></script>
<script src="/static/releases.js?v={{v}}"></script>
<script src="/static/focus.js?v={{v}}"></script>
<script src="/static/nav.js?v={{v}}"></script>
</body>
</html>
