<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agents - sign in</title>
<style>
:root { --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db; --accent: #2f6fde; --err: #d4483b; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #141413; --panel: #1d1d1b; --ink: #ecebe6; --muted: #9a998f; --line: #2e2d2a; --accent: #6f9ef0; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px; }
h1 { font-size: 18px; margin: 0 0 4px; }
p { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
label { display: block; font-size: 13px; margin: 0 0 6px; }
input { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; margin-bottom: 14px; }
.user { position: absolute; left: -9999px; }
button { width: 100%; font: inherit; color: #fff; background: var(--accent); border: 0; border-radius: 6px; padding: 10px; cursor: pointer; }
.err { color: var(--err); font-size: 13px; margin: -6px 0 12px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Agents</h1>
  <p>Sign in with the agent-web token. Your password manager can save it.</p>
  <input class="user" type="text" name="username" value="agent-web" autocomplete="username" tabindex="-1" aria-hidden="true">
  <label for="token">Token</label>
  <input id="token" type="password" name="token" autocomplete="current-password" autofocus required>
  {{error}}
  <button type="submit">Sign in</button>
</form>
</body>
</html>
