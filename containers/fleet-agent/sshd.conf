# fleet-agent's sshd: key-only, the one user, host key from its own volume so a new container
# keeps the identity known_hosts already pins. The host's authorized_keys arrive read-only with
# its ~/.ssh mount (fleet-agent up), so access is granted in exactly one place.
HostKey /etc/ssh/keys/ssh_host_ed25519_key
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers kblack0610
