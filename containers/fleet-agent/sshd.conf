# fleet-agent's sshd: key-only, the one user, host key from its own volume so a new container
# keeps the identity known_hosts already pins. The host's authorized_keys file is mounted
# read-only (fleet-agent up) and copied root-owned by the entrypoint, so access is granted in
# exactly one place and ~/.ssh in the home volume stays the container's own.
HostKey /etc/ssh/keys/ssh_host_ed25519_key
AuthorizedKeysFile /etc/ssh/authorized_keys/%u
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers kblack0610
