name: test image
description: >-
  Load the tests/Dockerfile image (every tests.yml job's toolchain, in the stage the job names) from the Actions cache, or build it once and cache it, so a
  later tests/docker.sh finds it present and does not rebuild. The cache key is the image tag,
  which ends in a hash of everything the image is built from (tests/docker.sh --image). The job's
  env TEST_IMAGE_KIND (lean, rust or full) picks the Dockerfile stage, so a job loads only the
  bytes it uses and the kind is in the tag, so in the key.
inputs:
  tmux:
    description: TMUX_REF for the image; empty is tests/docker.sh's default
    default: ''
runs:
  using: composite
  steps:
    - id: tag
      shell: bash
      env:
        TMUX_REF: ${{ inputs.tmux }}
      # The week is in the key because the image also takes in what the hash cannot see: the
      # debian base tag and unpinned apt packages. A gate never tests an image over a week old.
      # A pool runner keeps its images between jobs, so one already present and built this week
      # skips the restore; an older one is replaced by this week's, as on a hosted runner.
      run: |
        tag=$(tests/docker.sh --image) week=$(date -u +%G-W%V)
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "week=$week" >> "$GITHUB_OUTPUT"
        if created=$(docker image inspect -f '{{.Created}}' "$tag" 2>/dev/null) &&
          [ "$(date -u -d "$created" +%G-W%V)" = "$week" ]; then
          echo present=true >> "$GITHUB_OUTPUT"
        fi
    - id: cache
      if: steps.tag.outputs.present != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/test-image.tar
        key: test-image-${{ steps.tag.outputs.tag }}-${{ steps.tag.outputs.week }}
    - if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      env:
        TAG: ${{ steps.tag.outputs.tag }}
      # A load that does not yield the tag docker.sh looks up fails here, not as a silent rebuild.
      run: |
        docker load -q -i "$RUNNER_TEMP/test-image.tar"
        docker image inspect "$TAG" >/dev/null
    # A miss builds and saves before the tests run, so a red test still leaves the image cached.
    # A last week's image still under the tag is dropped first, or --build would keep it.
    - if: steps.tag.outputs.present != 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TMUX_REF: ${{ inputs.tmux }}
        TAG: ${{ steps.tag.outputs.tag }}
      run: |
        docker rmi "$TAG" >/dev/null 2>&1 || true
        tests/docker.sh --build
        docker save -o "$RUNNER_TEMP/test-image.tar" "$TAG"
    - if: steps.tag.outputs.present != 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/test-image.tar
        key: test-image-${{ steps.tag.outputs.tag }}-${{ steps.tag.outputs.week }}
