name: test image
description: >-
  Load the tests/Dockerfile image (every tests.yml job's toolchain, in the stage the job names)
  from the LAN registry on a home-pool runner; on a runner with no registry (GitHub-hosted, a
  fork) from the Actions cache, else build it once and save it, so a later tests/docker.sh finds
  it present and does not rebuild. The image tag ends in
  a hash of everything the image is built from (tests/docker.sh --image). The job's env
  TEST_IMAGE_KIND (lean, rust or full) picks the Dockerfile stage, so the kind is in the tag, so in
  the registry name and the cache key. The registry is used only when both inputs registry (host:port,
  a repo variable: the address is the home LAN's and this repo is public) and registry-password
  (a repo secret) are set and the runner is self-hosted: a GitHub-hosted runner cannot reach the
  LAN, and a fork's pull request has no secret.

  Two modes. The default LOADS the image into the job's docker and a pool pod never pushes. With a
  registry (a pool pod) a load is one pull and a pull that fails FAILS the step in 5 minutes at
  most: it never falls back to the Actions cache (943 MB at 1 to 2 MB/s over the shared WAN, 509 s
  of a 10 minute job on 2026-11-25) or to a build (25 minutes under a hang guard that kills it
  silently), since the seed job ran first and the registry holds the image (ar-5959). Without a
  registry the load is the Actions cache, else a build. `seed: true` is the tests.yml `image` job's: it
  ENSURES the registry holds the image and loads nothing, building and pushing it when it is
  missing, so the one job that runs first per run is the only place a pool pod builds (a
  pod each, 34 of them, built the same new tag at once on 2026-11-25 and filled the registry
  host's link; the rust stage, cold-built under the notes job's 10-minute guard, never finished
  to seed itself; ar-5740).
inputs:
  seed:
    description: 'true: make sure the registry holds the image (build and push on a miss), load nothing'
    default: 'false'
  tmux:
    description: TMUX_REF for the image; empty is tests/docker.sh's default
    default: ''
  registry:
    description: host:port of the LAN registry (tests.yml passes vars.CI_REGISTRY); empty turns the registry off
    default: ''
  registry-password:
    description: the registry login's password (tests.yml passes secrets.CI_REGISTRY_PASSWORD); empty turns the registry off
    default: ''
runs:
  using: composite
  steps:
    - id: tag
      shell: bash
      env:
        TMUX_REF: ${{ inputs.tmux }}
        SEED: ${{ inputs.seed }}
      # The week is in the key because the image also takes in what the hash cannot see: the
      # debian base tag and unpinned apt packages. A gate never tests an image over a week old.
      # A pool runner keeps its images between jobs, so one already present and built this week
      # skips the restore; an older one is replaced by this week's, as on a hosted runner.
      run: |
        tag=$(tests/docker.sh --image) week=$(date -u +%G-W%V)
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "week=$week" >> "$GITHUB_OUTPUT"
        # A seed run asks the registry, whatever this daemon holds.
        if [ "$SEED" != true ] && created=$(docker image inspect -f '{{.Created}}' "$tag" 2>/dev/null) &&
          [ "$(date -u -d "$created" +%G-W%V)" = "$week" ]; then
          echo present=true >> "$GITHUB_OUTPUT"
        fi
    # The pool's registry (home-config apps/ci-registry, Address and Push rules): a pod pulls over
    # the LAN, not the shared WAN the Actions cache comes over (ar-5632). Plain HTTP, login for
    # push and pull; the pool's dind has --insecure-registry for it. The name is the image's own
    # tag plus the week, never a moving tag; only kblab-ci/dotfiles/* accepts a push from this
    # login. A seed run only asks the registry whether the tag exists (a manifest read, no layers)
    # and a miss there is what makes it build. A load run on a pool pod pulls, and a failed login or
    # pull ends the job at once: the seed job ran first, so the image is there and the pull is what
    # failed (a saturated registry host, 2026-11-25), and a slower path behind it (the cache's WAN
    # restore, a cold build) only ran the job into its hang guard (ar-5959). The pull's log line
    # carries its seconds, so a slow registry reads from the job log.
    - id: reg
      if: steps.tag.outputs.present != 'true' && runner.environment == 'self-hosted' && inputs.registry != '' && inputs.registry-password != ''
      shell: bash
      env:
        TAG: ${{ steps.tag.outputs.tag }}
        WEEK: ${{ steps.tag.outputs.week }}
        REGISTRY: ${{ inputs.registry }}
        PASSWORD: ${{ inputs.registry-password }}
        SEED: ${{ inputs.seed }}
      run: |
        ref="$REGISTRY/kblab-ci/dotfiles/test-image:${TAG#*:}-$WEEK"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        # A seed run falls through to a build (it is the one place a pool pod builds); a load run stops.
        miss() {
          if [ "$SEED" = true ]; then echo "::warning::$1; the seed job builds it"; else echo "::error::$1; this job loads from the registry only (no cache restore, no build)"; exit 1; fi
        }
        if timeout 30 docker login "$REGISTRY" -u ci --password-stdin <<<"$PASSWORD" >/dev/null; then
          echo login=true >> "$GITHUB_OUTPUT"
          if [ "$SEED" = true ]; then
            probe=(docker manifest inspect --insecure "$ref")
          else
            probe=(docker pull -q "$ref")
          fi
          start=$SECONDS
          if timeout 300 "${probe[@]}" >/dev/null; then
            if [ "$SEED" != true ]; then
              docker tag "$ref" "$TAG"
              docker image inspect "$TAG" >/dev/null
              echo "pulled $ref in $((SECONDS - start)) s"
            fi
            echo pulled=true >> "$GITHUB_OUTPUT"
          else
            miss "registry has no $ref, or did not serve it within $((SECONDS - start)) s (cap 300 s)"
          fi
        else
          miss "registry login failed"
        fi
    # The Actions cache is the loader for a run with no registry (a hosted runner, a fork); a seed run
    # builds instead, as the restore over the shared WAN is the slower path (1.3 MB/s on 2026-11-25),
    # then pushes. A pool pod's load never reaches here: the reg step ended it.
    - id: cache
      if: steps.tag.outputs.present != 'true' && steps.reg.outputs.pulled != 'true' && inputs.seed != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/test-image.tar
        key: test-image-${{ steps.tag.outputs.tag }}-${{ steps.tag.outputs.week }}
    - if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      env:
        TAG: ${{ steps.tag.outputs.tag }}
      # A load that does not yield the tag docker.sh looks up fails here, not as a silent rebuild.
      run: |
        docker load -q -i "$RUNNER_TEMP/test-image.tar"
        docker image inspect "$TAG" >/dev/null
    # A miss builds before the tests run, so a red test still leaves the image saved. A last
    # week's image still under the tag is dropped first, or --build would keep it.
    # A seed run with no registry login (a hosted runner, a fork) has nothing to seed and builds
    # nothing: the jobs that need the image load it their own way. A load run on a pool pod never
    # builds: it stopped in the reg step.
    - id: build
      if: steps.tag.outputs.present != 'true' && steps.reg.outputs.pulled != 'true' && steps.cache.outputs.cache-hit != 'true' && (inputs.seed != 'true' || steps.reg.outputs.login == 'true')
      shell: bash
      env:
        TMUX_REF: ${{ inputs.tmux }}
        TAG: ${{ steps.tag.outputs.tag }}
      run: |
        docker rmi "$TAG" >/dev/null 2>&1 || true
        tests/docker.sh --build
    # Only a seed run pushes: every job that loads the image waits for it (tests.yml `image`), so a
    # load job never pushes, where twenty pushes of one tag at once were the 2026-11-25 burst. A
    # failed push fails the seed job, since every load job behind it pulls from the registry and has
    # no other source.
    - id: push
      if: inputs.seed == 'true' && steps.build.outcome == 'success'
      shell: bash
      env:
        TAG: ${{ steps.tag.outputs.tag }}
        REF: ${{ steps.reg.outputs.ref }}
      run: |
        docker tag "$TAG" "$REF"
        if timeout 600 docker push -q "$REF" >/dev/null; then
          echo pushed=true >> "$GITHUB_OUTPUT"
        else
          echo "::error::push of $REF failed; the jobs behind the seed load from the registry only"
          exit 1
        fi
    # The Actions cache is saved from a build unless the registry took the image (a seed run's
    # push): a 943 MB upload per build is the transfer this action exists to avoid, so only a build
    # on a runner with no registry (hosted) saves it, as that runner's one source.
    - id: save
      if: steps.build.outcome == 'success' && steps.push.outputs.pushed != 'true'
      shell: bash
      env:
        TAG: ${{ steps.tag.outputs.tag }}
      run: docker save -o "$RUNNER_TEMP/test-image.tar" "$TAG"
    - if: steps.save.outcome == 'success'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/test-image.tar
        key: test-image-${{ steps.tag.outputs.tag }}-${{ steps.tag.outputs.week }}
    # The login stays in the docker config of a pool pod that outlives the job's steps: drop it.
    - if: always() && steps.reg.outputs.login == 'true'
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
      run: docker logout "$REGISTRY" >/dev/null 2>&1 || true
