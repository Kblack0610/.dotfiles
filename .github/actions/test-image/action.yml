name: test image
description: >-
  Load the tests/Dockerfile image from the Actions cache, or build it once and cache it, so a
  later tests/docker.sh finds it present and does not rebuild. The cache key is the image tag,
  which ends in a hash of everything the image is built from (tests/docker.sh --image).
inputs:
  tmux:
    description: TMUX_REF for the image
    default: '3.8'
runs:
  using: composite
  steps:
    - id: tag
      shell: bash
      env:
        TMUX_REF: ${{ inputs.tmux }}
      run: echo "tag=$(tests/docker.sh --image)" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/test-image.tar
        key: test-image-${{ steps.tag.outputs.tag }}
    - if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: docker load -q -i "$RUNNER_TEMP/test-image.tar"
    # A miss builds and saves before the tests run, so a red test still leaves the image cached.
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TMUX_REF: ${{ inputs.tmux }}
        TAG: ${{ steps.tag.outputs.tag }}
      run: |
        tests/docker.sh --build
        docker save -o "$RUNNER_TEMP/test-image.tar" "$TAG"
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/test-image.tar
        key: test-image-${{ steps.tag.outputs.tag }}
