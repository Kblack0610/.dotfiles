name: consolidation ledger

# The one CI run of `fleet-bench ledger --check`: runners and timers may only shrink to the
# baseline, and every direct headless launch in either repo has its row in PIPELINES.md's
# "Model calls outside agentctl-run" table. The roster (runner confs, ledger-baseline, PIPELINES.md) lives in the
# private overlay, which this repo's CI cannot see, so the private repo calls this workflow on
# its PRs, its pushes to main and a daily schedule; the daily run catches a launch that landed
# here. Counts come from the two checkouts alone (fleet-bench ledger_roster), never live state.
on:
  workflow_call:
    inputs:
      runs-on:
        description: "one runner label, or a JSON label list; the private repo passes [\"self-hosted\",\"light\"], a seat the governor lends, since GitHub bills hosted minutes there"
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  ledger:
    name: ledger check
    runs-on: ${{ fromJSON(startsWith(inputs.runs-on, '[') && inputs.runs-on || toJSON(inputs.runs-on)) }}
    timeout-minutes: 5
    steps:
      # No token is left in either checkout: the second runs public main's fleet-bench.
      - uses: actions/checkout@v4
        with:
          path: private
          persist-credentials: false
      # fleet-bench and the launch scan come from the public repo at main: the counts must
      # see what has landed there, and this repo calls the workflow from main.
      - uses: actions/checkout@v4
        with:
          repository: Kblack0610/.dotfiles
          ref: main
          path: public
          persist-credentials: false
      - name: Ledger check
        run: |
          export LEDGER_CONF_DIR="$PWD/private/.config/agentctl/agents"
          export LEDGER_BASELINE="$PWD/private/.config/agentctl/ledger-baseline"
          export LEDGER_PIPELINES="$PWD/private/.config/agentctl/PIPELINES.md"
          export LEDGER_SRC="$PWD/public/.local:$PWD/public/.config:$PWD/public/.claude/skills:$PWD/private/.local:$PWD/private/.config:$PWD/private/.claude/skills"
          export BENCH_LIB_DIR="$PWD/public/.local/lib"
          rc=0; public/.local/bin/fleet-bench ledger --check || rc=$?
          case $rc in
            0) ;;
            1) echo "::error::the ledger check failed, see the lines above. A 'grew' line means retire one, or add a dated delta line to .config/agentctl/ledger-baseline in this PR (its header has the format); a 'launch with no PIPELINES.md row' line means route it through agentctl-run or add its row to .config/agentctl/PIPELINES.md, and a 'row with no launch' line means drop that row; any other line is a fault in the check"; exit 1 ;;
            *) echo "::error::the ledger check could not run (exit $rc, see above)"; exit "$rc" ;;
          esac
