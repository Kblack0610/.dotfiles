name: fleet-agent image

# Builds the fleet-agent image (containers/fleet-agent) and proves it is a worker: fleet-agent up
# starts it on throwaway volumes, then probe_hosts' own readiness probe runs in it over ssh
# (tests/fleet-agent-smoke.sh). A PR or merge runs it when it touches the image or what the smoke
# drives; the image snapshots the whole tree, so the daily `schedule` run below republishes :latest with every
# other change main took that day. Only main runs push, tagged with the commit sha and latest.
on:
  pull_request:
    paths:
      - containers/fleet-agent/**
      - .local/bin/fleet-agent
      - .local/bin/fleet-node
      - .local/bin/fleet-dispatch
      - .local/bin/claude-acct
      - .local/bin/skill-deploy
      - .local/bin/wt
      - .local/lib/fleet-hosts.sh
      - .local/src/installation_scripts/**
      - .local/src/agent-panel/**
      - .local/src/agent-web/**
      - .stow-local-ignore
      - tests/fleet-agent-smoke.sh
      - .github/workflows/fleet-agent.yml
  push:
    branches: [main]
    paths:
      - containers/fleet-agent/**
      - .local/bin/fleet-agent
      - .local/bin/fleet-node
      - .local/bin/fleet-dispatch
      - .local/bin/claude-acct
      - .local/bin/skill-deploy
      - .local/bin/wt
      - .local/lib/fleet-hosts.sh
      - .local/src/installation_scripts/**
      - .local/src/agent-panel/**
      - .local/src/agent-web/**
      - .stow-local-ignore
      - tests/fleet-agent-smoke.sh
      - .github/workflows/fleet-agent.yml
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:

concurrency:
  group: fleet-agent-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  image:
    # The light pool's dind pods build and run the image; only a fork PR takes a hosted runner, so a
    # fork's code never runs on the LAN (ar-3017).
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER_LIGHT || '"ubuntu-24.04"') }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kblack0610/fleet-agent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The image is about 5 GB; a hosted runner's preinstalled SDKs leave too little disk for it.
      - name: Free disk
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      # docker build, not buildx's container driver: --load there exports a second copy.
      - name: Build
        run: |
          docker build -f containers/fleet-agent/Containerfile \
            --build-arg FLEET_REV="$GITHUB_SHA" -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
      - name: Smoke - a fresh node reads not ready, a signed-in one ready
        run: tests/fleet-agent-smoke.sh "$IMAGE:$GITHUB_SHA"
      - name: Push
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push --all-tags "$IMAGE"
