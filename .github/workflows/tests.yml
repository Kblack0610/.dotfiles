name: shell tests

# The jobs, by what they can catch:
#
#   fast   the tmux-free tiers (unit + integ), in shards. Runs directly on the runner because
#          it never starts a tmux server. On a pull request only the files the change can
#          affect plus tests/broad.txt (tests/pick.sh, the picker the Stop hook uses); on main,
#          the schedule and a manual run, every file.
#   ui     the tmux ui tier, inside the SAME container a developer uses locally
#          (tests/docker.sh). Dev/CI parity is the point: if the image or the entry script
#          breaks, this job goes red rather than only the developer's laptop.
#          The schedule and a manual run sweep five tmux versions (the drift sweep).
#   rust   the tracked crates (tests/rust-crates.sh). Runs on the bare runner, NOT in the test
#          image, which has no Rust toolchain. On a pull request only the crates the change can
#          affect (tests/pick.sh rust). Testing and linting all six took 212-248 s cold, the critical
#          path of most PRs, so the job restores main's build output (Restore cargo).
#          Added 2026-08-09:
#          those crates carried 188 in-tree tests that had never run anywhere, and the
#          installer treats a failed build as non-fatal and keeps the OLD binary on PATH --
#          so a crate could stop compiling and the only symptom would be a tool quietly
#          behaving like an older version.
#   notes  the bats cases that need a built notes binary, beside the rust job, not behind it.
#   lint   shellcheck + house rules, in the pinned image.
#   gate   the one required check: red unless every gating job ran and passed.
#   report the fast and ui tiers' JUnit, drawn on the run's Summary page: a row per file
#          and every failed test, so a red reads without opening the logs.
on:
  # `push` is restricted to main on purpose. With `branches: ['**']` every job runs TWICE on
  # a PR branch -- once for the push event, once for the pull_request event -- which doubles
  # the minutes and makes `gh pr checks` list every job twice. Branches get their coverage
  # from the pull_request trigger; this push entry exists so main itself is still verified
  # after a squash-merge.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'     # Mondays 04:17 UTC
  workflow_dispatch:

concurrency:
  group: shell-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Where every job runs (fleet-agent.yml stays hosted: it frees disk with sudo): the repo variable LINUX_RUNNER_LIGHT, the switch
# the org repos use. Set to ["self-hosted","light"], jobs run on the home pool, whose runners and
# packages home-config's ansible provisions; deleted (gh variable delete LINUX_RUNNER_LIGHT
# -R Kblack0610/.dotfiles), they run on GitHub-hosted ubuntu-24.04, free on this public repo.
# A fork's pull request always runs hosted: the repo is public, and a pool runner would run a
# stranger's code on the home LAN. unit/ci_runner_toggle.bats keeps every runs-on this one line.
jobs:
  # The PR budget is a p90 of 5 minutes (~/.local/src/docs/ci.md); each job's timeout-minutes is
  # its hang guard (fast's is 2x the budget), never a lever. tests/pick.sh lists the files, and
  # tests/shard.sh splits them across runners, balanced by the seconds the weights job reads from the newest green main run's
  # JUnit. A shard is bounded below by its heaviest file, so no file may weigh much past a shard's
  # share of a picked run: unit/fleet_dispatch*.bats, 40% of unit, is ten files for that. With
  # eight shards a run picking the family still read p90 6.4 min over 54 runs, its slowest shard
  # one file of 450-750 s (run_floors, run_harness, reap: about 300 s of wall each), so those
  # three were split in half (ar-3036). The shard counts are sized so a full run fits the budget
  # on a slow runner: the files are CPU-bound, so past an even split only more shards cut the
  # wall, and a full run (any tests/helpers change, as sandbox.bash loads in every file) puts a
  # shard or two on a runner that runs every file about 1.7x slower. In the 24 PR runs after
  # #2920 those were the runners naming an Azure region (westus, eastus...): their shards took up
  # to 373 s against at most 276 s on "Region: us" ones, with an even predicted split of 542 s of
  # bats time per unit shard, and the gate read p90 6.3 min (ar-3036). Twelve unit shards put
  # about 360 s of bats time in each, and four integ shards about 310 s, about 250 s of wall on
  # a slow runner. The fixed cost per shard (job start to the bats step: checkout, bats, cached
  # debs) was 8-9 s in run 44887277102, small beside that, so splitting wins over trimming it.
  # On 2026-11-23 the account sat at its hosted parallel-job cap (36 running, 105 queued), so a
  # shard costs queue time wherever it runs: the pool has fewer slots than hosted, and queue time
  # rising is the sign to stop adding them. unit/shard.bats checks that --matrix lists every shard
  # of each tier it sizes.
  #
  # The table and the pick are computed once, here, because two shards splitting by two tables
  # or two picks can each leave a file out. No table (no green main run within the artifacts' 14
  # days, an API error) means every shard weighs its files by @test count, said on the Summary
  # page: that costs balance, never coverage. The pick also sizes the matrix: a tier gets one
  # shard per SHARD_SECONDS of predicted bats time, at most its FAST_SHARDS count (all of them
  # with no table), so a small pick no longer holds 16 runners (ar-3036, tests/shard.sh --matrix).
  # 180 s of bats time is about 100 s of shard wall, which ends before lint, ui and notes do.
  # A pick that fails fails this job, and fast, which needs it, skips, so the gate reads red.
  weights:
    name: shard weights
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER_LIGHT || '"ubuntu-24.04"') }}
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    env:
      FAST_SHARDS: unit=12 integ=4
      SHARD_SECONDS: 180
    outputs:
      table: ${{ steps.junit.outputs.table }}
      picked: ${{ steps.plan.outputs.picked }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # A pull request checks out its merge commit; depth 2 brings its first parent, the base
      # tip, so HEAD^1..HEAD is exactly the change.
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: Weights from the newest green main run
        id: junit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$RUNNER_TEMP/junit table=
          id=$(gh run list -R "$GITHUB_REPOSITORY" -w tests.yml -b main -e push -s success -L 1 \
            --json databaseId --jq '.[0].databaseId // empty') || id=
          if [ -n "$id" ] && gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'junit-unit-*' -p 'junit-integ-*' -D "$d" &&
            table=$(tests/shard.sh --junit unit "$d"/junit-unit-* && tests/shard.sh --junit integ "$d"/junit-integ-*); then
            echo "Shard weights: $(grep -vc '^#' <<<"$table") files from main run $id" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            table=
            echo "::warning::no JUnit from a green main run${id:+ (run $id)}; every shard weighs its files by @test count"
            echo "Shard weights: none, so every shard weighs its files by @test count" >>"$GITHUB_STEP_SUMMARY"
          fi
          { echo 'table<<EOF_TABLE'; [ -z "$table" ] || printf '%s\n' "$table"; echo EOF_TABLE; } >>"$GITHUB_OUTPUT"
          [ -z "$table" ] || printf '%s\n' "$table" >"$RUNNER_TEMP/weights.tsv"
      # The pick line ("picked N of M" or "full: <why>") and each tier's shard count go on the
      # run's Summary page.
      - name: Pick the files and size the matrix
        id: plan
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: |
          [ ! -s "$RUNNER_TEMP/weights.tsv" ] || export SHARD_WEIGHTS=$RUNNER_TEMP/weights.tsv
          { tests/pick.sh unit $BASE && tests/pick.sh integ $BASE; } >"$RUNNER_TEMP/picked" 2>"$RUNNER_TEMP/why" &&
            matrix=$(tests/shard.sh --matrix "$RUNNER_TEMP/picked" $FAST_SHARDS 2>>"$RUNNER_TEMP/why") ||
            { cat "$RUNNER_TEMP/why"; exit 1; }
          tee -a "$GITHUB_STEP_SUMMARY" <"$RUNNER_TEMP/why"
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          { echo 'picked<<EOF_PICKED'; cat "$RUNNER_TEMP/picked"; echo EOF_PICKED; } >>"$GITHUB_OUTPUT"

  fast:
    name: fast tier (${{ matrix.tier }} ${{ matrix.shard }})
    needs: weights
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER_LIGHT || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    env:
      APT_PKGS: lua5.4 parallel inotify-tools sqlite3 stow   # the one list: install, check, cache key
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.weights.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bats-vendor
      # GNU parallel lets the unit and integ tiers run with bats --jobs (tests/Makefile FAST_PAR).
      # inotify-tools: waybar_webcam.bats drives webcam.sh on real kernel inotify events.
      # sqlite3: session_outcomes.bats builds a fixture opencode DB.
      # stow: dotfiles_deploy.bats checks its links against stow itself.
      # A pool host has them from home-config's ansible.
      - name: GNU parallel, inotify-tools, sqlite3, stow
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/hosted-apt
        with:
          packages: ${{ env.APT_PKGS }}
      # No tmux or fzf installed on purpose. These tiers must not need either: the contract
      # tier drives the subjects through the fake tmux stub, and if a test ever starts
      # reaching for a real binary, this job is where that shows up.
      # The list is taken in its own step so a failed split stops the job (bash -e) before any
      # test runs. A tier that picked nothing gets one empty shard, not a failure; every shard
      # puts its predicted seconds beside the actual ones on the Summary page, so a skewed split
      # shows.
      - name: The shard's files
        id: pick
        env:
          PICKED: ${{ needs.weights.outputs.picked }}
          WEIGHTS_TABLE: ${{ needs.weights.outputs.table }}
        run: |
          if [ -n "$WEIGHTS_TABLE" ]; then
            printf '%s\n' "$WEIGHTS_TABLE" >"$RUNNER_TEMP/weights.tsv"
            export SHARD_WEIGHTS=$RUNNER_TEMP/weights.tsv
          fi
          printf '%s\n' "$PICKED" >"$RUNNER_TEMP/picked"
          tests/shard.sh ${{ matrix.tier }} ${{ matrix.shard }} "$RUNNER_TEMP/picked" >"$RUNNER_TEMP/files" 2>"$RUNNER_TEMP/split" ||
            { cat "$RUNNER_TEMP/split"; exit 2; }
          cat "$RUNNER_TEMP/split"
          # Only a shard holding a file that runs `bun test` downloads bun.
          if [ -s "$RUNNER_TEMP/files" ] && (cd tests && grep -lq 'bun test' $(<"$RUNNER_TEMP/files")); then
            echo bun=true >>"$GITHUB_OUTPUT"
          fi
      # bun runs the hunk extensions' TypeScript tests (unit/hunk_*.bats), which skip without it
      # off CI and fail without it on CI. From the release CDN, pinned by version and the zip's
      # sha256 (bump both), so a new bun cannot turn the gate red on a repo nobody touched; the
      # step is capped like the apt one, so a hung download fails here by name. The retries match
      # tests/Dockerfile's curlrc: the CDN answers a 504 now and then, and 8 x 15 s fits the cap.
      - name: bun
        if: steps.pick.outputs.bun == 'true'
        timeout-minutes: 3
        env:
          BUN_VERSION: 1.4.5
          BUN_SHA256: 94559b3b528995a49452f9f2404cec74f2efd7d06e0a000a8cd214b02c3666eb   # bun-linux-x64.zip
        run: |
          zip=$RUNNER_TEMP/bun.zip
          curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o "$zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "$BUN_SHA256  $zip" | sha256sum -c -
          unzip -q "$zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bun-linux-x64" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/bun-linux-x64/bun" --version
      - name: Fast tier shard
        env:
          JUNIT: 1
          TAG: ${{ matrix.tier }} ${{ matrix.shard }}
        run: |
          files=$(<"$RUNNER_TEMP/files")
          [ -n "$files" ] || { echo "nothing picked for $TAG"; exit 0; }
          start=$SECONDS rc=0
          make -C tests test-files FILES="$(tr '\n' ' ' <<<"$files")" || rc=$?
          actual=$(tests/shard.sh --junit ${{ matrix.tier }} tests/artifacts/junit |
            awk '!/^#/ { s += $1 } END { printf "%.0f", s }') || actual='?'
          median=$(grep -c 'weighs the median' "$RUNNER_TEMP/split" || true) note=
          [ "$median" = 0 ] || note=" ($median files not in the table, weighed at the median)"
          echo "- $(sed -n 's/^shard.sh: //p' "$RUNNER_TEMP/split" | tail -1); actual ${actual}s of test time in $((SECONDS - start))s wall$note" >>"$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Upload JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.tier }}-${{ strategy.job-index }}
          path: tests/artifacts/junit/
          if-no-files-found: ignore
          retention-days: 14

  ui:
    name: ui tier (tmux ${{ matrix.tmux }}, container)
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER_LIGHT || '"ubuntu-24.04"') }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # A push or PR runs only the version the author runs. The weekly schedule and a manual
        # run are the drift sweep: the environment moving underneath the repo (a new tmux, fzf
        # or distro) surfaces when nothing in the repo changed. Only this tier starts tmux, so
        # it is the only one swept. 3.4 is ubuntu-24.04's apt, 3.5a Debian trixie's, 3.6a the
        # mac-mini's (Homebrew), 3.7b the first with floating panes, 3.8 (patched) the author's;
        # the image builds each from source.
        tmux: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["3.4", "3.5a", "3.6a", "3.7b", "3.8"]' || '["3.8"]') }}
    steps:
      - uses: actions/checkout@v4
      # The test-image step loads the image (or builds it on a cache miss); bats-vendor puts
      # bats on the host, where docker.sh finds it, then the tier runs inside the container. Runners have no tty; that is fine -- new-session -d, send-keys
      # and capture-pane all work headless. Only display-popup needs an attached client, and
      # nothing here exercises one (the popup is a single .tmux.conf binding; the script is
      # the testable surface). If a future test ever needs a client, the idiom is bats-core's
      # own workflow: shell: 'script -q -e -c "bash {0}"' with TERM=linux.
      # tests/ui/session_send.bats drives the real agent-panel binary; the image has no Rust, so
      # it is built here and read via the mount. Static (musl), because a pool host's glibc is
      # newer than trixie's and a glibc build from it would not start in the container.
      - name: Toolchain and cargo cache
        uses: ./.github/actions/rust
        with:
          targets: x86_64-unknown-linux-musl
      - name: Build agent-panel for the ui tier
        run: cargo build --locked --target x86_64-unknown-linux-musl --manifest-path .local/src/agent-panel/Cargo.toml
      # The image comes from the Actions cache when nothing it is built from changed.
      - uses: ./.github/actions/test-image
        with:
          tmux: ${{ matrix.tmux }}
      - uses: ./.github/actions/bats-vendor
      - name: UI tier in the disposable container
        env:
          TMUX_REF: ${{ matrix.tmux }}
          JUNIT: 1
        run: tests/docker.sh test-ui-inner
      - name: Upload JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-ui-tmux-${{ matrix.tmux }}
          path: tests/artifacts/junit/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failure screens
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screens-tmux-${{ matrix.tmux }}
          path: tests/artifacts/*.screen
          if-no-files-found: ignore
          retention-days: 14

  # The one check branch protection requires. It is green only when every gating job ran and
  # passed: a job that failed, was cancelled or was skipped reads red here, so a dropped shard
  # or a job a bad `if:` skipped cannot merge. weights gates through fast, which skips without
  # its pick, and report only draws, so neither is in needs. tests/unit/ci_gate.bats keeps `needs`
  # complete: a new job either joins it or is named there as not a gate. always(), not
  # !cancelled(): a skipped required check counts as passed, so a cancelled run must read red.
  gate:
    name: gate
    needs: [fast, ui, rust, notes, skills, lint]
    if: ${{ always() }}
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER_LIGHT || '"ubuntu-24.04"') }}
    timeout-minutes: 2
    steps:
      - name: Every gating job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null

  # Draws only: the tier jobs are the gate, and fail-on-error: false keeps a failed test from
  # failing this job too. The reporter writes the job summary (use-actions-summary, its
  # default), so a read token is enough and it runs on fork PRs too.
  report:
    name: test report
    needs: [fast, ui]
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER_LIGHT || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: junit
      # bats names a suite by its file's basename, and seven basenames exist in two tiers
      # (unit/worktree.bats, integ/worktree.bats). The artifact name carries the tier.
      - name: Name each suite by tier
        run: |
          for f in junit/junit-*/*/report.xml; do
            [ -e "$f" ] || continue
            tier=$(cut -d- -f2 <<<"${f#junit/}")
            sed -i "s#<testsuite name=\"#&$tier/#" "$f"
          done
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: bats results
          path: 'junit/**/*.xml'
          reporter: java-junit
          list-tests: failed
          fail-on-error: false
          fail-on-empty: false

  rust:
    name: rust crates (test + fmt + clippy)
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER_LIGHT || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0   # incremental state only helps a rebuild in place, and it bloats the cache
      RUST_JOBS: 4           # crates rust.sh gates at once, the runner's vCPU count (tests/rust.sh)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # The pinned toolchain, so a runner image bump cannot change which clippy lints a run checks.
      - name: Toolchain and cargo cache
        id: cargo
        uses: ./.github/actions/rust
        with:
          components: clippy,rustfmt
      # The pick line ("picked N of M crates" or "full: <why>") goes on the Summary page.
      # Clippy runs on every run, pull requests included: a lint that only main checked reached main
      # red first (2026-11-13 #2086, 2026-11-20 sort_by_key and WAITING_JS).
      - name: Rust gate
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: |
          crates=$(tests/pick.sh rust $BASE 2>"$RUNNER_TEMP/why") || { cat "$RUNNER_TEMP/why"; exit 1; }
          tee -a "$GITHUB_STEP_SUMMARY" <"$RUNNER_TEMP/why"
          printf '%s\n' "$crates" >"$RUNNER_TEMP/crates"
          [ -n "$crates" ] || { echo "no crate picked"; exit 0; }
          make -C tests test-rust CRATES="$(tr '\n' ' ' <<<"$crates")"
      # agent-web's tabs drawn at phone width from fixtures (tests/agent-web/phone/render.mjs): a lead
      # cell off screen, a pageerror, an "undefined" cell, a fixture table that no longer matches
      # hub-core's columns, or a tab, inner tab or project inner tab taller than three screens at
      # 1400x900 fails it. It runs when agent-web is picked (hub-core and web-kit pick it, and so
      # does the harness, tests/rust-inputs.txt). playwright-core is pinned here and installs its
      # own chromium; the dump reuses the target the gate just built. About 30 s, plus the download.
      - name: Phone render harness
        env:
          PLAYWRIGHT_CORE: 1.62.1
          CARGO_TARGET_DIR: ${{ github.workspace }}/.local/src/agent-web/target
        run: |
          grep -qx '.local/src/agent-web' "$RUNNER_TEMP/crates" || { echo "phone render harness: skipped, agent-web not picked" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          node_dir=~/.cache/agent-web-phone/node
          npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$node_dir" "playwright-core@$PLAYWRIGHT_CORE"
          node "$node_dir/node_modules/playwright-core/cli.js" install chromium
          node tests/agent-web/phone/render.mjs --out "$RUNNER_TEMP/phone"
      # /widget.json's document (hub_core::widget_doc) checked against the Tilecast format's schema
      # at the commit the script pins, with that repo's own checker. Runs when hub-core is picked
      # (the script picks it, tests/rust-inputs.txt). About 10 s.
      - name: Tilecast schema
        run: |
          grep -qx '.local/src/hub-core' "$RUNNER_TEMP/crates" || { echo "tilecast schema: skipped, hub-core not picked" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          tests/agent-web/tilecast-schema.sh
      - name: Phone screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-web-phone
          path: ${{ runner.temp }}/phone
          if-no-files-found: ignore
          retention-days: 7
      # Right after the gate and on a red too: a red main must not leave every later run cold.
      # Only main pushes, the schedule and a manual run save; a pull request never queues its own
      # copy of a GB-sized cache. The paths are the rust action's.
      - name: Save cargo
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.cargo.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            .local/src/*/target
          key: ${{ steps.cargo.outputs.key }}

  # The bats cases that need a built notes: the fast tier has none, so they would only skip there.
  # Its own job, because they need only the restored notes-cli build and not the Rust gate's output:
  # behind the gate they added 42 s to the rust job, the critical path of most pull requests
  # (274-296 s of a 5.0-6.0 min run, 2026-11-19), and here they run beside it.
  notes:
    name: notes bats (real notes binary)
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER_LIGHT || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      # The rust job's cache: main saves one, and this job only restores it.
      - name: Toolchain and cargo cache
        uses: ./.github/actions/rust
      - uses: ./.github/actions/bats-vendor
      - name: Board to queue join, on the real notes
        run: |
          cargo build --locked --manifest-path .local/src/notes-cli/Cargo.toml
          NOTES_BIN="$PWD/.local/src/notes-cli/target/debug/notes" make -C tests test-files FILES="unit/agent_land.bats unit/fleet_dispatch_reap.bats integ/research_pick.bats" BATS_FLAGS="--print-output-on-failure --filter 'end to end'"
      - name: Inbox triager and planner, on the real notes
        run: NOTES_BIN="$PWD/.local/src/notes-cli/target/debug/notes" make -C tests test-files FILES="integ/inbox_triage.bats integ/inbox_plan.bats" BATS_FLAGS="--print-output-on-failure"
      - name: Brief backfill, on the real notes
        run: NOTES_BIN="$PWD/.local/src/notes-cli/target/debug/notes" make -C tests test-files FILES="integ/agent_queue_backfill.bats" BATS_FLAGS="--print-output-on-failure"

  skills:
    name: skill lint (frontmatter + house rules)
    uses: ./.github/workflows/skill-lint.yml
    with:
      runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER_LIGHT || 'ubuntu-24.04' }}

  lint:
    name: shellcheck + house rules
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER_LIGHT || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Runs in the SAME image as the ui tier, which pins shellcheck. Installing
      # it from apt here instead would mean CI lints with a different shellcheck than the
      # developer does, and the first version bump would produce findings nobody can
      # reproduce locally. lint.sh itself is shared with the Makefile and the Stop hook, so
      # the severity ratchet and the file list have exactly one definition.
      - uses: ./.github/actions/test-image
      - uses: ./.github/actions/bats-vendor
      - name: lint
        run: tests/docker.sh lint
