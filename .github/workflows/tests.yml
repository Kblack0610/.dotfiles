name: shell tests

# Five jobs, by what they can catch:
#
#   fast   the tmux-free tiers (unit + contract). Runs directly on the runner because it
#          never starts a tmux server. This is the same target the local stop-hook gates on.
#   ui     the tmux ui tier, inside the SAME container a developer uses locally
#          (tests/docker.sh). Dev/CI parity is the point: if the image or the entry script
#          breaks, this job goes red rather than only the developer's laptop.
#   drift  weekly sweep across tmux versions. What a local hook cannot catch is the
#          environment moving underneath the repo -- a new tmux, a new fzf, a distro bump --
#          which surfaces precisely when nothing in the repo changed.
#   rust   the four tracked crates (notes-cli, agent-panel, agent-web, timebox). Runs on the bare
#          runner, NOT in the test image, which has no Rust toolchain. Added 2026-08-09:
#          those crates carried 188 in-tree tests that had never run anywhere, and the
#          installer treats a failed build as non-fatal and keeps the OLD binary on PATH --
#          so a crate could stop compiling and the only symptom would be a tool quietly
#          behaving like an older version.
#   lint   shellcheck + shfmt + house rules, in the pinned image.
on:
  # `push` is restricted to main on purpose. With `branches: ['**']` every job runs TWICE on
  # a PR branch -- once for the push event, once for the pull_request event -- which doubles
  # the minutes and makes `gh pr checks` list every job twice. Branches get their coverage
  # from the pull_request trigger; this push entry exists so main itself is still verified
  # after a squash-merge.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'     # Mondays 04:17 UTC
  workflow_dispatch:

concurrency:
  group: shell-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The unit and integ tiers run as two jobs at once: back to back they took 4m47s and
  # 5m10s on 2026-11-05 and the shared 10-minute cap cut the job off on its last test.
  fast:
    name: fast tier (${{ matrix.tier }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tier: [unit, integ]
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap bats
        run: make -C tests bootstrap
      # GNU parallel lets the unit tier run with bats --jobs (tests/Makefile UNIT_PAR).
      # inotify-tools: waybar_webcam.bats drives webcam.sh on real kernel inotify events.
      # sqlite3: session_outcomes.bats builds a fixture opencode DB.
      - name: GNU parallel, inotify-tools, sqlite3
        run: |
          { command -v parallel && command -v inotifywait && command -v sqlite3; } >/dev/null ||
            { sudo apt-get update -qq && sudo apt-get install -y -qq parallel inotify-tools sqlite3; }
      # No tmux or fzf installed on purpose. These tiers must not need either: the contract
      # tier drives the subjects through the fake tmux stub, and if a test ever starts
      # reaching for a real binary, this job is where that shows up.
      - name: Fast tier
        run: make -C tests test-${{ matrix.tier }}

  ui:
    name: ui tier (tmux ${{ matrix.tmux }}, container)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # On push/PR only the version the author runs. The weekly `drift` job sweeps wider.
        tmux: ['3.8']
    steps:
      - uses: actions/checkout@v4
      # docker.sh builds the image, vendors bats on the host first, then runs the tier
      # inside the container. Runners have no tty; that is fine -- new-session -d, send-keys
      # and capture-pane all work headless. Only display-popup needs an attached client, and
      # nothing here exercises one (the popup is a single .tmux.conf binding; the script is
      # the testable surface). If a future test ever needs a client, the idiom is bats-core's
      # own workflow: shell: 'script -q -e -c "bash {0}"' with TERM=linux.
      # tests/ui/session_send.bats drives the real agent-panel binary; the image has no Rust,
      # so it is built here (the runner's glibc is older than trixie's) and read via the mount.
      - name: Build agent-panel for the ui tier
        run: cargo build --locked --manifest-path .local/src/agent-panel/Cargo.toml
      - name: UI tier in the disposable container
        env:
          TMUX_REF: ${{ matrix.tmux }}
        run: tests/docker.sh test-ui-inner
      - name: Upload failure screens
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screens-tmux-${{ matrix.tmux }}
          path: tests/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  drift:
    name: drift sweep (tmux ${{ matrix.tmux }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 3.4 is what ubuntu-24.04's apt ships and what most machines have.
        # 3.5a is Debian trixie's version. 3.7b is the first with floating panes, and 3.8 (patched) the author's.
        # The image builds tmux from source, so all of them are reachable.
        tmux: ['3.4', '3.5a', '3.7b', '3.8']
    steps:
      - uses: actions/checkout@v4
      - name: Whole suite in the container
        env:
          TMUX_REF: ${{ matrix.tmux }}
        run: tests/docker.sh test-container
      - name: Upload failure screens
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drift-screens-tmux-${{ matrix.tmux }}
          path: tests/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  rust:
    name: rust crates (test + clippy + fmt)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The ubuntu-24.04 image ships a stable Rust toolchain, so no third-party setup
      # action is needed -- consistent with this repo running zero tmux plugins by policy.
      # `rustup component add` is idempotent and only guards against an image that ships
      # cargo without clippy/rustfmt; rust.sh degrades to advisory on those two anyway.
      - name: Toolchain
        run: |
          rustup component add clippy rustfmt || true
          cargo --version && cargo clippy --version && cargo fmt --version
      # Keyed on the lockfiles, which ARE tracked here (and rust.sh passes --locked, so a
      # stale lockfile fails rather than silently resolving a newer dependency).
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('.local/src/*/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Rust gate
        run: make -C tests test-rust
      # The bats cases that need a built notes: the test job has none, so they would only skip there.
      - name: Board to queue join, on the real notes
        run: |
          cargo build --locked --manifest-path .local/src/notes-cli/Cargo.toml
          NOTES_BIN="$PWD/.local/src/notes-cli/target/debug/notes" make -C tests test-files FILES=unit/agent_land.bats BATS_FLAGS="--print-output-on-failure --filter 'end to end'"
      - name: Inbox triager and planner, on the real notes
        run: NOTES_BIN="$PWD/.local/src/notes-cli/target/debug/notes" make -C tests test-files FILES="integ/inbox_triage.bats integ/inbox_plan.bats" BATS_FLAGS="--print-output-on-failure"

  skills:
    name: skill lint (frontmatter + house rules)
    uses: ./.github/workflows/skill-lint.yml

  lint:
    name: shellcheck + shfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Runs in the SAME image as the ui tier, which pins shellcheck and shfmt. Installing
      # them from apt here instead would mean CI lints with a different shellcheck than the
      # developer does, and the first version bump would produce findings nobody can
      # reproduce locally. lint.sh itself is shared with the Makefile and the Stop hook, so
      # the severity ratchet and the file list have exactly one definition.
      - name: lint
        run: tests/docker.sh lint
