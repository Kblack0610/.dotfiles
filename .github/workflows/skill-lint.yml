name: skill lint

# The one definition of the skill lint. This repo calls it from tests.yml; the private
# overlay and game repos call it from a thin workflow of their own, so there is no second
# linter to drift. The standard it enforces is .local/src/docs/skills.md.
#
# The STATIC subset only. A runner has no ~/.claude/skills, no private overlay and no
# CLAUDE.md, so DEADPATH/NOCMD/UNDEPLOYED/GHOST/LISTBUDGET cannot be attempted here - those
# stay with the nightly docs-cleanup runner. What CI can decide, CI should decide: a
# SKILL.md has no compiler, so before this job the only thing standing between a broken
# skill and main was somebody reading the diff.
on:
  workflow_call:
    inputs:
      profile:
        description: "full for the dotfiles layout, project for a game repo's flat skills"
        type: string
        default: full

permissions:
  contents: read

jobs:
  skills:
    name: skill lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # All history, for the ratchet's merge base, but no old file contents: the blobs this
      # job reads arrive on demand, which matters on a game repo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      # The linter comes from the public repo: its own commit when that repo is the caller,
      # so a PR is tested with the linter it changes, and main for everyone else.
      - uses: actions/checkout@v4
        with:
          repository: Kblack0610/.dotfiles
          ref: ${{ github.repository == 'Kblack0610/.dotfiles' && github.sha || 'main' }}
          path: .skill-lint
          sparse-checkout: .local/bin
      # Exits 2 if it finds nothing at all, so a path change that silently empties the
      # input list fails the job instead of reporting success.
      - name: Lint skills, commands and agents
        env:
          PROFILE: ${{ inputs.profile }}
        run: .skill-lint/.local/bin/skill-drift --lint . --profile "$PROFILE"
      - name: The baseline only shrinks
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: .skill-lint/.local/bin/skill-drift --ratchet . "origin/$BASE"
