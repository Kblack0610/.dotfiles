# The desktop's case power button sits where the cat walks; a short press powered the
# box off mid-session (2026-11-12 08:28). Ignore the short press; shut down from the
# desktop or `systemctl poweroff`. A firmware hold of about 4s still forces power off.
#
# Deployed to /etc/systemd/logind.conf.d/ by setup_power_key in install_arch.sh;
# `systemctl reload systemd-logind` applies it without ending the session.
[Login]
HandlePowerKey=ignore
