# cachyos-settings caps the system journal at 50M (/usr/lib/systemd/journald.conf.d/00-journal-size.conf).
# On the fleet workstation that holds about six hours, so the kernel log of a crashed boot is
# rotated away before anyone reads it (the 2026-11-17 crashes left nothing). This drop-in sorts
# after it and wins.
#
# Deployed to /etc/systemd/journald.conf.d/ by setup_journal in install_arch.sh;
# `systemctl restart systemd-journald` applies it without ending the session.
[Journal]
SystemMaxUse=2G
