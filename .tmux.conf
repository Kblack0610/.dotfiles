set-option -g default-shell /bin/zsh
# tmux-256color over the legacy screen-256color: 175 terminfo caps vs 107, adding Ms
# (clipboard), Ss/Se (cursor style) and sitm/ritm (italics). Verified present locally
# with `infocmp tmux-256color`; if a machine ever lacks it, fall back to screen-256color.
set -ga terminal-overrides ",tmux-256color*:Tc,xterm-kitty:Tc"
set-option -g default-terminal "tmux-256color"
set -s escape-time 0

# Allow Kitty graphics / sixel escapes through tmux (fixes `icat` gibberish on repeat)
set -g allow-passthrough on
# Propagate the REAL terminal identity into the session env, so tools that probe for
# graphics support (yazi, image.nvim) can see kitty through tmux rather than only
# seeing tmux itself. Required by yazi's documented tmux setup.
# NOTE: per `man tmux`, update-environment applies "when a new session is created OR
# an existing session is attached", and default-terminal applies to "new windows
# created in this session". So detach + reattach + a NEW window is enough - a full
# kill-server is NOT required and would needlessly destroy every session.
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set-option -g prefix C-b
bind-key C-b send-prefix
set -g status-style 'bg=#333333 fg=#5eacd3'
#
bind r source-file ~/.tmux.conf
set -g base-index 1

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe 'wl-copy'
bind -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel 'wl-copy'

# Scrolling with mouse
setw -g mouse on

set -g mouse on
# sane scrolling:
# bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"

# Meta+hjkl to switch panes (no prefix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Meta+Shift+hjkl to resize panes (no prefix)
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.dotfiles/personal/todo.md"
# going to do by position for now
# Session switching by name (prefix + Alt+number)
# prefix + N to jump to hub (notes) session
# prefix + M to jump to lab session
# Root pages. N/M go to the TOP of a world (its manifest's first session: today's
# daily for hub, the projects overview for lab) rather than wherever you left off.
# Pair with C-n/C-h below, which resume — that is the split: N/M start over, C-h/C-l
# continue. These replace stale `switch-client -t hub/lab` bindings that predate the
# server split and could only ever find a session inside the CURRENT server.
bind N detach-client -E "tmx land hub root"
bind H detach-client -E "tmx land lab root"

# Window chooser with a tag column appended (see tags.sh).
#   Prefix+w    every window
#   Prefix+C-w  only tagged windows
# This format is tmux's STOCK choose-tree format with the tag markers added on
# the end. Do not simplify it: the `"#{pane_title}"` clause is what shows each
# Claude window's live summary, and dropping it silently guts the chooser.
bind w choose-tree -Zw -F '#{?pane_format,#{pane_current_command},#{?window_format,#{window_name}#{window_flags} (#{window_panes} panes)#{?#{==:#{window_panes},1}, "#{pane_title}",}#[fg=colour214]#{?@tag_important, [important],}#{?@tag_pinned, [pinned],}#{?@tag_agent, [agent],}#{?@tag_group, [#{@tag_group}],}#[default],#{session_windows} windows#{?session_grouped, (group #{session_group}),}#{?session_attached, (attached),}}}'
bind C-w choose-tree -Zw -f '#{||:#{@tag_important},#{||:#{@tag_pinned},#{||:#{@tag_agent},#{@tag_group}}}}'

set-option -g status-interval 3
# Disable automatic rename - let shell control window names (shows git branch)
set-option -g automatic-rename off
# set-option -g automatic-rename-format '#{b:pane_current_path}'

# Awesome setting to not exit tmux when closing a window
set-option -g detach-on-destroy off

# Status bar: short session name + claude agent status
# !n = needs attention, ~n = working, ·n = idle
set -g status-left-length 15
set -g status-left '#[fg=colour39,bold]#($HOME/.local/src/tmux/claude-status.sh)#[default] '
set -g status-right '#[fg=colour245]%H:%M'

# Window tag markers: * = important, + = pinned (see Prefix+a, tags.sh).
# Everything after the marker is tmux's stock default window format.
set -g window-status-format         '#[fg=colour214]#{?@tag_important,*,}#{?@tag_pinned,+,}#[default]#I:#W#{?window_flags,#{window_flags}, }'
set -g window-status-current-format '#[fg=colour214]#{?@tag_important,*,}#{?@tag_pinned,+,}#[default]#I:#W#{?window_flags,#{window_flags}, }'

# best for quick sesssions
bind f display-popup -E -w 80% -h 80% "$HOME/.local/src/tmux/sessionizer.sh"

# ── Worktrees (prefix C-f cuts one, prefix F picks one) ───────────────────────
# The worktree is the unit of work: C-f cuts a fresh one off the repo the current
# pane is sitting in and drops you in a session named after it, so a second agent
# never shares the first one's checkout. F lists every worktree on the machine.
# Lowercase f (directories) is untouched; these sit beside it, not over it.
bind C-f run-shell "$HOME/.local/bin/wt new -c '#{pane_current_path}'"
bind F display-popup -E -w 90% -h 85% "$HOME/.local/src/tmux/worktree.sh"

# Session picker (sesh). Server-aware: inside a NAMED server this scopes to that
# world's own sesh config and drops zoxide, because the zoxide db is global and
# would make every server's list look identical. On the default server it falls
# back to global behaviour. Additive to prefix f, not a replacement.
bind S display-popup -E -w 80% -h 80% "tmx pick-session"

# ── Past Claude sessions (prefix R = recall) ──────────────────────────────────
# Type to narrow every session ever run, live. The haystack is each session's
# whole card - every AI title it carried as its subject drifted, its first and
# last prompt, the files it touched - so "email" finds the session that now goes
# by "aerc-nested-folders-config". Enter resumes it in its own repo; ctrl-g
# escalates the query to a full-text sweep of every message.
bind R display-popup -E -w 90% -h 85% "$HOME/.local/bin/sessions search --window"

# ── Servers ──────────────────────────────────────────────────────────────────
# The layer ABOVE sessions: hub and lab are separate tmux SERVERS on their own
# sockets, so a kill-server can never reach past the one you are in, and
# prefix w (choose-tree) shows only the current world's sessions.
#
# tmux has no cross-server switch-client (switch-client is session-scoped), so the
# hop is `detach-client -E`: -E runs after the client detaches, which makes the
# detach+attach read as one motion.
#
# These call `tmx land` and NOT `tmx hop/root`. tmux leaves $TMUX SET for the -E
# command, so hop/root would see it, think they were still inside tmux, and issue a
# SECOND detach-client with no client attached — never reaching attach. `land` is
# the far side of that hop: it ensures the world and attaches, ignoring $TMUX.
#
# C-n/C-h RESUME, N/H ROOT — one letter per world, so the only thing the Ctrl
# changes is resume-vs-root. n = hub, h = lab.
#
# lab was on M/C-m and moved: Ctrl-M is a carriage return at the TERMINAL, so the
# keypress arrives as Enter and a `bind C-m` never fires. tmux listing C-m and
# Enter as separate table entries does not change what the terminal sends.
#
# Resume attaches to the most recently used session that is NOT the landing page,
# and a session remembers its own active window, so you land back exactly where you
# were working. The landing page is excluded on purpose: visiting the root with N/M
# updates its timestamp too, and without the exclusion a quick N would silently
# redirect your next resume to the daily.
# TWO views, deliberately, because they answer different questions.
#
# C-s is the COMPACT one: just the worlds, two rows, with that world's sessions in
# the preview. Use it when the question is "which world" and you do not want to read
# a wall of windows to answer it. This is also what a bare `tmx` runs.
#
# A is the FULL one (below): every session and every window everywhere, each row
# explaining itself, no preview. Use it when the question is "where is that window".
bind C-s display-popup -E -w 60% -h 50% "tmx pick"
bind C-n detach-client -E "tmx land hub last"
bind C-h detach-client -E "tmx land lab last"

# A = ALL: every session AND every window, across every server, in one list.
#
# This is the only view that crosses the server boundary. prefix w (choose-tree) is
# server-scoped by construction, prefix S (sesh) shells out to plain tmux and so
# follows $TMUX into whichever single world you are in, and prefix C-s lists servers
# with their sessions only in the preview. Seeing hub and lab together has to be
# assembled from outside both, which is what `tmx pick-all` does.
#
# Three selectable levels in one list - server, session, window. A session row says
# WHERE it is and WHAT is running in it; a window row carries the branch, the command,
# and the pane title, which is where a program puts its context (claude windows read as
# their task, nvim windows as their file).
#
# Deliberately NO preview pane: a preview only describes the row under the cursor, so
# you have to arrow through the list to find out what is in it. The list answers that
# itself.
bind A display-popup -E -w 90% -h 85% "tmx pick-all"

# Agent window chooser - shows all claude agent windows with status
# (Rust binary; cross-platform replacement for the old agent-chooser.sh)
bind g display-popup -E -w 100% -h 100% -B "$HOME/.local/bin/agent-panel"
bind-key G run-shell "$HOME/.local/bin/agent-panel next"
# The HEADLESS half of prefix g. agent-panel joins tmux panes against
# ~/.claude/sessions/<pid>.json, so an agent without a pane is structurally invisible to
# it - and that is most of the fleet: the agentctl runners, their timers and the sentinel
# watches all run under systemd with no terminal. fleet.sh was already the surface that
# answers "what is running, and does it need me", but it was reachable ONLY by opening the
# cockpit (prefix C). That is too much friction for the question you ask most often, and
# on 2026-07-27 it was how six lying watches and a six-week-stale daemon went unnoticed.
# C-g pairs with g on purpose: same question, the half without a terminal.
bind C-g display-popup -E -w 100% -h 100% "$HOME/.local/src/tmux/fleet.sh"
# COCKPIT (prefix C) - the persistent session you attach to and leave up. Every other
# surface here is a popup: it shows state the instant you press the key and vanishes on
# selection, so there was nowhere to LEAVE a view running. Windows: fleet (headless
# agentctl runners, sentinel watches, pending asks, and agents in OTHER sessions - the
# whole layer agent-panel structurally cannot see, since it only finds agents that own a
# pane) - bridge - watch - prs - notes. `attach` is idempotent: it rebuilds any missing
# window, so it doubles as the repair path after a kill-server.
bind C run-shell "$HOME/.local/src/tmux/cockpit.sh attach"
# PR viewer - shows open PRs from configured repos with status
bind p display-popup -E -w 90% -h 85% "$HOME/.local/src/tmux/pr-viewer.sh"

# Task cockpit - native fzf window over every notes profile + projects (no editor
# hosts the picker, so Esc just closes). Same practice as the agent-panel (prefix g).
bind t display-popup -E -w 100% -h 100% "$HOME/.local/src/tmux/notes-cockpit.sh"

# Mail - aerc in a PERSISTENT session so it stays connected (no reconnect on each open),
# like the cockpit (prefix C). Prefix+e jumps to it; switch away (prefix S / your session
# nav) to LEAVE aerc running; Ctrl+q inside aerc quits it (detach-on-destroy returns you).
bind e run-shell "tmux has-session -t mail 2>/dev/null || tmux new-session -d -s mail aerc; tmux switch-client -t mail"

# Session favourites - star the current claude/opencode chat, reopen it later
bind s run-shell "$HOME/.local/src/tmux/favourites.sh add"
bind o display-popup -E -w 90% -h 85% "$HOME/.local/src/tmux/favourites.sh open"

# Copy the latest Claude Code compact-summary block to the clipboard
bind-key C-y run-shell '$HOME/.local/bin/claude-copy-summary "#{pane_current_path}"'

# Image browser - yazi over the screenshot sink (prefix i) or the current path (prefix I).
# Deliberately a WINDOW, not a display-popup like the other cockpit surfaces: tmux popups
# are overlays that the kitty graphics layer does not track, so image previews inside one
# render blank or leave turds behind. A real window is the only place previews are stable.
# yazi ships a vim keymap by default (hjkl, gg/G, C-u/C-d, v/V) - nothing to configure.
# Enter opens the file in $EDITOR; `o` opens it in the desktop default (oculante).
bind i new-window -c "$HOME/Media/Pictures" -n images "yazi $HOME/Media/Pictures"
bind I new-window -c "#{pane_current_path}" -n images "yazi '#{pane_current_path}'"

# ── Window tags ──────────────────────────────────────────────────────────────
# Prefix+a then a letter. Deliberately NOT next to Prefix+t (the tasks/notes
# cockpit): entering a key table swallows the following keystroke, so a
# fumbled Shift on an adjacent key would silently eat a tasks-window press.
#
# Tags are tmux window user-options (@tag_*), not window names - the .zshrc
# precmd hook rewrites window names to the git branch on every prompt, so a
# name-based marker never survives. See .local/src/tmux/tags.sh.
#
#   a i  important     a p  pinned      a a  agent
#   a g  group:<name>  a x  clear       a l  list all tagged
#
# `switch-client -T tags` is a native one-shot key table: it returns to the
# root table after one key, so this is a real chord with no dispatcher script.
bind a switch-client -T tags
bind -T tags i run-shell "$HOME/.local/bin/tmux-tags toggle important -t '#{window_id}'"
bind -T tags p run-shell "$HOME/.local/bin/tmux-tags toggle pinned -t '#{window_id}'"
bind -T tags a run-shell "$HOME/.local/bin/tmux-tags toggle agent -t '#{window_id}'"
bind -T tags x run-shell "$HOME/.local/bin/tmux-tags clear -t '#{window_id}'"
bind -T tags g command-prompt -p "group:" "run-shell \"$HOME/.local/bin/tmux-tags add group:%% -t '#{window_id}'\""
bind -T tags l display-popup -E -w 70% -h 50% "$HOME/.local/bin/tmux-tags ls; read -n 1"
bind -T tags Escape switch-client -T root

# Prefix+W: fzf picker over EVERY window, where C-i/C-p/C-a/C-x tag the row
# under the cursor and Enter jumps. tmux exposes no user-bindable key table for
# choose-tree, so cursor-directed tagging has to live in a popup, not Prefix+w.
bind W display-popup -E -w 80% -h 60% "$HOME/.local/bin/tmux-tags pick"

# NOTE: a block of commented-out binds used to live here (smug starter, agent-starter.sh,
# spawn-project.sh, launcher.sh, and three archive/ spawners). Every script behind them has
# been deleted -- they were reachable ONLY through these dead binds, which is how ~850 lines
# sat in the tree looking maintained. Session/project starting is sesh (`bind S`) and the
# cockpit (`bind C`) now. Left as one line rather than nine dangling paths, because a
# commented bind pointing at a file that no longer exists is worse than no comment at all.
# Press prefix + m to move the current window to a different session
bind m choose-tree -s -O name "move-window -t '%%'"

# Increase scrollback for better history capture
set -g history-limit 50000
