set-option -g default-shell /bin/zsh
# tmux-256color over the legacy screen-256color: 175 terminfo caps vs 107, adding Ms
# (clipboard), Ss/Se (cursor style) and sitm/ritm (italics). Verified present locally
# with `infocmp tmux-256color`; if a machine ever lacks it, fall back to screen-256color.
set -ga terminal-overrides ",tmux-256color*:Tc,xterm-kitty:Tc"
set-option -g default-terminal "tmux-256color"
set -s escape-time 0

# Allow Kitty graphics / sixel escapes through tmux (fixes `icat` gibberish on repeat)
set -g allow-passthrough on
# Propagate the REAL terminal identity into the session env, so tools that probe for
# graphics support (yazi, image.nvim) can see kitty through tmux rather than only
# seeing tmux itself. Required by yazi's documented tmux setup.
# NOTE: per `man tmux`, update-environment applies "when a new session is created OR
# an existing session is attached", and default-terminal applies to "new windows
# created in this session". So detach + reattach + a NEW window is enough - a full
# kill-server is NOT required and would needlessly destroy every session.
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set-option -g prefix C-b
bind-key -N "Send the prefix key to the program" C-b send-prefix
set -g status-style 'bg=#333333 fg=#5eacd3'
#
# Every world is its own server; reloading only this one leaves the others on old keys.
bind -N "Reload the tmux config on every world" r run-shell "tmx reload"
set -g base-index 1

set-window-option -g mode-keys vi
bind -N "Begin a selection" -T copy-mode-vi v send-keys -X begin-selection
# y/Y name their clipboard command explicitly, picked per platform so the same
# file works on Linux, macOS and Termux. Do NOT set the global copy-command:
# tmux's default mouse bindings (drag end, double/triple click) inherit it and
# pipe empty selections into it, which wiped the system clipboard after a yank.
# set-clipboard also emits OSC52, so a yank inside an SSH session lands in the
# clipboard of the machine you are typing on.
set -s set-clipboard on
bind -N "Copy the selection to the clipboard" -T copy-mode-vi y send-keys -X copy-pipe 'wl-copy'
bind -N "Copy the selection to the clipboard and leave copy mode" -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel 'wl-copy'
if-shell 'command -v termux-clipboard-set' {
  bind -N "Copy the selection to the clipboard" -T copy-mode-vi y send-keys -X copy-pipe 'termux-clipboard-set'
  bind -N "Copy the selection to the clipboard and leave copy mode" -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel 'termux-clipboard-set'
}
if-shell 'command -v pbcopy' {
  bind -N "Copy the selection to the clipboard" -T copy-mode-vi y send-keys -X copy-pipe 'pbcopy'
  bind -N "Copy the selection to the clipboard and leave copy mode" -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel 'pbcopy'
}

# Scrolling with mouse
setw -g mouse on

set -g mouse on
# sane scrolling:
# bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"

# Meta+hjkl to switch panes (no prefix)
bind -N "Select the pane to the left" -n M-h select-pane -L
bind -N "Select the pane below" -n M-j select-pane -D
bind -N "Select the pane above" -n M-k select-pane -U
bind -N "Select the pane to the right" -n M-l select-pane -R

# Meta+Shift+hjkl to resize panes (no prefix)
bind -N "Resize the pane left by 5" -n M-H resize-pane -L 5
bind -N "Resize the pane down by 5" -n M-J resize-pane -D 5
bind -N "Resize the pane up by 5" -n M-K resize-pane -U 5
bind -N "Resize the pane right by 5" -n M-L resize-pane -R 5

# bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.dotfiles/personal/todo.md"
# going to do by position for now
# N = today's daily: hub's landing page, put back if you wandered off it.
# `tmx root`, NOT `detach-client -E "tmx land ..."`: tmx decides whether a detach is needed
# at all. run-shell keeps the client alive until tmx has read where it is.
bind -N "Today's daily note on hub" N run-shell "tmx root hub"

# Window chooser with a tag column appended (see tags.sh).
#   Prefix+w    every window
#   Prefix+C-w  only tagged windows
# This format is tmux's STOCK choose-tree format with the tag markers added on
# the end. Do not simplify it: the `"#{pane_title}"` clause is what shows each
# Claude window's live summary, and dropping it silently guts the chooser.
bind -N "Choose a window, with its tags" w choose-tree -Zw -F '#{?pane_format,#{pane_current_command},#{?window_format,#{window_name}#{window_flags} (#{window_panes} panes)#{?#{==:#{window_panes},1}, "#{pane_title}",}#[fg=colour214]#{?@tag_important, [important],}#{?@tag_pinned, [pinned],}#{?@tag_agent, [agent],}#{?@tag_group, [#{@tag_group}],}#{?@dispatch, [dispatch],}#{?#{T:@shepherd_live}, [shepherd],}#[default],#{session_windows} windows#{?session_grouped, (group #{session_group}),}#{?session_attached, (attached),}#{?@dispatch,#[fg=colour170] dispatch: #{=60:@dispatch}#[default],}#{?#{T:@shepherd_live},#[fg=colour170] shepherd#[default],}}}'
bind -N "Choose a tagged window" C-w choose-tree -Zw -f '#{||:#{@tag_important},#{||:#{@tag_pinned},#{||:#{@tag_agent},#{@tag_group}}}}'

set-option -g status-interval 3
# Disable automatic rename - let shell control window names (shows git branch)
set-option -g automatic-rename off
# set-option -g automatic-rename-format '#{b:pane_current_path}'

# Awesome setting to not exit tmux when closing a window
set-option -g detach-on-destroy off

# Status bar: short session name + claude agent status
# !n = needs attention, ~n = working, ·n = idle
set -g status-left-length 15
set -g status-left '#[fg=colour39,bold]#($HOME/.local/src/tmux/claude-status.sh)#[default] '
# A session fleet-dispatch started carries @dispatch = "<project>: <row>" (fleet-dispatch).
# The pane the shepherd lease was taken from carries @shepherd = the epoch the lease goes
# stale (fleet-shepherd lease). @shepherd_live is the one freshness test; read it through
# #{T:...} so its %s is the clock, which is how a stopped shepherd drops its tag.
set -g @shepherd_live '#{e|<:%s,#{@shepherd}}'
set -g status-right-length 80
set -g status-right '#{?@dispatch,#[fg=colour170]dispatch: #{=50:@dispatch} ,}#{?#{T:@shepherd_live},#[fg=colour170]shepherd ,}#[fg=colour245]%H:%M'

# Phone-sized clients get the status row back. Termux in landscape is ~16 rows
# and Claude Code already spends 3 of them on its input box, so the bar costs a
# sixth of what is left. status-autohide.sh re-decides every session on any
# client change; `Prefix + : set status` overrides it until the next hook fires.
set-hook -g client-attached 'run -b "$HOME/.local/src/tmux/status-autohide.sh"'
set-hook -g client-detached 'run -b "$HOME/.local/src/tmux/status-autohide.sh"'
set-hook -g client-resized  'run -b "$HOME/.local/src/tmux/status-autohide.sh"'

# Arriving at a pane drops a choose-tree left open on it. Prefix w is a pane mode, so leaving it
# by another route (a Prefix g jump, a click) leaves the tree on that pane, and the next
# jump there lands on the tree instead of the window. Copy mode is kept: scrollback can be meant.
%hidden DROP_TREE="if -F '#{==:#{pane_mode},tree-mode}' 'copy-mode -q'"
set-hook -g client-session-changed "$DROP_TREE"
set-hook -g session-window-changed "$DROP_TREE"

# Window tag markers: * = important, + = pinned (see Prefix+t, tags.sh).
# Everything after the marker is tmux's stock default window format, then @fleet_fmt.
# @fleet_fmt: the session's shepherd stage and labels, which `fleet-sessions` copies onto its
# window as @fleet_stage and @fleet_labels every minute (tmux_project). WORKING and NEEDS print
# nothing (NEEDS is already the ! in status-left); the rest print in their board colour, CHAT in the plain one (not attention).
set -g @fleet_fmt '#{?#{m/r:^(STALLED|CHAT|LANDED|DONE|PARKED)$,#{@fleet_stage}},#[fg=#{?#{==:#{@fleet_stage},STALLED},colour203,#{?#{==:#{@fleet_stage},CHAT},default,#{?#{==:#{@fleet_stage},PARKED},colour245,colour114}}}]#{@fleet_stage} #[default],}#{?@fleet_labels,#[fg=colour214][#{@fleet_labels}] #[default],}'
set -g window-status-format         '#[fg=colour214]#{?@tag_important,*,}#{?@tag_pinned,+,}#[default]#I:#W#{?window_flags,#{window_flags}, }#{E:@fleet_fmt}'
set -g window-status-current-format '#[fg=colour214]#{?@tag_important,*,}#{?@tag_pinned,+,}#[default]#I:#W#{?window_flags,#{window_flags}, }#{E:@fleet_fmt}'

# best for quick sesssions
bind -N "Find a repo or worktree and open it as a session" f display-popup -E -w 80% -h 80% "$HOME/.local/src/tmux/sessionizer.sh"

# ── Worktree (prefix F) ───────────────────────────────────────────────────────
# Cuts a fresh worktree off the repo the current pane is sitting in and drops you
# in a session named after it, so a second agent never shares the first one's
# checkout. One key, one action: NO picker, nothing to choose from. Lowercase f
# (the directory sessionizer) is untouched, including its search roots.
# `|| true`: wt already says why it stopped (display-message). Exiting 1 made tmux overwrite
# that with a bare "returned 1", which is how "still busy with the last press" read as broken.
# Inside the scratch (Prefix+A) F sends its conversation to lab instead.
bind -N "Cut a worktree; in the scratch, send it to lab" F if -F '#{==:#{session_name},scratch}' 'run-shell -b "$HOME/.local/src/tmux/scratch.sh send"' 'run-shell -b "$HOME/.local/bin/wt new -c #{q:pane_current_path} >/dev/null 2>&1 || true"'
# ...and X tears the current one down: kills this session and reaps its worktree. Safe to
# press from inside the session being killed - the teardown runs on the tmux SERVER, which
# outlives your shell. Refuses first, in your terminal, if the worktree still holds work.
bind -N "Kill this session and reap its worktree" X run-shell "$HOME/.local/bin/wt done '#{pane_current_path}'"

# ── Past Claude sessions (prefix R = recall) ──────────────────────────────────
# Type to narrow every session ever run, live. The haystack is each session's
# whole card - every AI title it carried as its subject drifted, its first and
# last prompt, the files it touched - so "email" finds the session that now goes
# by "aerc-nested-folders-config". Enter resumes it in its own repo; ctrl-g
# escalates the query to a full-text sweep of every message.
bind -N "Search every Claude session ever run; Enter resumes it" R display-popup -E -w 90% -h 85% "$HOME/.local/bin/sessions search --window"

# ── Servers ──────────────────────────────────────────────────────────────────
# The layer ABOVE sessions: hub and lab are separate tmux SERVERS on their own
# sockets, so a kill-server can never reach past the one you are in, and
# prefix w (choose-tree) shows only the current world's sessions.
#
# tmux has no cross-server switch-client (switch-client is session-scoped), so the
# hop is `detach-client -E`: -E runs after the client detaches, which makes the
# detach+attach read as one motion.
#
# H = every world in one tree (`tmx pick`). It opens collapsed to one row per world; Enter or
# a click on a world opens its sessions and windows, Enter or a click on one goes there, and
# typing searches all of them. This is the only view across servers: Prefix+w (choose-tree) is
# server-scoped by construction.
bind -N "Every world as a tree: Enter opens a world or goes to a session or window" H display-popup -E -w 90% -h 85% "tmx pick"
# C-h = the other world: hub -> lab, anywhere else -> hub, resuming the session and window you
# were last on there (never the landing page).
bind -N "The other world: hub to lab, anywhere else to hub" C-h run-shell "tmx toggle"
# L = the last session, tmux's own switch-client -l. A client fresh from a cross-world hop
# (i, N, C-h, H) has no last session, so then `tmx back` returns across that hop.
bind -N "The last session, across a world hop too" L if -F "#{client_last_session}" "switch-client -l" "run-shell 'tmx back'"
# A = the scratch: one big Claude popup to paste into, on hub's `scratch` session, so it
# outlives the popup. A again inside it closes it; Prefix+F inside it sends the conversation to
# its own lab session (scratch.sh send). Not Tab: tmux 3.8 binds Prefix+Tab stock.
bind -N "Scratch Claude: open or close the popup" A if -F '#{==:#{session_name},scratch}' detach-client 'display-popup -E -w 100% -h 100% "$HOME/.local/src/tmux/scratch.sh open #{q:pane_current_path}"'

# C-r = today's REFS dir, a page rather than a world; plain `r` stays reload.
#
# Profile-aware by LOCATION rather than a flag: `notes path` resolves through the active
# profile and $NOTES_PROFILE is inherited from the pane. Add `--profile <name>` to pin one.
#
# mkdir -p because `refs-today` is a directory notes does not create, and opening a
# missing path drops nvim into an unnamed buffer that silently is not your refs. Reuses
# the window so holding the key cannot stack them.
bind -N "Today's refs in nvim" C-r run-shell "$HOME/.local/src/tmux/refs.sh"

# Agent window chooser - shows all claude agent windows with status
# (Rust binary; cross-platform replacement for the old agent-chooser.sh)
bind -N "Agent panel: every Claude session" g display-popup -E -w 100% -h 100% -B "$HOME/.local/bin/agent-panel"
# G jumps to the next session that needs you (a prompt, a pending ask, a plan awaiting approval:
# the NEEDS stage); with none it says so in the message bar instead of moving.
bind-key -N "Jump to the next session that needs you" G run-shell "$HOME/.local/bin/agent-panel next"
# Every pending question on one full screen: the list, the card of the selected one, and the
# answer given there (1-9 then Enter, t types one, d drops, ctrl-/ layout, Esc closes). Below
# them, each session waiting on a prompt in its own terminal, which g goes to, so the header's
# questions plus prompts is the agents chip's !N.
bind -N "The question card of this session; with none here, every pending ask" y display-popup -E -B -w 100% -h 100% "$HOME/.local/src/tmux/questions.sh"
# The HEADLESS half of prefix g. agent-panel joins tmux panes against
# ~/.claude/sessions/<pid>.json, so an agent without a pane is structurally invisible to
# it - and that is most of the fleet: the agentctl runners, their timers and the sentinel
# watches all run under systemd with no terminal. fleet.sh was already the surface that
# answers "what is running, and does it need me". C-g pairs with g on purpose: same
# question, the half without a terminal.
bind -N "Fleet: runners, watches, asks, agents in other sessions" C-g display-popup -E -w 100% -h 100% "$HOME/.local/src/tmux/fleet.sh"
# P - the PR viewer: open PRs from the configured repos, with their status
bind -N "Open PRs from the configured repos, with their status" P display-popup -E -w 90% -h 85% "$HOME/.local/src/tmux/pr-viewer.sh"

# ── The editor (prefix Space) ────────────────────────────────────────────────
# ONE editor per session, at window 1, rooted where the session was born. Press it from
# anywhere to go there; press it again to come back to the exact window you left.
#
# Space, because it is the only key left that costs NOTHING to take. tmux's stock binding
# for it is next-layout, which nobody presses. Every mnemonic alternative was already spoken
# for - e is muxpoon, i the board, u/U the image browser, S/H the pickers - and a
# no-prefix Alt+ key would be swallowed globally, so neither nvim nor the shell could ever
# see it again. NOTHING was moved or rebound to make room for this.
#
# A WINDOW, not a display-popup like the panel surfaces, for two reasons: a popup is a
# client-side overlay that dies with the keypress, so there would be nothing to toggle BACK
# to; and CONVENTIONS.md:193 - a popup is unreadable to capture-pane and never draws
# headless, so nothing load-bearing belongs in one. `bind u` (yazi) is the other window.
#
# The window is created lazily on the first press, so a session you never edit in never
# pays for one. See .local/src/tmux/editor.sh.
# '#{window_id}' is expanded by tmux BEFORE the script runs, so the editor knows which
# window you pressed the key in. It must be passed: run-shell leaves TMUX_PANE empty, so
# a script that infers its own window gets tmux's current one - which by the second press
# is the editor itself. Same reason the tag binds below pass -t '#{window_id}'.
bind -N "This session's editor; again goes back" Space run-shell "$HOME/.local/src/tmux/editor.sh toggle '#{window_id}'"

# i - the hub (hub:board, one ratatui app with a tab per board), the one key that goes there:
# home, what needs you, what runs, health, machines. It asks for the Home tab, then goes to its window: `hub tab` sends the request to the
# running hub over ~/.local/state/hub/tab.sock, or leaves it in ~/.local/state/hub/tab for the
# hub that goto has to start, which reads it first. goto runs ensure first, so the key also
# rebuilds the window if it was killed. Inside, digits reach the other tabs.
bind -N "The hub board on its Home tab; digits reach the other tabs" i run-shell "$HOME/.local/bin/hub tab home; tmx goto hub hub:board"

# p - the projects finder: every profile's projects with their stage and open count, the
# selected one's card and open rows on the right. Enter, o or a digit opens that project on the
# hub Projects tab, e its sheet in the hub notes editor. -B: the script draws its own border.
# The size is also in notes.nvim cockpit.lua (<leader>np); change both. p was the PR viewer, now P.
bind -N "Projects: every project with its stage and open count" p display-popup -E -B -w 90% -h 85% "$HOME/.local/src/tmux/projects.sh"

# o - the shepherd pass running now, window hub:shepherd, from any world (a hop).
# It only goes there: with no pass window it lands on session hub, and never starts or
# resumes one.
bind -N "The shepherd pass running now (hub:shepherd); never starts one" o run-shell "$HOME/.local/bin/fleet-shepherd open >/dev/null 2>&1 || tmux display-message 'no shepherd pass running (fleet-shepherd passes)'"

# Copy the latest Claude Code compact-summary block to the clipboard
bind-key -N "Copy the latest Claude compact summary" C-y run-shell '$HOME/.local/bin/claude-copy-summary "#{pane_current_path}"'

# Image browser - yazi over the screenshot sink (prefix u) or the current path (prefix U).
# Deliberately a WINDOW, not a display-popup like the panel surfaces: tmux popups
# are overlays that the kitty graphics layer does not track, so image previews inside one
# render blank or leave turds behind. A real window is the only place previews are stable.
# yazi ships a vim keymap by default (hjkl, gg/G, C-u/C-d, v/V) - nothing to configure.
# Enter opens the file in $EDITOR; `o` opens it in the desktop default (oculante).
bind -N "Images in yazi: ~/Media/Pictures" u new-window -c "$HOME/Media/Pictures" -n images "yazi $HOME/Media/Pictures"
bind -N "Images in yazi: this pane's directory" U new-window -c "#{pane_current_path}" -n images "yazi '#{pane_current_path}'"

# ── Window tags ──────────────────────────────────────────────────────────────
# Prefix+t then a letter (t is stock clock-mode; this replaces it).
#
# Tags are tmux window user-options (@tag_*), not window names - the .zshrc
# precmd hook rewrites window names to the git branch on every prompt, so a
# name-based marker never survives. See .local/src/tmux/tags.sh.
#
#   t i  important     t p  pinned      t a  agent
#   t g  group:<name>  t x  clear       t l  list all tagged
#
# `switch-client -T tags` is a native one-shot key table: it returns to the
# root table after one key, so this is a real chord with no dispatcher script.
# C-t too: Ctrl still held from C-b sends C-t, which would otherwise do nothing.
bind -N "Tag this window: i important, p pinned, a agent, g group, x clear, l list" t switch-client -T tags
bind -N "Tag this window: i important, p pinned, a agent, g group, x clear, l list" C-t switch-client -T tags
bind -N "Toggle the important tag" -T tags i run-shell "$HOME/.local/bin/tmux-tags toggle important -t '#{window_id}'"
bind -N "Toggle the pinned tag" -T tags p run-shell "$HOME/.local/bin/tmux-tags toggle pinned -t '#{window_id}'"
bind -N "Toggle the agent tag" -T tags a run-shell "$HOME/.local/bin/tmux-tags toggle agent -t '#{window_id}'"
bind -N "Clear this window's tags" -T tags x run-shell "$HOME/.local/bin/tmux-tags clear -t '#{window_id}'"
bind -N "Add this window to a group" -T tags g command-prompt -p "group:" "run-shell \"$HOME/.local/bin/tmux-tags add group:%% -t '#{window_id}'\""
bind -N "List tagged windows" -T tags l display-popup -E -w 70% -h 50% "$HOME/.local/bin/tmux-tags ls; read -n 1"
bind -N "Cancel tagging" -T tags Escape switch-client -T root

# muxpoon (the .local/src/muxpoon submodule): Prefix+a pins or unpins this window (C-a too, for
# Ctrl still held from C-b), M-1..M-4 jump to a slot from anywhere, Prefix+e edits the list.
# Those keys are its defaults. Under ~/.dotfiles because a new ~/.local/src entry waits on a
# stow run and autopull does not stow; tmx goto wakes a world that is not running.
set -g @muxpoon-file "$HOME/.local/state/tmx/harpoon"
set -g @muxpoon-goto "tmx goto"
run-shell "$HOME/.dotfiles/.local/src/muxpoon/muxpoon.tmux"

# Prefix+W: fzf picker over EVERY window, where C-i/C-p/C-a/C-x tag the row
# under the cursor and Enter jumps. tmux exposes no user-bindable key table for
# choose-tree, so cursor-directed tagging has to live in a popup, not Prefix+w.
bind -N "Every window in fzf; tag the row under the cursor" W display-popup -E -w 80% -h 60% "$HOME/.local/bin/tmux-tags pick"

# Press prefix + m to move the current window to a different session
bind -N "Move this window to another session" m choose-tree -s -O name "move-window -t '%%'"

# K = every key that is live (Hyprland, tmux with its stock keys, nvim) in one searchable list.
# Each row is read from the bind itself, so give every bind here a -N note: that is its row.
bind -N "Every key: Hyprland, tmux and nvim" K display-popup -E -w 90% -h 85% "$HOME/.local/bin/keys"

# Increase scrollback for better history capture
set -g history-limit 50000
