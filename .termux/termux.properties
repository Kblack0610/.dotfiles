# termux.properties - the phone terminal profile. Deployed by `termux-style`.
#
# Every setting here buys back ROWS. A phone in landscape gives ~87 columns,
# which is plenty, but only ~16 rows - and Claude Code spends 3 on its input box.
#
# Termux cannot detect a hardware keyboard, so the extra-keys row cannot hide
# itself when one is attached. The manual toggles:
#   Volume-Up + Q   extra-keys row off/on   <- use this with a keyboard
#   Volume-Up + K   soft keyboard off/on
#   Ctrl+Alt +/-    font size (or pinch-zoom)

### Screen real estate ########################################################

# Reclaim the Android status bar. The workaround is not optional: without it
# some devices cut the bottom terminal line off in fullscreen.
fullscreen = true
use-fullscreen-workaround = true

# Default margins are 3dp horizontal / 0 vertical. Zero gives back a column
# either side, which matters more on a 5-inch screen than the padding does.
terminal-margin-horizontal = 0
terminal-margin-vertical = 0

### Extra keys ################################################################

# One row, not the stock two. ESC and the arrows are the load-bearing ones:
# ESC interrupts Claude Code, up/down walk its prompt history.
extra-keys = [['ESC','CTRL','ALT','TAB','-','/','LEFT','DOWN','UP','RIGHT']]

# Shrink the row itself to 60% of its normal height (1.0 = stock).
terminal-toolbar-height = 0.6

# Uncomment if you are mostly on a hardware keyboard - the soft keyboard then
# stays down until you ask for it with Volume-Up + K.
# hide-soft-keyboard-on-startup = true

### Cursor ####################################################################

# A bar cursor over SSH reads as "this is a remote shell", and no blink keeps
# the screen still while a long agent turn scrolls past.
terminal-cursor-style = bar
terminal-cursor-blink-rate = 0
