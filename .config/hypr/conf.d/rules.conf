### RULES ###

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = match:float false, match:workspace w[tv1], border_size 0
# windowrule = match:float false, match:workspace w[tv1], rounding 0
# windowrule = match:float false, match:workspace f[1], border_size 0
# windowrule = match:float false, match:workspace f[1], rounding 0

# Float the popup terminals used by waybar on-click actions (ssh picker, sync,
# pull, bluetuith, timebox) - class set via `kitty --class floating-term`.
windowrule = match:class ^(floating-term)$, float true
windowrule = match:class ^(floating-term)$, size 720 460
windowrule = match:class ^(floating-term)$, center true

windowrule = match:class ^(kitty)$, workspace 1
windowrule = match:class ^(firefox)$, workspace 2

# Image viewer - float and centre it so a screenshot opens as an overlay rather than
# retiling the workspace. oculante ships no StartupWMClass, so the class comes from
# winit; if a window ever fails to float, confirm with `hyprctl clients | grep class`.
windowrule = match:class ^(oculante)$, float true
windowrule = match:class ^(oculante)$, size 1400 900
windowrule = match:class ^(oculante)$, center true

# Remote machines: ws4 = Windows VDI (FreeRDP / Azure Virtual Desktop), ws5 = RustDesk / VNC
windowrule = match:class ^(com\.freerdp\.client\.sdl3)$, workspace 4

# Social / comms on workspace 8
windowrule = match:class ^(slack)$, workspace 8
windowrule = match:class ^(discord)$, workspace 8

# Unity - Hub on ws9, editor and EVERY window it spawns contained on ws3.
#
# The previous rule pair was dead for two independent reasons. A Unity 6 editor
# launched from the Hub carries the class `Unityhub-unity-editor-<version>`
# (verified 2026-08-28 against 6000.0.72f1), so `^(Unity)$` matched no window at
# all - editors reached ws3 only by being dragged there. And it carried
# `float false`, which excludes dialogs by construction, so progress bars,
# Package Manager, Build Settings and the license prompt opened on whatever
# workspace happened to be focused. The version is deliberately kept out of the
# pattern so a Unity upgrade cannot silently break this a second time.
#
# The editor itself is NOT silent, so launching a project from the Hub takes you
# to ws3; its popups are silent, so they land beside the editor without yanking
# you off the workspace you are on. If a Unity window ever escapes, read its real
# class with `hyprctl clients -j | grep -i class` and widen the pattern.
windowrule = match:class ^([Uu]nity[Hh]ub)$, workspace 9
windowrule = match:class ^([Uu]nity[Hh]ub-.*)$, match:float false, workspace 3
windowrule = match:class ^([Uu]nity[Hh]ub-.*)$, match:float true, workspace 3 silent
windowrule = match:class ^([Uu]nity)$, workspace 3 silent

# TigerVNC viewer — locked to workspace 5
windowrule = match:class ^(Vncviewer)$, workspace 5

# RustDesk grabs ALL keys via the Wayland keyboard-shortcuts-inhibit protocol
# (same mechanism Moonlight uses). Rather than a static per-window rule, this is
# now a runtime toggle via binds:disable_keybind_grabbing (default off = compositor
# control) — see keybindings.conf (Ctrl+Alt+Shift+G) and scripts/rustdesk-grab-toggle.sh.

# Android/Testing tools — locked to workspace 7
windowrule = match:class ^(scrcpy)$, workspace 6, group barred
windowrule = match:class ^(chromium|Chromium|chrome|Chrome|google-chrome|Google-chrome)$, match:title :.*Playwright.*, workspace 7, no_initial_focus true, suppress_event activate
windowrule = match:class ^(firefox-default)$, workspace 7, no_initial_focus true, suppress_event activate
windowrule = match:class ^([Ee]mulator(64)?(-arm)?|qemu-system)$, workspace 7, no_initial_focus true, suppress_event activate
