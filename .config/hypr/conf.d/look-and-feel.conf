#####################
### LOOK AND FEEL ###
#####################
# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    # Jackie Brown theme
    col.active_border = rgba(6495edee) rgba(deb887ee) 45deg
    col.inactive_border = rgba(1c1c1caa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = .9
    inactive_opacity = .8

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1c1c1cee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    # NOTE: dwindle:pseudotile was removed in Hyprland 0.55.x — there is no global
    # master switch anymore. Toggle pseudotiling per-window with the `pseudo` dispatcher
    # (see keybindings.conf). preserve_split is still valid.
    preserve_split = true # You probably want this
}

# https://wiki.hypr.land/Configuring/Variables/#group
# At stock settings a group is easy to miss: a 14px bar at font size 8 in a fixed
# 40%-alpha yellow (66ffff00) that follows no palette at all. Everything here exists
# to make "this tile is a stack, and there are N windows in it" readable at a glance,
# and to put the colours under theme-switch like every other surface.
group {
    # The four col.* values in this block are GENERATED by theme-switch from the
    # active palette, exactly like the borders in general{} above. Do not hand-edit
    # them - the next day/night switch overwrites them. See apply_hyprland() in
    # .local/src/theme/theme-switch.
    #
    # A grouped window gets the active gradient in REVERSE, so the border alone
    # says "stack" before you read the bar, while staying obviously the same theme.
    col.border_active = rgba(deb887ee) rgba(6495edee) 45deg
    col.border_inactive = rgba(1c1c1caa)

    groupbar {
        enabled = true
        render_titles = true

        # Tall enough to read, at the cost of ~24px off the top of the stack.
        height = 24
        indicator_height = 4
        font_size = 11
        # Keyword form, not numeric - 0.56.2 silently ignores `700` and leaves 400.
        font_weight_active = bold
        font_weight_inactive = normal

        # Active tab carries the theme's active gradient; inactive tabs recede to
        # the theme's inactive colour. Both generated - see the note at the top of
        # group{}. The two text colours are NOT generated and are deliberately
        # fixed: dark-on-bright and grey-on-dark read correctly against every
        # palette's active colour, from arthur's blue to batman's yellow.
        gradients = true
        col.active = rgba(6495edee) rgba(deb887ee) 45deg
        col.inactive = rgba(1c1c1caa)
        text_color = rgba(1c1c1cff)
        text_color_inactive = rgba(b0b0b0ff)

        # Tabs read as separate chips rather than one continuous strip.
        rounding = 6
        gradient_rounding = 6
        gaps_in = 3
        gaps_out = 4
    }
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # hyprpaper paints over this
    disable_hyprland_logo = false # hyprpaper paints over this
}
