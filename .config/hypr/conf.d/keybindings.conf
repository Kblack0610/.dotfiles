###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Default: ignore apps' keyboard-shortcuts-inhibit grab (RustDesk/Moonlight-style),
# so the compositor keeps control. Ctrl+Alt+Shift+G toggles it to FULL passthrough
# (all keys → remote Mac); Ctrl+Alt+Shift+Esc always steps out (bindp). See below.
binds {
    disable_keybind_grabbing = true
}

bindd = ,F7, screenshot an area, exec, grimblast copysave area $HOME"/Media/Pictures/"$(date +'%F-%T.png'); hyprctl dispatch submap reset

# Applications
bindd = $mainMod, C, Firefox, exec, firefox

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bindd = $mainMod, RETURN, terminal, exec, $terminal
bindd = $mainMod, Q, close the window, killactive,
bindd = $mainMod, E, screenshots folder, exec, $fileManager ~/Media/Pictures # screenshots
# Open the MOST RECENT screenshot in oculante - the common case straight after F7,
# without going via thunar (which used to hand images to chromium). oculante does
# nearest-neighbour at 100% by default, so screenshots stay pixel-sharp.
bindd = $mainMod, I, newest screenshot, exec, sh -c 'f=$(ls -t "$HOME"/Media/Pictures/* 2>/dev/null | head -1); [ -n "$f" ] && oculante "$f"'

### PERSISTENT FLOATING / PIP ###
bindd = $mainMod SHIFT, P, picture-in-picture top right, togglefloating,
# 2. Resize to specific dimensions (Width Height)
bind = $mainMod SHIFT, P, resizeactive, exact 640 360 
# 3. Move to the right edge
bind = $mainMod SHIFT, P, movewindow, r
# 4. Move to the upper edge
bind = $mainMod SHIFT, P, movewindow, u
# 5. Pin floating window to all workspaces (toggle)
bind = $mainMod SHIFT, P, pin

### PERSISTENT FLOATING / PIP ###
bindd = $mainMod SHIFT, O, picture-in-picture top left, togglefloating,
# 2. Resize to specific dimensions (Width Height)
bind = $mainMod SHIFT, O, resizeactive, exact 640 360 
# 3. Move to the right edge
bind = $mainMod SHIFT, O, movewindow, l
# 4. Move to the upper edge
bind = $mainMod SHIFT, O, movewindow, u
# 5. Pin floating window to all workspaces (toggle)
bind = $mainMod SHIFT, O, pin


# Mini pin: toggle the floating overlay status bar (fleet + agents + actions).
# Super+Shift+M show/hide; the on-bar chevron swaps min<->big (Super+Shift+, also).
bindd = $mainMod SHIFT, M, show or hide the pin bar, exec, ~/.config/waybar/pin.sh toggle
bindd = $mainMod SHIFT, comma, pin bar small or big, exec, ~/.config/waybar/pin.sh size

# Notifications (dunst): critical ones (agent asks, Sentinel trips) stay until
# dismissed, so dismissing has to be a key, not a mouse trip.
bindd = $mainMod, N, close the newest notification, exec, dunstctl close
bindd = $mainMod SHIFT, N, close every notification, exec, dunstctl close-all
bindd = $mainMod CTRL, N, notification history, exec, dunstctl history-pop
bindd = $mainMod ALT, N, pause or resume notifications, exec, dunstctl set-paused toggle

bindd = $mainMod, D, app launcher, exec, $menu
# Super+B: fuzzy-search Karakeep bookmarks by title, tag or domain, Enter opens the link.
bindd = $mainMod, B, karakeep bookmarks, exec, ~/.local/bin/karakeep-menu
# Super+K: fuzzy-pick a home-lab site, Enter opens it (or lands in its open tab).
bindd = $mainMod, K, kblab sites, exec, ~/.local/bin/kblab-menu
bindd = $mainMod, P, display mode, exec, ~/.config/hypr/scripts/display-mode.sh
# Monitor on/off toggle removed 2026-06-29 — DisplayPort re-handshake + the
# monitor=,preferred,auto,1 catch-all made `disable` unreliable. Using a
# physical switch instead. See docs/monitor-toggle-notes.md.

# Pseudotile the active window. dwindle:pseudotile was removed in 0.55.x, so this
# per-window dispatcher is the only way in. It lives on SUPER ALT, not SUPER G:
# it shared G with group-all until 2026-09-15, and Hyprland fires EVERY bind that
# matches a combo, so each group-all press was also silently pseudotiling whatever
# window happened to be focused. You only saw it after ungrouping, as windows that
# no longer filled their tile.
bindd = $mainMod ALT, P, pseudotile the window, pseudo
bindd = $mainMod, W, flip the split direction, layoutmsg, togglesplit # dwindle (togglesplit is now a layoutmsg, not a global dispatcher)
bindd = $mainMod, F, fullscreen, fullscreen

# Voice (.config/hypr/docs/voice.md). R: stream, words typed into the focused window as you talk.
bindd = $mainMod, R, voice typing, exec, ~/.local/bin/gungan stream
bindd = $mainMod SHIFT, R, record and transcribe, exec, ~/.local/bin/gungan --type record
bindd = $mainMod ALT, R, voice to a Claude session, exec, ~/.local/bin/agent-voice
bindd = $mainMod CTRL, R, stop recording, exec, ~/.config/hypr/scripts/gungan-force-stop.sh

### GROUPS (tabbed window stacks) ###
# One combo per action. Nothing here shares a combo with anything else - a
# duplicate does not override, it ADDS, and both dispatchers run on every press.

# This window: into/out of a stack
bindd = $mainMod, T, stack this window into tabs or unstack it, togglegroup
bindd = $mainMod SHIFT, T, take this window out of its stack, moveoutofgroup, f

# Whole workspace: stack everything / unstack everything
bindd = $mainMod, G, stack every window on the workspace, exec, ~/.config/hypr/scripts/group-all.sh
bindd = $mainMod ALT, G, unstack every window on the workspace, exec, ~/.config/hypr/scripts/ungroup-all.sh

# Merge this window into the stack next to it (direction depends on layout
# state, so try all four - three no-op silently, one fires)
bindd = $mainMod SHIFT, G, merge into the stack next to it, exec, hyprctl --batch "dispatch moveintogroup l; dispatch moveintogroup r; dispatch moveintogroup u; dispatch moveintogroup d"

# Cycle tabs within the stack
bindd = $mainMod SHIFT, H, previous tab in the stack, changegroupactive, b
bindd = $mainMod SHIFT, L, next tab in the stack, changegroupactive, f


# Move focus with mainMod + arrow keys
bindd = $mainMod, h, focus left, movefocus, l
bindd = $mainMod, l, focus right, movefocus, r
bindd = $mainMod, k, focus up, movefocus, u
bindd = $mainMod, j, focus down, movefocus, d

# Move the active tile (swaps or re-splits with its neighbour)
bindd = $mainMod CTRL, h, move the window left, movewindow, l
bindd = $mainMod CTRL, l, move the window right, movewindow, r
bindd = $mainMod CTRL, k, move the window up, movewindow, u
bindd = $mainMod CTRL, j, move the window down, movewindow, d

# Resize the active tile (hold to repeat)
binded = $mainMod ALT, h, narrower, resizeactive, -40 0
binded = $mainMod ALT, l, wider, resizeactive, 40 0
binded = $mainMod ALT, k, shorter, resizeactive, 0 -40
binded = $mainMod ALT, j, taller, resizeactive, 0 40

# Switch workspaces with mainMod + [0-9]
bindd = $mainMod, 1, workspace 1, workspace, 1
bindd = $mainMod, 2, workspace 2, workspace, 2
bindd = $mainMod, 3, workspace 3, workspace, 3
bindd = $mainMod, 4, workspace 4, workspace, 4
bindd = $mainMod, 5, workspace 5, workspace, 5
bindd = $mainMod, 6, workspace 6, workspace, 6
bindd = $mainMod, 7, workspace 7, workspace, 7
bindd = $mainMod, 8, workspace 8, workspace, 8
bindd = $mainMod, 9, workspace 9, workspace, 9
bindd = $mainMod, 0, workspace 10, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bindd = $mainMod SHIFT, 1, send the window to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, send the window to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, send the window to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, send the window to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, send the window to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, send the window to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, send the window to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, send the window to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, send the window to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, send the window to workspace 10, movetoworkspace, 10

# Example special workspace (scratchpad)
bindd = $mainMod, S, show or hide the scratchpad, togglespecialworkspace, magic
bindd = $mainMod SHIFT, S, send the window to the scratchpad, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bindd = $mainMod, mouse_down, next workspace, workspace, e+1
bindd = $mainMod, mouse_up, previous workspace, workspace, e-1

# RustDesk / remote-session escape hatch (Moonlight-style ungrab).
# `bindp` = dontInhibit flag: this bind fires even if an app holds the Wayland
# keyboard-shortcuts-inhibit grab, so it can never be trapped. One-way: reclaims
# local keyboard focus from RustDesk by jumping to your last real window; no-op
# when RustDesk isn't focused, so it never pulls you back in.
# (Inside RustDesk, Ctrl+Alt+Shift+M releases relative/pointer-lock mouse mode.)
bindpd = CTRL ALT SHIFT, Escape, escape from RustDesk, exec, ~/.config/hypr/scripts/rustdesk-escape.sh

# Toggle full keyboard passthrough to the remote (RustDesk grab on/off). Also `bindp`
# so it works in BOTH modes — you can always flip back out of full-passthrough.
bindpd = CTRL ALT SHIFT, G, full keyboard passthrough to RustDesk on or off, exec, ~/.config/hypr/scripts/rustdesk-grab-toggle.sh

# The bar over a fullscreen window: flip the focused window between true fullscreen and
# fullscreen under the bar (maximized for Hyprland, so the window ends below waybar; still
# fullscreen for the app). `bindp` so it works while RustDesk grabs the keyboard.
bindpd = CTRL ALT SHIFT, B, fullscreen under the bar or over it, exec, ~/.config/hypr/scripts/fullscreen-bar.sh

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = $mainMod, mouse:272, drag to move the window, movewindow
bindmd = $mainMod, mouse:273, drag to resize the window, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindeld = ,XF86AudioRaiseVolume, volume up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = ,XF86AudioLowerVolume, volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindeld = ,XF86AudioMute, mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindeld = ,XF86AudioMicMute, mute the mic, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindeld = ,XF86MonBrightnessUp, brightness up, exec, brightnessctl -e4 -n2 set 5%+
bindeld = ,XF86MonBrightnessDown, brightness down, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindld = , XF86AudioNext, next track, exec, playerctl next
bindld = , XF86AudioPause, play or pause, exec, playerctl play-pause
bindld = , XF86AudioPlay, play or pause, exec, playerctl play-pause
bindld = , XF86AudioPrev, previous track, exec, playerctl previous

# Toggle laptop keyboard (for use with external keyboard)
bindd = $mainMod SHIFT, K, laptop keyboard on or off, exec, ~/.config/hypr/scripts/toggle-laptop-keyboard.sh toggle

# Farm-hold toggle (AFK-farm a RawInput game like Palworld on the other monitor).
# Press = hold LEFT mouse down via ydotool (real uinput device); press again = release.
# Goes to the focused window, so keep the game focused. Needs ydotoold running.
bindd = $mainMod SHIFT, F, hold the left mouse button or let go, exec, ~/.config/hypr/scripts/bg-autoclicker.sh

# VDI passthrough submap — Super+` enters, Super+Escape exits.
# Inside the submap every Hyprland bind is dead so all keys (Super+W, Super+T,
# etc.) flow to the focused window. Convention matches VMware/Citrix.
# RTMIN+11 re-reads waybar's custom/passthrough indicator (waybar/passthrough.sh).
bindd = $mainMod, grave, VDI passthrough on, submap, passthru
bind = $mainMod, grave, exec, notify-send -t 2000 "Hyprland" "VDI passthrough ON — Super+Esc to exit"; pkill -RTMIN+11 waybar
submap = passthru
bindd = $mainMod, Escape, VDI passthrough off, submap, reset
bind = $mainMod, Escape, exec, notify-send -t 2000 "Hyprland" "VDI passthrough OFF"; pkill -RTMIN+11 waybar
submap = reset
