####################
### PIN LEADER   ###
####################
# tmux-style prefix menu for the mini pin (see ~/.config/waybar/PIN.md).
# Super+; opens a which-key popup; single keys fire actions; submaps nest 3 deep.
#   L1 pinbar -> L2 pinbar-utils -> L3 pinbar-sync / pinbar-git
# esc = up one level, q = exit. $mainMod comes from keybindings.conf (sourced first).
# A bind's description (bindd/bindpd) is its entry in the pin-hint.sh popup and its row in
# control-menu; no commas in one. A leaf describes its action line, a submap entry its submap line.
#
# Swap the leader key: comment the semicolon pair below, uncomment one alt pair.
# bind = $mainMod, semicolon, exec, ~/.config/waybar/pin-hint.sh main
# bind = $mainMod, semicolon, submap, pinbar
# bind = $mainMod, space, exec, ~/.config/waybar/pin-hint.sh main
# bind = $mainMod, space, submap, pinbar
bind = $mainMod, A, exec, ~/.config/waybar/pin-hint.sh main
bindd = $mainMod, A, pin leader, submap, pinbar

# --- Remote-friendly entry (RustDesk / driving this box from outside) ---
# The Super/Meta key is usually NOT forwarded by remote-desktop clients, so the
# Super+A bind above is dead when you control this machine remotely. This uses
# Ctrl+Shift (forwards cleanly, fast to hit) and is `bindp` (dontInhibit) so it
# fires even in GRAB ON / full-passthrough mode; leader `t` toggles the pin.
# Note: global, so it shadows Ctrl+Shift+A in every app (terminals included).
# Ctrl+Shift+M is deliberately left alone - it is Firefox's responsive design mode.
bindp = CTRL SHIFT, A, exec, ~/.config/waybar/pin-hint.sh main  # leader menu
bindpd = CTRL SHIFT, A, pin leader, submap, pinbar

# --- L1: pinbar (control menu, toggle, keys, agents, utils, settings) ---
# `a` opens the agent panel from here, one key, because the only other path was
# u -> a, and s -> a (one submenu over) silently HIDES the agents module instead.
submap = pinbar
# Space: the control menu, every chip's hover from the keyboard (~/.local/bin/control-menu).
bindpd = ,space, control menu, exec, kitty --class control-menu -e $HOME/.local/bin/control-menu
bindp = ,space, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,space, submap, reset
bindpd = ,a, agent panel, exec, kitty --class floating-term -e $HOME/.local/bin/agent-panel
bindp = ,a, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,a, submap, reset
bindpd = ,t, toggle the pin bar, exec, ~/.config/waybar/pin.sh toggle
bindp = ,t, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,t, submap, reset
# k: every live key (Hyprland, tmux, nvim) in one searchable list, read from the binds.
bindpd = ,k, keys sheet, exec, kitty --class keys -e $HOME/.local/bin/keys
bindp = ,k, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,k, submap, reset
# n o h act on agent pages (agent-notify): n picks one, o goes where the newest points
# (its ref), h opens a Haiku session on it. Super+N stays dunst's.
bindpd = ,n, pick a page, exec, kitty --class floating-term -e $HOME/.local/bin/agent-notify pick
bindp = ,n, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,n, submap, reset
bindpd = ,o, open the newest page, exec, kitty --class floating-term -e $HOME/.local/bin/agent-notify open
bindp = ,o, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,o, submap, reset
bindpd = ,h, triage the newest page, exec, kitty --class floating-term -e $HOME/.local/bin/agent-notify triage
bindp = ,h, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,h, submap, reset
bindp = ,u, exec, ~/.config/waybar/pin-hint.sh utils
bindpd = ,u, utils >, submap, pinbar-utils
bindp = ,s, exec, ~/.config/waybar/pin-hint.sh settings
bindpd = ,s, settings >, submap, pinbar-settings
bindp = ,escape, exec, ~/.config/waybar/pin-hint.sh close
bindpd = ,escape, exit, submap, reset
bindp = ,q, exec, ~/.config/waybar/pin-hint.sh close
bindpd = ,q, exit, submap, reset

# --- L2: pinbar-utils (agents, ssh, reload, + nested timebox/sync/git) ---
submap = pinbar-utils
bindpd = ,a, agent panel, exec, kitty --class floating-term -e $HOME/.local/bin/agent-panel
bindp = ,a, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,a, submap, reset
bindpd = ,h, ssh into a host, exec, kitty --class floating-term -e $HOME/.config/waybar/machines.sh pick
bindp = ,h, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,h, submap, reset
bindpd = ,r, reload the pin, exec, ~/.config/waybar/pin.sh reload
bindp = ,r, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,r, submap, reset
bindp = ,t, exec, ~/.config/waybar/pin-hint.sh timebox
bindpd = ,t, timebox >, submap, pinbar-timebox
bindp = ,y, exec, ~/.config/waybar/pin-hint.sh sync
bindpd = ,y, sync >, submap, pinbar-sync
bindp = ,g, exec, ~/.config/waybar/pin-hint.sh git
bindpd = ,g, git >, submap, pinbar-git
bindp = ,escape, exec, ~/.config/waybar/pin-hint.sh main
bindpd = ,escape, back, submap, pinbar
bindp = ,q, exec, ~/.config/waybar/pin-hint.sh close
bindpd = ,q, exit, submap, reset

# --- L2: pinbar-settings (module toggles + pin size) ---
# a/f/t/m hide or show a module on both bars at once, with no restart; l opens
# the full picker. Keys come from ~/.config/waybar/modules.registry - add a row
# there and a described leaf here (the description is pin-hint.sh's legend entry).
submap = pinbar-settings
bindpd = ,a, hide/show agents, exec, ~/.config/waybar/modules.sh toggle agents
bindp = ,a, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,a, submap, reset
bindpd = ,f, hide/show fleet, exec, ~/.config/waybar/modules.sh toggle fleet
bindp = ,f, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,f, submap, reset
bindpd = ,t, hide/show timebox, exec, ~/.config/waybar/modules.sh toggle timebox
bindp = ,t, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,t, submap, reset
bindpd = ,m, hide/show machines, exec, ~/.config/waybar/modules.sh toggle machines
bindp = ,m, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,m, submap, reset
bindpd = ,l, module list, exec, kitty --class floating-term -e ~/.config/waybar/modules.sh menu
bindp = ,l, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,l, submap, reset
bindpd = ,s, pin size, exec, ~/.config/waybar/pin.sh size
bindp = ,s, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,s, submap, reset
bindp = ,escape, exec, ~/.config/waybar/pin-hint.sh main
bindpd = ,escape, back, submap, pinbar
bindp = ,q, exec, ~/.config/waybar/pin-hint.sh close
bindpd = ,q, exit, submap, reset

# --- L3: pinbar-timebox ---
submap = pinbar-timebox
bindpd = ,s, start an op, exec, kitty --class floating-term -e sh -c 'printf "start op: " ; read -r op ; [ -n "$op" ] || exit ; printf "lap [e.g. 25m, blank=default]: " ; read -r lap ; if [ -n "$lap" ] ; then $HOME/.local/bin/timebox start "$op" --lap "$lap" ; else $HOME/.local/bin/timebox start "$op" ; fi'
bindp = ,s, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,s, submap, reset
bindpd = ,w, switch op, exec, kitty --class floating-term -e sh -c 'printf "switch to op: " ; read -r op ; [ -n "$op" ] || exit ; printf "lap [e.g. 25m, blank=default]: " ; read -r lap ; if [ -n "$lap" ] ; then $HOME/.local/bin/timebox switch "$op" --lap "$lap" ; else $HOME/.local/bin/timebox switch "$op" ; fi'
bindp = ,w, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,w, submap, reset
bindpd = ,p, pause, exec, $HOME/.local/bin/timebox pause
bindp = ,p, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,p, submap, reset
bindpd = ,r, resume, exec, $HOME/.local/bin/timebox resume
bindp = ,r, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,r, submap, reset
bindpd = ,x, stop all, exec, $HOME/.local/bin/timebox stop --all
bindp = ,x, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,x, submap, reset
bindpd = ,o, status and stats, exec, kitty --class floating-term -e sh -c '$HOME/.local/bin/timebox status ; echo ; $HOME/.local/bin/timebox stats ; echo ; read -r _'
bindp = ,o, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,o, submap, reset
bindp = ,escape, exec, ~/.config/waybar/pin-hint.sh utils
bindpd = ,escape, back, submap, pinbar-utils
bindp = ,q, exec, ~/.config/waybar/pin-hint.sh close
bindpd = ,q, exit, submap, reset

# --- L3: pinbar-sync ---
submap = pinbar-sync
bindpd = ,d, restow dotfiles, exec, kitty --class floating-term -e sh -c 'cd $HOME/.dotfiles && stow -v . ; echo ; echo [done] ; read -r _'
bindp = ,d, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,d, submap, reset
bindpd = ,n, pull notes, exec, kitty --class floating-term -e sh -c 'git -C $HOME/.notes pull --ff-only ; echo ; read -r _'
bindp = ,n, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,n, submap, reset
bindp = ,escape, exec, ~/.config/waybar/pin-hint.sh utils
bindpd = ,escape, back, submap, pinbar-utils
bindp = ,q, exec, ~/.config/waybar/pin-hint.sh close
bindpd = ,q, exit, submap, reset

# --- L3: pinbar-git ---
submap = pinbar-git
bindpd = ,p, pull dotfiles and notes, exec, kitty --class floating-term -e sh -c 'for d in $HOME/.dotfiles $HOME/.notes ; do echo "== $d ==" ; git -C "$d" pull --ff-only ; done ; echo ; read -r _'
bindp = ,p, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,p, submap, reset
bindpd = ,s, dotfiles git status, exec, kitty --class floating-term -e sh -c 'git -C $HOME/.dotfiles status ; echo ; read -r _'
bindp = ,s, exec, ~/.config/waybar/pin-hint.sh close
bindp = ,s, submap, reset
bindp = ,escape, exec, ~/.config/waybar/pin-hint.sh utils
bindpd = ,escape, back, submap, pinbar-utils
bindp = ,q, exec, ~/.config/waybar/pin-hint.sh close
bindpd = ,q, exit, submap, reset

submap = reset
