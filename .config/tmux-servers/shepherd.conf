# shepherd - the fleet lead's passes (fleet-shepherd), a world of its own: its own tmux server,
# so nothing a pass does to its windows (new-window, rename-window, kill-pane, send-keys,
# display-message), and no crash of that server, reaches the human's hub sessions. On 2026-11-04
# at 21:55 closing a duplicate pass window in hub took hub down with 2 dotfiles sessions in it.
# Nothing else (dispatch, asks, the human's sessions) needs this world up; a run boots it.
#
# Format: hub.conf. One session, which is also the landing one (`tmx hop shepherd`). Its shell
# window keeps the session alive while passes swap. ~/.dotfiles is named by hub.conf first, and
# the manifests are read in glob order, so Prefix+f on ~/.dotfiles still lands in hub.

shepherd     ~/.dotfiles
