# lab — the build world: what I am making, and the codebase I make it in.
#
# Format: <name> <dir> [startup command...]. See hub.conf for the contract.
#
# THE FIRST ENTRY IS THE LANDING SESSION, and it is named after the world — the
# same shape as hub, whose landing session `hub` opens today's daily. Here `lab`
# opens the projects index.

lab       ~/.notes/lab           nvim ~/.notes/lab/projects/index.md

# On demand (`?`): never booted with the world, but it OWNS the directory, so Prefix+f and
# Prefix+F (wt new) put the playground and every one of its agent worktrees here from
# whichever world the key is pressed in. Without it the repo routed `here`, and a press from
# hub built agent sessions on hub's socket.
?unity-core-playground ~/dev/bnb/games/engine/unity-core-playground
