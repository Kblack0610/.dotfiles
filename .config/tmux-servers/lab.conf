# lab - the dispatch world: only sessions fleet-dispatch starts.
#
# Format: <name> <dir> [startup command...]. See hub.conf for the contract.
#
# NO LANDING SESSION and no repo: every session here is a dispatched worktree, so `tmx root lab`
# resumes the dispatched session you were last in. A worktree the human starts (Prefix+F, wt new)
# lands on its repo's world, not here.

# The world fleet-dispatch starts its sessions in (`tmux-world agents`). Not a routing rule.
@agents
