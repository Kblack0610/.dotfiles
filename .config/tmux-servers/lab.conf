# lab - the build world: every agent worktree and the codebases they work in.
#
# Format: <name> <dir> [startup command...]. See hub.conf for the contract.
#
# NO LANDING SESSION. Every entry here is on demand, so `tmx root lab` and Prefix+C-h both
# resume the agent session you were last in.

# On demand (`?`): never booted with the world, but it OWNS the directory, so every opener
# puts the playground here from whichever world it runs in.
?unity-core-playground ~/dev/bnb/games/engine/unity-core-playground
?platform              ~/dev/bnb/platform

# Every agent worktree of every project, whoever started it, and every game checkout.
@agents
@repos ~/dev/bnb/games
