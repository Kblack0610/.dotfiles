# hub — the personal world: today's notes + the configs that make this machine mine.
#
# Format: <name> <dir> [startup command...]
#         <session>:<window> <dir> [command...]  adds a named window to a session above
#         ?<name> <dir> [startup command...]  ON DEMAND: not booted, and closing it sticks.
#           Still declared, so every opener routes its dir here; Prefix+f, `tmx goto hub <name>`
#           or Prefix+S start it. Never put `?` on the landing entry.
#         @agents        every linked-worktree session lands in this world
#         @repos [dir]   checkouts no entry declares land here; a dir scopes it, deepest wins
#         Which world gets what, and how to add a repo: README.md here.
# The command is sent as keystrokes after the session is created, so quitting it
# drops you into a normal shell rather than killing the session.
#
# THE FIRST ENTRY IS THE LANDING SESSION — `tmx hop hub` attaches straight to it.
# So hopping to hub puts you in today's daily note, not a bare shell.
#
# Read by `tmx ensure hub` (.local/src/tmux/servers.sh), which creates only the
# sessions that are MISSING, keyed on name — the boot path and the repair path.
# These live on the `hub` socket, so Prefix+w here can only ever show this list.

hub          ~/.notes                 ensure_daily_note && nvim "$(notes path)"
?dotfiles    ~/.dotfiles
# hub:shepherd, the fleet lead's pass window, is owned by `fleet-shepherd run`, not this file:
# declared here, tmx ensure would give it a shell or a second pass. Do not add it.
?home-config ~/dev/home/home-config
# board is the hub app (.local/src/hub-tui): home, queue, jobs, CI, machines, fleet sessions,
# forecast, today and history as tabs of one window. Prefix i asks it for the Home tab (`hub tab home`) and
# go to it. Its producers are systemd timers (fleet-state.timer, day-log.timer), so nothing
# needs this window open for a log to build. Rooted at home-config, the homelab repo whose
# recording rules the board reads, so it only opens on the main PC. exec, so quitting it closes
# the window: tmux shows the window before it, and the next Prefix key rebuilds the board.
hub:board    ~/dev/home/home-config   exec ~/.local/bin/hub

# Any repo nothing else claims is a home or config repo until a manifest says otherwise.
@repos
