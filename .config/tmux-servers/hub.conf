# hub — the personal world: today's notes + the configs that make this machine mine.
#
# Format: <name> <dir> [startup command...]
#         <session>:<window> <dir> [command...]  adds a named window to a session above
#         ?<name> <dir> [startup command...]  ON DEMAND: not booted, and closing it sticks.
#           Still declared, so Prefix+f routes its dir here; Prefix+f, `tmx goto hub <name>`
#           or Prefix+S (sesh/hub.toml) start it. Never put `?` on the landing entry.
# The command is sent as keystrokes after the session is created, so quitting it
# drops you into a normal shell rather than killing the session.
#
# THE FIRST ENTRY IS THE LANDING SESSION — `tmx hop hub` attaches straight to it.
# So hopping to hub puts you in today's daily note, not a bare shell.
#
# Read by `tmx ensure hub` (.local/src/tmux/servers.sh), which creates only the
# sessions that are MISSING, keyed on name — the boot path and the repair path.
# These live on the `hub` socket, so Prefix+w here can only ever show this list.

hub          ~/.notes                 ensure_daily_note && nvim "$(notes path)"
dotfiles     ~/.dotfiles
?home-config ~/dev/home/home-config
# infra is rooted at home-config, the homelab repo whose recording rules the board reads,
# so it only opens on the main PC. Not ~/.config/command-center: its env is stowed from
# the private overlay, so that dir exists on every machine.
hub:infra    ~/dev/home/home-config   ~/.local/src/tmux/command-center.sh
# watch is the per-session stage board (fleet-sessions watch). A window rather than a popup
# because its transition log only builds while it runs; Prefix+o goes here from any world.
hub:watch    ~/.dotfiles              fleet-sessions watch
