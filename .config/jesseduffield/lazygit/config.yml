# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
#Default path for the global config file:

#    Linux: ~/.config/lazygit/config.yml
#    MacOS: ~/Library/Application\ Support/lazygit/config.yml
#    OR MacOS: export XDG_CONFIG_HOME="$HOME/.config"
#    Windows: %LOCALAPPDATA%\lazygit\config.yml (default location, but it will also be found in %APPDATA%\lazygit\config.yml

gui:
  scrollHeight: 25
  sidePanelWidth: .25
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#f3fd21"
      - "bold"
    inactiveBorderColor:
      - "#505354"
    searchingActiveBorderColor:
      - "#fff68d"
      - "bold"
    optionsTextColor:
      - "#a2a2a5"
    selectedLineBgColor:
      - "#2a2c2d"
    cherryPickedCommitFgColor:
      - "#1b1d1e"
    cherryPickedCommitBgColor:
      - "#f3fd21"
    markedBaseCommitFgColor:
      - "#1b1d1e"
    markedBaseCommitBgColor:
      - "#feed6c"
    unstagedChangesColor:
      - "#ff5555"
    defaultFgColor:
      - "#c5c5be"
os:
  editCommand: 'nvim'
  openCommand: 'kitty nvim .'
customCommands:
  # Create worktree and open new terminal there
  - key: 'W'
    context: 'localBranches'
    description: 'Create worktree from branch and open terminal there'
    prompts:
      - type: 'input'
        title: 'Worktree path:'
        key: 'Path'
        initialValue: '../{{.SelectedLocalBranch.Name}}'
    command: 'git worktree add "{{.Form.Path}}" "{{.SelectedLocalBranch.Name}}" && kitty --detach --directory "$(realpath {{.Form.Path}})"'
  # Create worktree and switch lazygit to it (replaces current session)
  - key: '<c-w>'
    context: 'localBranches'
    description: 'Create worktree and switch to it (replaces lazygit)'
    prompts:
      - type: 'input'
        title: 'Worktree path:'
        key: 'Path'
        initialValue: '../{{.SelectedLocalBranch.Name}}'
    command: 'git worktree add "{{.Form.Path}}" "{{.SelectedLocalBranch.Name}}" && cd "{{.Form.Path}}" && lazygit'
    output: terminal
  # Review the working tree in hunk (multi-file review stream, agent annotations).
  # X = eXamine; h/H/l/L are all taken by lazygit's block-nav and scroll bindings.
  - key: 'X'
    context: 'files'
    description: 'Review working tree in hunk'
    command: 'hunk diff --watch'
    output: terminal
  # Review a single commit in hunk.
  - key: 'X'
    context: 'commits, subCommits, reflogCommits'
    description: 'Review this commit in hunk'
    command: 'hunk show {{.SelectedCommit.Hash}}'
    output: terminal
