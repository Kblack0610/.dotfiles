# The numbers behind claude-acct's room verdict, read by claude-acct only (KEY=value, one per line).
# The verdict is the `room` object of each usage row; dispatch, the shepherd, the watches and the
# dashboards read it and keep no copy of these numbers. The machine-mode level scales the first two
# for automatic starts (.config/machine-mode/levels); this file is the mid baseline.
#
# PACE_SLACK_PCT   points an account may sit past its weekly pace line and still take an automatic start
# RESERVE_PCT      the last of each account's week and 5h window, kept for the human's own work
# SESSION_RATE     points of its week one live session uses an hour, when Prometheus cannot say:
#                  0.06 to 0.08 on every account over 2026-11-01..04
PACE_SLACK_PCT=5
RESERVE_PCT=15
SESSION_RATE=0.07
