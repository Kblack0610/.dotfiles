# The numbers behind claude-acct's room verdict and the wake budget, read only through pace_get
# (.local/lib/pace-conf.sh), which lays pace-conf's overrides over them (KEY=value, one per line).
# The verdict is the `room` object of each usage row; dispatch, the shepherd, the watches and the
# dashboards read it and keep no copy of these numbers. The machine-mode level scales the first two
# for automatic starts (.config/machine-mode/levels); this file is the mid baseline.
#
# PACE_SLACK_PCT   points an account may sit past its weekly pace line and still take an automatic start
# RESERVE_PCT      the last of each account's week and 5h window, kept for the human's own work
#                  (provisional, 2026-11-10: 10, the human's ask with four accounts pooled; revisit
#                  when source-pace trips on the pool or the human's own cl hits it)
# SESSION_RATE     points of its week one running queue item of a source (codex and the other non-Claude
#                  ones) uses an hour, when Prometheus has no history for it: 0.06 to 0.08 on every
#                  account over 2026-11-01..04
# CLAUDE_SESSION_RATE  the same for one working Claude session, when Prometheus cannot say. Provisional,
#                  2026-11-20 (ar-1018), low confidence: the 24h rate read 0.107 per session working by
#                  status alone (19 of them); 8 of those 19 had changed status in the last ACTIVE_MIN, so
#                  the same burn per active session is 0.107 x 19 / 8 = 0.25. For 6h after ACTIVE_MIN
#                  ships the measured rate still divides by old-definition sessions and reads low.
#                  Revisit once 24h of the new series exist: replace it with session_rate's 24h figure
# ACTIVE_MIN       minutes since a session's status last changed (statusUpdatedAt in its registry file)
#                  for it to count as working: past it the claude is live but spends nothing, as an idle
#                  one does (ar-1018: a LANDED or CHAT claude left on "shell" for hours held its account's
#                  committed check). Status flips busy/shell with each tool call, so a long turn stays
#                  inside it. Provisional, 2026-11-20: 20 left 8 of 19 non-idle sessions working, 10 left
#                  6, 30 left 11; revisit when `fleet: N working` moves against the measured 6h burn
# MODEL_WEIGHT_SONNET, MODEL_WEIGHT_HAIKU  what an hour of a session on that model spends against an
#                  hour of Opus (1, as is a session with no --model): burn, the 6h rate and dispatch's
#                  pace target count Opus-equivalents by them (ar-3230). Provisional, 2026-11-18: list
#                  price over the week's token mix read Sonnet 5.5 at 0.58 of Opus 5.5; Haiku 5.5 had
#                  too few session tokens to read, so it is its list ratio. Revisit when the 6h rate
#                  per Opus-equivalent moves as the model mix does.
# BURN_OVER_PCT    percent past the burn an account's week sustains that its working sessions may run before
#                  room calls it committed; dispatch's spare reads the same allowance. 0 keeps each week to its reset.
#                  2026-11-23, the human's ask: 200, so dispatch starts work while the fleet burns 5.1/h against
#                  2.1/h sustainable; the pool then runs out before the resets. Back to 0 when the board is caught up.
#                  Raised to 400 the same day (ask 2pUZEl): at 8.8/h, 200 still refused every account; the pool
#                  reaches its reserve around 2026-11-24 13:44 at that burn.
#                  This line is the default: `pace-conf set BURN_OVER_PCT <pct> [--until <time>]` lays a standing
#                  override or a window over it with no PR (.local/src/docs/pace-conf.md).
# <KEY>_MAX        makes KEY editable with `pace-conf set`, from 0 to this; a key with no _MAX line is not.
#                  BURN_OVER_PCT_MAX is the first (2026-11-23, the human's ask: set the allowance for a time, not by PR)
# PACE_WINDOW_MAX_DAYS  the longest window `pace-conf set --until` takes, so a forgotten one ends by itself
# UNDERUSE_HOURS   check underuse looks at a paced source only this close to its weekly reset
# UNDERUSE_GAP_PCT points of use under the week gone that it calls under-used (both provisional,
#                  2026-11-09: Codex at 6% used of 7% gone; revisit after four Codex weeks of the watch)
# TOKEN_WARN_DAYS  check tokens trips this many days before a setup token expires (they last about a year; 30 days is time to renew in person)
PACE_SLACK_PCT=5
RESERVE_PCT=10
SESSION_RATE=0.07
CLAUDE_SESSION_RATE=0.25
ACTIVE_MIN=20
MODEL_WEIGHT_SONNET=0.6
MODEL_WEIGHT_HAIKU=0.2
BURN_OVER_PCT=400
BURN_OVER_PCT_MAX=1000
PACE_WINDOW_MAX_DAYS=7
UNDERUSE_HOURS=48
UNDERUSE_GAP_PCT=25
TOKEN_WARN_DAYS=30

# WAKE_BUDGET             the bulk-wake budget (wake-pace.sh), wakes per settle window across
#                         restore, unpark of preempted sessions and `claude-acct unpark --all`;
#                         fleet-pace's GO batch (7 at once took load 28.8 to 69 on 24 cores, 2026-10-26)
# WAKE_SETTLE_MIN         minutes a bulk wake counts against WAKE_BUDGET: its load is not in the
#                         1-minute average yet (DISPATCH_START_LOAD_MIN, measured 2026-11-07)
WAKE_BUDGET=3
WAKE_SETTLE_MIN=5
