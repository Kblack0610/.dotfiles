# Prompts the fleet types into a Claude session as if the human had. The transcript records each
# as a human turn (turnOrigin human), so its text is the only tell. Each line is `<kind> <text>`:
# `task` is a new request typed for the session, `resume` only tells a session that stopped to
# carry on, so it opens no new turn (an ask card's prompt is the one before it). A prompt is
# fleet-typed when any of its lines, leading whitespace aside, starts with a <text> below followed
# by whitespace or the end of the line. Only a line that starts with one counts, so the human quoting
# one mid-sentence is still the human, and "/wind-downs" is not "/wind-down".
#
# Readers: agent-panel human_typed (presence; compiled in, so a change here needs the rebuild
# dotfiles-autopull runs), agent-ask settle-session through .local/lib/typed-prefixes.sh (a
# fleet-typed prompt answers no ask), claude-recall fleet_typed (prompt counts). All three are
# held to tests/fixtures/typed-prompts.tsv, and tests/unit/typed_prefixes.bats fails when a
# writer below types a text no line here starts. Harness text (task notifications, reminders,
# compaction summaries) is not the fleet's and is not here: jsonl.rs HARNESS and claude-recall
# HARNESS_PREFIXES hold it.

# fleet-shepherd close_sample; the human's own /wind-down ends the session too
task /wind-down
# fleet-dispatch RESTORE_PROMPT
resume fleet-dispatch restore reopened
# fleet-dispatch item_brief, resume_brief, trainee_batch_task: one line of every brief starts so
task This is agent-queue item
# agent-ask deliver and reopen_session
task Answer to ask
# claude-acct resume_prompt, park and move
resume This session was parked
resume This session was moved
# claude-acct-auth.sh WAKE_TEXT
resume You were signed out and are signed in again.
# No writer since 2026-10-30 (the old claude-acct move); drop once those transcripts prune, about 2026-11-30.
resume Moved to the alt Claude account
