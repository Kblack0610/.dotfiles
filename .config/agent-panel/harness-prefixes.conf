# Text the Claude harness puts in a user turn that nobody typed: its tags, its notices and its
# prose. A prompt is harness text when it starts, leading whitespace aside, with a line below.
# Nothing in it is the human, so it answers no ask and marks no presence. Each prose line is
# the harness's whole opening words, so a reply the human starts with "Caveat:" is still theirs.
#
# Readers: agent-ask settle-session through .local/lib/typed-prefixes.sh harness_text (the
# UserPromptSubmit hook ask-settle.sh), agent-core transcript/prompt.rs (compiled in, so a change
# here needs the rebuild dotfiles-autopull runs), claude-recall harness_prefixes. What the fleet
# types as if it were the human is typed-prefixes.conf, not here.
#
# Before this was one table, the hook kept its own list and missed notices: a delivery notice
# cancelled ask TjCYY9, idle notices cancelled JC28Rf and PaIYoy (2026-11-18, ar-3487).

<task-notification
<system-reminder
<cross-session-message
<local-command
# a peer session's message, as the hook payload carries it
<agent-message
# delivery and idle notices from another session's harness
[Cross-session
[SYSTEM NOTIFICATION - NOT USER INPUT]
This session is being continued from a previous conversation
Stop hook feedback:
[Request interrupted
Another Claude session sent a message
Caveat: The messages below were generated by the user while running local commands
