# Topics for the agent panel's search (Prefix+g): `<topic> <word> <word> ...`. Typing a topic
# matches a session whose row, past titles, prompts, branch or files hold the topic or any of its
# words, so "audio" finds a session that only ever said "music" or "speaker". A topic's words
# match at the start of a word ("sound" matches "soundcard", "helm" not "overwhelm"), so keep
# them specific. Read at each run; no rebuild needed.
audio music sound speaker headphone microphone volume pipewire wireplumber snapcast spotify turntable focusrite scarlett reaper alsa playback
network wifi wi-fi openwrt router dns tailscale tunnel ethernet
cluster k8s k3s kubectl helm ingress pod
phone android adb termux
