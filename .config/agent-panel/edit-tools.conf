# The Claude Code tools that write a file, one name a line. A call of one is an edit: the session
# changed a file (claude-recall write_paths and answer-lag, agent-core edited_files, the session
# register's meaningful gate, fleet-sessions' "editing" activity, session-outcomes' since-edit and
# lesson counts, agent-usage-burn's write turns). Each input names its file in file_path, or
# notebook_path for NotebookEdit.
#
# Readers: agent-core transcript/usage.rs and plan.rs (compiled in, so a change here needs the rebuild
# dotfiles-autopull runs), .local/lib/edit-tools.sh (shell and jq), claude-recall and
# agent-usage-burn.py (Python, by the path beside the script). The settings.json hook matchers
# cannot read a file and keep their own list.
Edit
Write
MultiEdit
NotebookEdit
