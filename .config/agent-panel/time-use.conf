# Which command is a merge gate, a test run or a build: `gate <text>`, `test <text>` or `build <text>`.
# The one list. agent-panel's time_use (agent-core time_use.rs `runs`) reads it for time by what was
# running, session-outcomes.sh for test_runs (test) and ci_polls (gate), agent-usage-burn.py for the
# wait turn (gate), fleet-sessions for a live process (still a plain substring of its command line).
# A line counts where its text runs as a command. Heredoc bodies are dropped, the text of an
# `sh -c '...'` (or bash, zsh) is read as commands, and any other quoted string is read as empty.
# Then the text must start a command: at the start, or after ; & | ( a newline or a backtick, past
# NAME=value, env, nice, xargs, sudo, nohup, exec, command, time, stdbuf, setsid, ionice, sh,
# bash, zsh (and their -options; -n takes a number after it), timeout N (N starts with a digit),
# flock FILE, if, while, until, do, then, else, !, with any path before the text, and
# followed by the end or a character that is not a letter, digit, _ or . (so `make test` takes
# `make test-pr`). So `sed -n 1p x.bats`, a quoted pattern or a PR body that names a test command is
# not a run. Missed too: a command inside "$(...)", run over ssh, in a `{ ...; }` group, or after an option
# the text does not name (`make -C web test`, `uv run pytest`); add a line for one that matters. A text holds no ; & | ( quote
# or backtick.
# The first line that matches wins, so the gate lines come first. Any other command counts as `jobs`;
# a build counts as `jobs` too in time_use, and only fleet-sessions reads it apart, as a wait worth
# trusting where a plain job is a sleep loop. tests/fixtures/time-use-commands.tsv is the golden every
# reader asserts. Read at each run; no rebuild needed.
gate agent-land
gate ci-gate.sh
# The playground's gate-and-land.sh: runs the gate, opens the PR on green, then agent-land (ar-321).
gate gate-and-land.sh
gate Logs/land
gate gate-cmd.sh
gate gate-run.sh
gate Logs/regate.sh
# The playground's suite.sh, as a pull request runs it (--classes), pushes and becomes ci-gate.sh.
gate scripts/test/suite.sh
gate gh-run-wait
gate gh run watch
gate gh run view
gate gh pr checks
gate gh pr view
gate gh run list
test scripts/test/run.sh
test make -C tests test
test make test
test run-bats.sh
test tests/docker.sh
test agentctl-playground-night
test bats
test cargo test
test pytest
test python -m pytest
test python3 -m pytest
test python -m unittest
test python3 -m unittest
test vitest
test npx vitest
test pnpm exec vitest
test playwright test
test npx playwright test
test pnpm exec playwright test
test go test
test pnpm test
test pnpm run test
test npm test
test npm run test
test yarn test
# A Unity authoring run (unity-core-playground): it queues on the Unity slot flock, so most of its
# time is a wait on the slot, not a hang.
build unity-method.sh
