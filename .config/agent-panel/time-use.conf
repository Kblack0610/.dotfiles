# Which commands agent-panel's time_use counts as a merge gate or a test run: `gate <text>` or
# `test <text>`, matched as plain text anywhere in a Bash or Monitor command. The first line that
# matches wins, so the gate lines come first. Any other command counts as `jobs`. A match only
# matters when the command is still running through a gap of 5 minutes or more, which is why a
# quick `gh pr view` does not need excluding. Read at each run; no rebuild needed.
gate ci-gate.sh
gate scripts/test/suite.sh
gate gh run watch
gate gh run view
gate gh pr checks
gate gh pr view
gate gh run list
test scripts/test/run.sh
test make -C tests
test tests/docker.sh
test bats
test cargo test
test pytest
test unittest
test vitest
test playwright test
test go test
test pnpm test
test npm test
