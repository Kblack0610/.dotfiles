# Which commands agent-panel's time_use counts as a merge gate, a test run or a build: `gate <text>`,
# `test <text>` or `build <text>`, matched as plain text anywhere in a Bash or Monitor command. The
# first line that matches wins, so the gate lines come first. Any other command counts as `jobs`; a
# build counts as `jobs` too in time_use (no stat of its own), and only fleet-sessions reads it
# apart, as a wait worth trusting where a plain job is a sleep loop. A match only
# matters when the command is still running through a gap of 5 minutes or more, which is why a
# quick `gh pr view` does not need excluding. Read at each run; no rebuild needed.
gate agent-land
gate ci-gate.sh
gate Logs/land
gate gate-cmd.sh
gate gate-run.sh
gate Logs/regate.sh
gate scripts/test/suite.sh
gate gh-run-wait
gate gh run watch
gate gh run view
gate gh pr checks
gate gh pr view
gate gh run list
test scripts/test/run.sh
test make -C tests
test tests/docker.sh
test agentctl-playground-night
test bats
test cargo test
test pytest
test unittest
test vitest
test playwright test
test go test
test pnpm test
test npm test
# A Unity authoring run (unity-core-playground): it queues on the Unity slot flock, so most of its
# time is a wait on the slot, not a hang.
build unity-method.sh
