# The copy checks of .local/bin/shape-grow, read at the base commit, so a PR cannot loosen its own
# check. This file being here turns them on for this repo; the CI lint job (under gate) and
# pre-push run them.
#   name <glob>...      a function or constant name any tool may define
#   skip <path glob>    a path never indexed or checked
#   block-lines <n>     how many significant lines make a block copy
# Tuned 2026-11-24 over the last 200 merged PRs (plan everything-should-wondrous-snail, P1): at 6 the
# copy checks flagged 7 lines in 7 PRs, 4 real copies and 3 namesakes; 5 added 9 block hits, mostly
# boilerplate; 8 missed two real in-file copies.

block-lines 6

skip tests/vendor/*
skip tests/unit/*
skip tests/integ/*
skip tests/ui/*
skip tests/fixtures/*

name main usage die log cleanup cmd_*
