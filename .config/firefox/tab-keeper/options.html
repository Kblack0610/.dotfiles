<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tab Keeper</title>
    <style>
      body { font: 14px sans-serif; margin: 2rem auto; max-width: 56rem; padding: 0 1rem; }
      textarea { box-sizing: border-box; font: 13px monospace; width: 100%; }
      textarea { height: 18rem; }
      pre { background: #8881; max-height: 28rem; overflow: auto; padding: 0.5rem; }
      #problem { color: #c33; font-weight: 600; }
      label { display: block; font-weight: 600; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <h1>Tab Keeper</h1>
    <p id="problem"></p>
    <label for="config">Settings, from the Firefox policy</label>
    <textarea id="config" readonly spellcheck="false"></textarea>
    <p>Edit them in <code>~/.dotfiles-private/.config/firefox/policies.local.json</code>, rerun <code>~/.dotfiles/.config/firefox/install.sh</code>, then restart Firefox. The Karakeep key comes from rbw the same way.</p>
    <p><button id="grant">Grant Karakeep access</button> <button id="tick">Run a tick now</button> <span id="status"></span></p>
    <h2>Log, newest first</h2>
    <pre id="log"></pre>
    <script src="rules.js"></script>
    <script src="options.js"></script>
  </body>
</html>
