# Numbers about the state document (~/.local/state/fleet-sessions/state.json), KEY=value, one per line.
# fleet-sessions reads it at run time (close --self, close --view); hub-core home.rs includes it at
# build time (hub Home, queue and the Fleet tab). No default in any reader.
#
# FLEET_STATE_STALE_SECS  a document older than this many seconds is stale: fleet-state.timer rewrites
#                         it every minute, so 5 minutes is five missed ticks. Readers then name the
#                         timer or wait, instead of showing an old list as if it were now.
FLEET_STATE_STALE_SECS=300
