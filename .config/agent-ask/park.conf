# agent-ask park: how long a parked ask stays off the boards, and when a pending ask closes itself.
#
# PARK_DAYS: the days `park` with no --until keeps an ask off the boards, and the days `expire` parks
# an idle one. The key is the priority of the queue item the ask holds (its `task:` item when nothing
# holds on it); an ask with no item reads as normal. Provisional, confidence medium: set 2026-11-11
# for asks that wait on the human's hands (a headset, a drone).
PARK_DAYS="urgent=1 high=3 normal=7 low=14"
# AUDIT_HOURS: a judge audit nobody reviewed in this many hours is cancelled (`expire`); an expired
# audit scores as silence, as an unanswered one did. Provisional, confidence medium: set 2026-11-19 from
# 20 audits the human reviewed (median 7h, 18 under 24h, the others at 37h and 44h). Revisit when the
# human answers an audit after it expired, or more than 1 in 10 of their reviews come past this.
AUDIT_HOURS=24
# IDLE_DAYS: a pending ask this old with no live session and no queue item waiting on it is parked for
# its PARK_DAYS (`parked_by: idle`); back from that park and still idle, it is cancelled. Provisional,
# confidence medium: set 2026-11-19, when 3 human-physical asks sat 4 to 8 days with no session.
# Revisit when the human asks for an ask `expire` closed.
IDLE_DAYS=3
